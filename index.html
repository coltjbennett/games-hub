(async()=>{'use strict';

blob(x,y,z,rx,ry,rz,k,w=0,s=5){const g=[],n=s*2;for(let i=0;i<=s;i++){const a=Math.PI*i/s;g.push([]);for(let j=0;j<n;j++){const b=Math.PI*2*j/n;g[i].push([x+rx*Math.sin(a)*Math.cos(b),y+ry*Math.cos(a),z+rz*Math.sin(a)*Math.sin(b)])}}
