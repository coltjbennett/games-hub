<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#008080">
<title>Trailsmith</title>
<style>
@font-face{font-family:W95FA;src:url('../images/w95f.woff2') format('woff2'),url('../images/w95f.woff') format('woff');font-display:swap}
:root{--face:#c0c0c0;--hi:#fff;--lt:#dfdfdf;--sh:#808080;--dk:#404040;--navy:#000080;--navy2:#1084d0;--teal:#008080;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
--ui:W95FA,"MS Sans Serif",Tahoma,Geneva,Verdana,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#5aa0d8;color:#000;font:14px/1.2 var(--ui);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:default}
#app{position:fixed;inset:0;pointer-events:none;z-index:5}
#app>*{pointer-events:auto;position:absolute}
/* ---- Win95 primitives ---- */
.raised{background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--lt)}
.sunken{background:var(--face);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk),inset -1px -1px var(--lt)}
.btn{font:inherit;color:#000;background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--lt);padding:3px 9px;min-height:28px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;touch-action:manipulation}
.btn:active,.btn.on{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--sh),inset -1px -1px var(--lt);padding:4px 8px 2px 10px}
.btn.on{background:repeating-conic-gradient(#c0c0c0 0 25%,#fff 0 50%) 0 0/2px 2px}
.btn[disabled]{color:var(--sh);text-shadow:1px 1px #fff;cursor:default}
.btn.big{min-height:36px;padding:4px 14px;font-weight:bold}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:1px dotted #000;outline-offset:-5px}
.win{position:absolute;background:var(--face);border:2px solid;border-color:var(--hi) #000 #000 var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--lt),3px 3px 0 rgba(0,0,0,.35);padding:3px}
.tbar{display:flex;align-items:center;gap:6px;height:24px;padding:2px 3px 2px 6px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;font-weight:bold;touch-action:none}
.tbar.idle{background:linear-gradient(90deg,#808080,#b8b8b8)}
.tbar .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar .x{min-height:0;width:20px;height:18px;padding:0;font-weight:bold;line-height:1}
.body{padding:8px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row>label{flex:0 0 96px}
.row>.grow{flex:1;min-width:0}
select.grow{width:0}
fieldset{border:2px groove var(--hi);margin:6px 0;padding:6px 8px}
legend{padding:0 4px}
select,input[type=text],textarea{font:inherit;color:#000;background:#fff;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk);padding:3px 4px;min-height:26px;max-width:100%}
textarea{width:100%;resize:none;font:12px/1.25 ui-monospace,Consolas,monospace;user-select:text;-webkit-user-select:text}
input[type=range]{-webkit-appearance:none;appearance:none;height:26px;background:transparent;margin:0;width:100%;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--sh);border:1px solid;border-color:var(--dk) var(--hi) var(--hi) var(--dk)}
input[type=range]::-moz-range-track{height:4px;background:var(--sh);border:1px solid;border-color:var(--dk) var(--hi) var(--hi) var(--dk)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:24px;margin-top:-11px;background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh)}
input[type=range]::-moz-range-thumb{width:12px;height:22px;border-radius:0;background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi)}
.val{flex:0 0 44px;text-align:right}
input[type=checkbox]{width:16px;height:16px;margin:0 6px 0 0;accent-color:#000080}
/* ---- menu bar ---- */
#menubar{position:absolute;left:0;right:0;top:0;height:28px;display:flex;align-items:stretch;padding:1px 2px;padding-top:calc(1px + var(--safe-t));height:calc(28px + var(--safe-t));z-index:30;border-width:0 0 2px 0;border-color:var(--sh);box-shadow:0 1px 0 var(--hi)}
#menubar .mi{position:relative;display:flex}
#menubar .mi>.mt{padding:0 9px;display:flex;align-items:center;cursor:default;border:1px solid transparent;touch-action:manipulation}
#menubar .mi.open>.mt{background:var(--navy);color:#fff}
.dd{position:absolute;top:100%;left:0;min-width:210px;z-index:40;padding:2px}
.dd .it{display:flex;align-items:center;gap:8px;padding:7px 22px 7px 24px;position:relative;white-space:nowrap;cursor:default;touch-action:manipulation}
.dd .it:hover{background:var(--navy);color:#fff}
.dd .it.chk::before{content:"\2713";position:absolute;left:7px}
.dd .it.dis{color:var(--sh);pointer-events:none}
.dd hr{border:0;border-top:1px solid var(--sh);border-bottom:1px solid var(--hi);margin:3px 1px}
.dd .it kbd{margin-left:auto;font:inherit;opacity:.75;padding-left:16px}
#mode{margin-left:auto;display:flex;align-items:center;gap:6px;padding-right:6px}
#modeTag{padding:2px 8px}
/* ---- parts window ---- */
#parts{left:calc(6px + var(--safe-l));top:calc(34px + var(--safe-t));bottom:calc(34px + var(--safe-b) + var(--tbh,44px));width:216px;display:flex;flex-direction:column;z-index:10}
#tabs{display:flex;flex-wrap:wrap;gap:0;padding:4px 2px 0}
#tabs .tab{flex:1 0 32%;font-size:12px;padding:4px 1px;text-align:center;cursor:pointer;border:2px solid;border-color:var(--hi) var(--dk) transparent var(--hi);background:var(--face);margin-top:2px;position:relative;touch-action:manipulation}
#tabs .tab.on{margin-top:0;padding-top:7px;z-index:2;margin-bottom:-2px;border-bottom:0}
#grid{flex:1;overflow-y:auto;overflow-x:hidden;margin:0 2px;padding:6px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;align-content:start;touch-action:pan-y;background:#fff;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk)}
.part{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;font-size:12px;text-align:center;line-height:1.1;cursor:pointer;background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh);touch-action:manipulation;min-width:0}
.part img,.part .ph{width:64px;height:64px;image-rendering:auto;background:#7fb4e6;border:1px solid var(--dk);display:block}
.part.sel{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--sh);background:#000080;color:#fff}
.part small{opacity:.8;font-size:11px}
#colors{padding:6px 6px 4px;display:flex;flex-wrap:wrap;gap:3px;margin:2px 2px 0}
.sw{width:22px;height:22px;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);cursor:pointer;padding:0;touch-action:manipulation}
.sw.sel{outline:2px solid #000;outline-offset:1px}
#colors input[type=color]{width:26px;height:26px;padding:0;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);background:var(--face)}
/* ---- bottom toolbar & status ---- */
#toolbar{left:calc(6px + var(--safe-l));right:calc(6px + var(--safe-r));bottom:calc(26px + var(--safe-b));padding:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;z-index:10}
#toolbar .sep{width:2px;align-self:stretch;margin:0 3px;border-left:1px solid var(--sh);border-right:1px solid var(--hi)}
#toolbar .sp{flex:1}
#status{left:0;right:0;bottom:0;height:calc(24px + var(--safe-b));padding:2px 4px;padding-bottom:calc(2px + var(--safe-b));display:flex;gap:3px;z-index:11;border:0;border-top:1px solid var(--hi);background:var(--face)}
#status span{padding:1px 8px;border:1px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status span:first-child{flex:1}
/* ---- drive HUD ---- */
#hud{inset:0;pointer-events:none!important;z-index:9}
#hud>*{pointer-events:auto}
#dash{position:absolute;left:50%;transform:translateX(-50%);top:calc(36px + var(--safe-t));display:flex;gap:6px;padding:4px}
#dash .cell{min-width:76px;padding:2px 8px;text-align:center}
#dash b{font-size:20px;display:block}
#dash small{font-size:11px}
#hudBtns{position:absolute;right:calc(6px + var(--safe-r));top:calc(36px + var(--safe-t));display:flex;flex-direction:column;gap:4px;align-items:stretch}
#raceBox{position:absolute;left:calc(6px + var(--safe-l));top:calc(36px + var(--safe-t));padding:4px 8px;min-width:150px}
/* ---- touch controls ---- */
#touch{inset:0;pointer-events:none!important;z-index:8}
#touch>*{pointer-events:auto}
.ti{position:absolute;transform:translate(-50%,-50%);touch-action:none}
.stick{border-radius:50%;background:rgba(192,192,192,.45);border:2px solid rgba(0,0,0,.55)}
.stick .knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -2px -2px var(--sh)}
.stick .lbl{position:absolute;left:0;right:0;top:-18px;text-align:center;font-size:12px;color:#fff;text-shadow:1px 1px #000}
.tb{font-weight:bold;font-size:14px;padding:0 4px;overflow:hidden;white-space:nowrap}
#ctlEdit{inset:0;z-index:55;background:rgba(8,16,32,.55)}
#ctlEdit .ti{cursor:grab}
#ctlEdit .ti.sel{outline:3px dashed #ffee33;outline-offset:3px}
#cePanel{left:50%;transform:translateX(-50%);top:calc(34px + var(--safe-t));width:min(700px,97vw);z-index:3}
#cePanel .row{flex-wrap:wrap;margin:4px 0}
#cePanel .row>label{flex:0 0 auto}
body.driving #toast{bottom:auto;top:calc(120px + var(--safe-t))}
/* ---- windows / dialogs ---- */
#cfg{width:300px;max-width:calc(100vw - 12px);z-index:50}
#cfg .body{max-height:calc(100vh - 120px);overflow-y:auto;touch-action:pan-y}
#dlgLayer{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;padding:8px}
#dlg{position:relative;width:420px;max-width:100%;max-height:100%;display:flex;flex-direction:column}
#dlg .body{overflow:auto;touch-action:pan-y}
#dlg .btns{display:flex;gap:8px;justify-content:flex-end;padding:0 8px 8px;flex-wrap:wrap}
#dlg .btns .btn{min-width:78px}
.slot{display:flex;gap:6px;align-items:center;margin:4px 0}
.slot .nm{flex:1;padding:3px 6px;min-height:28px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.helpt td{padding:2px 8px 2px 0;vertical-align:top}
.helpt td:first-child{white-space:nowrap;font-weight:bold}
#toast{position:absolute;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);padding:6px 14px;z-index:70;pointer-events:none!important;max-width:92vw;text-align:center;border-color:#fff #000 #000 #fff;background:#ffffe1;transition:opacity .25s}
#loading{position:fixed;inset:0;z-index:100;background:#008080;display:flex;align-items:center;justify-content:center}
#loading .win{width:320px;max-width:92vw}
#bar{height:22px;margin-top:8px;padding:2px;display:flex;gap:2px}
#bar i{flex:0 0 12px;background:var(--navy)}
#cursorTip{position:absolute;pointer-events:none!important;z-index:20;padding:2px 6px;background:#ffffe1;border:1px solid #000;font-size:12px;white-space:nowrap}
/* ---- narrow / touch layout ---- */
@media (max-width:760px),(max-height:520px){
 #menubar .mi>.mt{padding:0 6px}
 #parts{left:calc(4px + var(--safe-l));right:calc(4px + var(--safe-r));top:auto;width:auto;height:140px;bottom:calc(30px + var(--safe-b) + var(--tbh,44px))}
 #parts .tbar{display:none}
 #tabs .tab{padding:3px 2px}#tabs .tab.on{padding-top:5px}
 #grid{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:92px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x}
 .part img,.part .ph{width:52px;height:52px}
 #colors{display:none}
 #toolbar{gap:3px}
 #toolbar .btn{padding:2px 6px;min-height:30px}
 #toolbar .lg{display:none}
 .dd .it{padding-top:10px;padding-bottom:10px}
}
@media (max-height:520px){#parts{height:104px}.part small{display:none}.part img,.part .ph{width:38px;height:38px}#grid{grid-auto-columns:72px;padding:4px}}
@media (max-width:760px){#dash{left:calc(6px + var(--safe-l));transform:none;top:calc(34px + var(--safe-t))}#dash .cell{min-width:60px}#dash b{font-size:17px}#hudBtns .btn{min-height:26px;font-size:12px;padding:2px 6px}#hudBtns{top:calc(34px + var(--safe-t))}#raceBox{top:calc(92px + var(--safe-t))}}
@media (pointer:coarse){.btn{min-height:34px}.sw{width:28px;height:28px}}
@media (max-width:480px){#mode{display:none}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="Trailsmith 3D workshop and test track"></canvas>

<div id="loading"><div class="win"><div class="tbar"><span class="t">Trailsmith</span></div><div class="body"><div id="loadMsg">Loading 3D engine...</div><div id="bar" class="sunken"></div></div></div></div>

<div id="app">
 <div id="menubar" class="raised" role="menubar"></div>

 <div id="parts" class="win">
  <div class="tbar"><span class="t">Parts</span></div>
  <div id="tabs" role="tablist"></div>
  <div id="grid"></div>
  <div id="colors"></div>
 </div>

 <div id="toolbar" class="raised"></div>
 <div id="status" class="raised"><span id="stMsg">Ready</span><span id="stBlocks">Blocks: 0</span><span id="stMass" class="lg">Mass: 0</span><span id="stFps">-- fps</span></div>

 <div id="hud" hidden>
  <div id="dash" class="raised"><div class="cell sunken"><b id="dSpd">0</b><small>km/h</small></div><div class="cell sunken"><b id="dAlt">0</b><small>m up</small></div><div class="cell sunken"><b id="dInt">100</b><small>% intact</small></div><div class="cell sunken"><b id="dBiome" style="font-size:13px;line-height:26px">-</b><small>area</small></div></div>
  <div id="hudBtns"><button class="btn big" id="bBack" type="button">&#9664; Build (Esc)</button><button class="btn" id="bReset" type="button">Upright (R)</button><button class="btn" id="bResp" type="button">Respawn (T)</button><button class="btn" id="bTravel" type="button">Fast travel</button><button class="btn" id="bCam" type="button">Camera: Follow</button><button class="btn" id="bRace" type="button">Race: Off</button></div>
  <div id="raceBox" class="raised" hidden></div>
 </div>

 <div id="touch" hidden></div>
 <div id="ctlEdit" hidden></div>

 <div id="cfg" class="win" hidden></div>
 <div id="dlgLayer" hidden><div id="dlg" class="win"></div></div>
 <div id="toast" class="raised" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
/* ==========================================================================
   TRAILSMITH - a vehicle-building sandbox (inspired by Trailmakers)
   Single self-contained file. Libraries: Three.js r128 (cdnjs) + cannon-es 0.20.0 (jsDelivr / unpkg)
   Everything else (models, textures, UI, sound-free) is generated in code.
   ========================================================================== */
const GAME_TITLE = 'Trailsmith';
const SAVE_PREFIX = 'ts_';
const THREE = window.THREE;
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
const LS = {
  get(k, d) { try { const v = localStorage.getItem(SAVE_PREFIX + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(SAVE_PREFIX + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(SAVE_PREFIX + k); } catch (e) {} }
};
function loadStep(msg, n) { const m = $('#loadMsg'); if (m) m.textContent = msg; const b = $('#bar'); if (b) { b.innerHTML = ''; for (let i = 0; i < n; i++) b.appendChild(document.createElement('i')); } }
function failLoad(msg) {
  const m = $('#loadMsg'); m.textContent = msg + ' Check your connection, then try again.';
  const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'Retry'; b.style.marginTop = '8px'; b.onclick = () => location.reload(); m.appendChild(document.createElement('br')); m.appendChild(b);
}
if (!THREE) { failLoad('Could not load Three.js.'); throw new Error('three missing'); }
loadStep('Loading physics engine...', 4);
let CANNON = null;
for (const u of ['https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js', 'https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js']) {
  try { CANNON = await import(u); break; } catch (e) { /* try next CDN */ }
}
if (!CANNON) { failLoad('Could not load cannon-es.'); throw new Error('cannon missing'); }
loadStep('Building the workshop...', 8);

/* ---------------------------------------------------------------- rotation helpers (3x3 integer matrices, row-major) */
const I3 = [1, 0, 0, 0, 1, 0, 0, 0, 1];
const RX90 = [1, 0, 0, 0, 0, -1, 0, 1, 0], RY90 = [0, 0, 1, 0, 1, 0, -1, 0, 0], RZ90 = [0, -1, 0, 1, 0, 0, 0, 0, 1];
const mmul = (a, b) => { const r = new Array(9); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j]; return r.map(v => v === 0 ? 0 : v); };
const mvec = (m, v) => [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]].map(x => x === 0 ? 0 : x);
const mconjX = m => { const s = [-1, 1, 1]; return m.map((v, k) => { const r = (k / 3) | 0, c = k % 3; const o = v * s[r] * s[c]; return o === 0 ? 0 : o; }); };
const rotQuat = m => new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().set(m[0], m[1], m[2], 0, m[3], m[4], m[5], 0, m[6], m[7], m[8], 0, 0, 0, 0, 1));
const validRot = m => Array.isArray(m) && m.length === 9 && m.every(v => v === 0 || v === 1 || v === -1);

/* ---------------------------------------------------------------- block catalogue */
const AXES = [['none', 'Off'], ['always', 'Always on'], ['drive', 'Forward / Back (W / S)'], ['steer', 'Steer (A / D)'], ['lift', 'Up / Down (Space / Shift)'], ['pitch', 'Pitch (Arrow Up / Down)'], ['roll', 'Roll (Arrow Left / Right)'], ['brake', 'Brake (X)'], ['fire', 'Fire (F)'], ['aux1', 'Aux 1 (Q / E)'], ['aux2', 'Aux 2 (J / L)']];
const MATERIAL = [['std', 'Standard'], ['light', 'Lightweight (half mass, weaker)'], ['heavy', 'Heavy (triple mass, tougher)']];
const pr = (k, label, type, def, o) => Object.assign({ k, label, type, def }, o || {});
const rng = (k, label, min, max, step, def, unit) => pr(k, label, 'range', def, { min, max, step, unit: unit || '%' });
const sel = (k, label, opts, def) => pr(k, label, 'select', def, { opts });
const axisP = def => sel('axis', 'Controlled by', AXES, def), invP = label => pr('invert', label || 'Invert control', 'check', false);
const PROPS = {
  struct: [sel('material', 'Material', MATERIAL, 'std')],
  seat: [rng('assist', 'Stabilizer', 0, 100, 5, 35)],
  wheel: [rng('power', 'Motor power', 0, 200, 5, 100), rng('brake', 'Brake force', 0, 200, 5, 100), rng('grip', 'Grip', 20, 220, 5, 100)],
  hinge: [axisP('steer'), rng('range', 'Swing range', 5, 90, 5, 35, ' deg'), rng('speed', 'Speed', 1, 12, 1, 5, ''), invP()],
  servo: [axisP('aux1'), rng('speed', 'Spin speed', 10, 400, 10, 120, ' rpm'), invP()],
