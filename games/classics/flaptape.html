<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"><title>Flap Tape</title><style>canvas{height:74vh;max-width:96vw}</style></head><body>
<div class="hud"><span>SCORE <b id="s">0</b></span><span>BEST <b id="h">0</b></span></div><canvas id="c" width="320" height="480"></canvas><div class="msg" id="m">Tap, click or press Space to flap.</div>
<script src="_arcade.js"></script><script>
(function(){var cv=document.getElementById('c'),x=cv.getContext('2d'),hs=Arc.hs('flaptape'),y,vy,pipes,sc,fr,state,GAP=124;
function init(){y=220;vy=0;pipes=[];sc=0;fr=0;state='ready';document.getElementById('m').textContent='Tap, click or press Space to flap.';}
function flap(){if(state==='over'){init();return;}if(state==='ready')state='run';vy=-6.6;}
function step(){if(state!=='run'){if(state==='ready')y=220+Math.sin(Date.now()/200)*6;return;}fr++;vy+=.38;y+=vy;if(fr%88===1)pipes.push({x:330,g:90+Math.random()*(480-GAP-180),p:false});pipes.forEach(function(p){p.x-=2.2;if(!p.p&&p.x+44<80){p.p=true;sc++;if(sc===10)Arc.emit('flaptape:10');}});pipes=pipes.filter(function(p){return p.x>-50;});
 var hit=y<8||y>452;pipes.forEach(function(p){if(80+14>p.x&&80-14<p.x+44&&(y-12<p.g||y+12>p.g+GAP))hit=true;});if(hit){state='over';hs.set(sc);document.getElementById('m').textContent='Game over! Tap to try again.';}}
function draw(){x.fillStyle='#008080';x.fillRect(0,0,320,480);x.fillStyle='#808080';for(var i=0;i<6;i++)x.fillRect((i*70-fr*.5%70+70)%350-30,380+(i%2)*10,50,100);pipes.forEach(function(p){x.fillStyle='#008000';x.fillRect(p.x,0,44,p.g);x.fillRect(p.x,p.g+GAP,44,480);x.fillStyle='#000080';x.fillRect(p.x-3,p.g-14,50,14);x.fillRect(p.x-3,p.g+GAP,50,14);});
 x.save();x.translate(80,y);x.rotate(Math.max(-.5,Math.min(1,vy/10)));x.fillStyle='#ffcc33';x.beginPath();x.arc(0,0,14,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(0,0,5,0,7);x.fill();x.fillStyle='#fff';x.fillRect(3,-4,3,3);x.restore();
 x.fillStyle='#fff';x.font='bold 36px Courier New';x.textAlign='center';x.fillText(sc,160,60);x.textAlign='left';document.getElementById('s').textContent=sc;document.getElementById('h').textContent=hs.get();}
function loop(){step();draw();requestAnimationFrame(loop);}
document.addEventListener('keydown',function(e){if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();flap();}});cv.addEventListener('pointerdown',flap);init();loop();})();
</script></body></html>
