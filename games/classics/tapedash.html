<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"><title>Tape Dash</title><style>canvas{width:min(96vw,640px);max-height:50vh}</style></head><body>
<div class="hud"><span>SCORE <b id="s">0</b></span><span>BEST <b id="h">0</b></span></div><canvas id="c" width="640" height="220"></canvas><div class="msg" id="m">Space / ↑ / tap to jump · ↓ to duck. Tapey runs, you decide.</div>
<script src="_arcade.js"></script><script>
(function(){var cv=document.getElementById('c'),x=cv.getContext('2d'),hs=Arc.hs('tapedash'),GY=180;
var p,obs,sc,spd,run,fr,over,clouds;
function init(){p={y:GY,vy:0,duck:false};obs=[];sc=0;spd=5;run=true;fr=0;over=false;clouds=[{x:100,y:40},{x:420,y:70}];document.getElementById('m').textContent='Space / ↑ / tap to jump · ↓ to duck.';}
function jump(){if(over){init();return;}if(p.y>=GY){p.vy=-12.5;}}
function spawn(){var f=Math.random()<.22&&sc>200;obs.push(f?{x:660,y:GY-52,w:34,h:18,fly:true}:{x:660,y:GY-(20+Math.random()*22|0),w:22+Math.random()*18|0,h:0,fly:false,cac:true});var o=obs[obs.length-1];if(o.cac){o.h=GY-o.y;}}
function step(){if(over)return;fr++;sc+=spd/10;spd=Math.min(13,5+sc/260);p.vy+=.75;p.y+=p.vy;if(p.y>GY){p.y=GY;p.vy=0;}
 if(fr%Math.max(34,Math.floor(95-spd*4))===0&&Math.random()<.85)spawn();obs.forEach(function(o){o.x-=spd;});obs=obs.filter(function(o){return o.x>-60;});clouds.forEach(function(c){c.x-=spd*.2;if(c.x<-60)c.x=680;});
 var ph=p.duck&&p.y>=GY?16:34,py=p.y-ph,pw=28;for(var i=0;i<obs.length;i++){var o=obs[i];var oy=o.cac?GY-o.h:o.y;if(o.x<60+pw-4&&o.x+o.w>60+4&&oy<p.y-2&&oy+(o.cac?o.h:o.h)>py+4){over=true;if(hs.set(Math.floor(sc)))document.getElementById('m').textContent='New best! Tap or press Space to run again.';else document.getElementById('m').textContent='Crashed! Tap or press Space to run again.';if(sc>=500)Arc.emit('tapedash:500');}}}
function draw(){x.fillStyle='#000';x.fillRect(0,0,640,220);x.fillStyle='#808080';clouds.forEach(function(c){x.fillRect(c.x,c.y,44,10);x.fillRect(c.x+8,c.y-6,26,8);});x.fillStyle='#000080';x.fillRect(0,GY,640,2);for(var i=0;i<20;i++)x.fillRect(((i*47-fr*spd)%660+660)%660,GY+8+(i%3)*6,10,2);
 var ph=p.duck&&p.y>=GY?16:34;x.fillStyle='#ffcc33';x.fillRect(60,p.y-ph,28,ph);x.fillStyle='#000';x.fillRect(76,p.y-ph+5,5,5);x.fillStyle='#fff';x.fillRect(78,p.y-ph+6,2,2);if(p.y>=GY){x.fillStyle='#ffcc33';x.fillRect(62+(fr>>2&1)*10,GY-2,8,4);}
 obs.forEach(function(o){if(o.cac){x.fillStyle='#008000';x.fillRect(o.x,GY-o.h,o.w,o.h);x.fillRect(o.x-6,GY-o.h+8,6,4);}else{x.fillStyle='#f33';x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#ff0';x.fillRect(o.x+(fr>>3&1)*8,o.y-4,10,4);}});
 x.fillStyle='#000080';x.font='14px Courier New';x.fillText(String(Math.floor(sc)).padStart(5,'0'),570,20);if(over){x.fillStyle='#ff0';x.font='22px Courier New';x.fillText('GAME OVER',250,100);}
 document.getElementById('s').textContent=Math.floor(sc);document.getElementById('h').textContent=hs.get();}
function loop(){step();draw();requestAnimationFrame(loop);}
document.addEventListener('keydown',function(e){if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){e.preventDefault();jump();}else if(e.key==='ArrowDown'||e.key==='s'){p.duck=true;}});document.addEventListener('keyup',function(e){if(e.key==='ArrowDown'||e.key==='s')p.duck=false;});cv.addEventListener('pointerdown',jump);
init();loop();})();
</script></body></html>
