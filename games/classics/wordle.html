<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"><title>Wordle</title>
<style>
body{justify-content:flex-start;padding-top:6px;gap:6px}
#top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13px}#top select,#top label{color:#000080}#top select{background:#c0c0c0;border:2px solid #000080;font:inherit;padding:3px;border-radius:6px}
#bd{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;width:min(78vw,40vh,300px);aspect-ratio:5/6}.r{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.r.sh{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.t{border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:clamp(18px,6vw,28px);color:#000;text-transform:uppercase;aspect-ratio:1}.t.f{border-color:#000 #000 #000 #000}.t.c{background:#008000;color:#fff;border-color:#004000}.t.p{background:#b8a000;color:#fff;border-color:#605000}.t.a{background:#808080;color:#fff;border-color:#404040}.t.flip{animation:fl .5s}@keyframes fl{50%{transform:scaleY(0)}}
#kb{display:flex;flex-direction:column;gap:5px;width:min(98vw,480px);margin-top:4px}.kr{display:flex;gap:4px;justify-content:center}.k{flex:1;max-width:44px;height:46px;font:14px W95FA,'MS Sans Serif',sans-serif;color:#000;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px 0 #808080;cursor:pointer;touch-action:manipulation;padding:0}.k.w{max-width:64px;flex:1.5;font-size:11px}.k.c{background:#008000;color:#fff}.k.p{background:#b8a000;color:#fff}.k.a{background:#808080;color:#fff}
#st{white-space:pre;font-size:13px;text-align:left;line-height:1.35}#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9}#ov.on{display:flex}#ov>div{background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:14px 18px;max-width:90vw;box-shadow:0 0 30px #808080;text-align:center}
</style></head><body>
<div id="top"><label>Mode <select id="md"><option value="daily">Daily word</option><option value="random">Random (common)</option><option value="diver">Dictionary Diver (any word)</option></select></label><label><input type="checkbox" id="hd"> Hard mode</label><button class="ab" id="nw" type="button">New</button><button class="ab" id="si" type="button">Stats</button></div>
<div class="msg" id="m">Loading the word list…</div><div id="bd"></div><div id="kb"></div>
<div id="ov"><div><div id="st"></div><br><button class="ab" id="sh" type="button">Copy result</button> <button class="ab" id="nx" type="button">Play again</button> <button class="ab" id="cl" type="button">Close</button></div></div>
<script src="_arcade.js"></script><script src="../../applets/words.js"></script><script>
(function(){
var W=window.GH_WORDS,msg=document.getElementById('m'),bd=document.getElementById('bd'),kb=document.getElementById('kb'),VALID,ANS,DIVER,ans,row,col,grid,over,keys={},hist,SK='gh-wordle-stats-v1',DK='gh-wordle-daily-v1';
function stats(){try{return JSON.parse(localStorage.getItem(SK))||{p:0,w:0,s:0,b:0,d:[0,0,0,0,0,0]};}catch(e){return {p:0,w:0,s:0,b:0,d:[0,0,0,0,0,0]};}}
function save(s){try{localStorage.setItem(SK,JSON.stringify(s));}catch(e){}}
if(!W){msg.textContent='Could not load the word list.';return;}
VALID=new Set(W.v);W.a.forEach(function(w){VALID.add(w);});W.h.forEach(function(w){VALID.add(w);});ANS=W.a;DIVER=W.h.concat(W.a);
function dayN(){var d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2022,0,1))/864e5);}
function pickAns(){var m=document.getElementById('md').value;if(m==='daily'){var n=dayN();return ANS[(n*7919+13)%ANS.length];}if(m==='diver')return DIVER[Math.random()*DIVER.length|0];return ANS[Math.random()*ANS.length|0];}
function build(){bd.textContent='';for(var r=0;r<6;r++){var rw=document.createElement('div');rw.className='r';for(var c=0;c<5;c++){var t=document.createElement('div');t.className='t';rw.appendChild(t);}bd.appendChild(rw);}
 kb.textContent='';['qwertyuiop','asdfghjkl','+zxcvbnm-'].forEach(function(l){var d=document.createElement('div');d.className='kr';l.split('').forEach(function(ch){var b=document.createElement('button');b.type='button';b.className='k'+(ch==='+'||ch==='-'?' w':'');b.textContent=ch==='+'?'ENTER':ch==='-'?'⌫':ch;b.dataset.k=ch;b.onclick=function(){press(ch);};d.appendChild(b);keys[ch]=b;});kb.appendChild(d);});}
function init(){ans=pickAns();row=0;col=0;over=false;hist=[];keys={};build();var m=document.getElementById('md').value;
 if(m==='daily'){var done=null;try{done=JSON.parse(localStorage.getItem(DK));}catch(e){}if(done&&done.n===dayN()){replay(done.g);return;}}
 msg.textContent=m==='diver'?'Dictionary Diver: the answer can be any real 5-letter word.':'Guess the 5-letter word in 6 tries.';}
function replay(g){g.forEach(function(w){for(var i=0;i<5;i++)type(w[i]);submit(true);});}
function type(ch){if(over||col>=5)return;var t=bd.children[row].children[col++];t.textContent=ch;t.classList.add('f');}
function press(k){if(over)return;if(k==='+')return submit();if(k==='-'){if(col>0){var t=bd.children[row].children[--col];t.textContent='';t.classList.remove('f');}return;}type(k);}
function score(g,a){var r=['a','a','a','a','a'],u=a.split('');for(var i=0;i<5;i++)if(g[i]===a[i]){r[i]='c';u[i]=null;}for(var j=0;j<5;j++){if(r[j]==='c')continue;var k=u.indexOf(g[j]);if(k>=0){r[j]='p';u[k]=null;}}return r;}
function bad(t){msg.textContent=t;var r=bd.children[row];r.classList.remove('sh');void r.offsetWidth;r.classList.add('sh');}
function submit(quiet){if(over||col<5){if(!quiet)bad('Not enough letters');return;}var cells=bd.children[row].children,g='';for(var i=0;i<5;i++)g+=cells[i].textContent;
 if(!VALID.has(g)){bad(g.toUpperCase()+' is not in the word list');return;}
 if(document.getElementById('hd').checked&&hist.length){var last=hist[hist.length-1],lg=last.g,ls=last.s;for(var h=0;h<5;h++){if(ls[h]==='c'&&g[h]!==lg[h]){bad('Hard mode: '+(h+1)+' must be '+lg[h].toUpperCase());return;}if(ls[h]==='p'&&g.indexOf(lg[h])<0){bad('Hard mode: guess must contain '+lg[h].toUpperCase());return;}}}
 var s=score(g,ans);hist.push({g:g,s:s});var rr=row;
 for(var j=0;j<5;j++){(function(j){setTimeout(function(){cells[j].classList.add('flip');setTimeout(function(){cells[j].classList.add(s[j]);var kk=keys[g[j]];if(kk){var cur=kk.className.match(/ (c|p|a)$/);var rank={a:1,p:2,c:3};if(!cur||rank[s[j]]>rank[cur[1]])kk.className='k '+s[j];}},250);},quiet?0:j*260);})(j);}
 row++;col=0;msg.textContent='';var wait=quiet?0:1500;
 if(g===ans){over=true;setTimeout(function(){end(true);},wait);}else if(row>=6){over=true;setTimeout(function(){end(false);},wait);}}
function end(win){var st=stats(),m=document.getElementById('md').value,fresh=!(m==='daily'&&daily());
 if(m==='daily'&&fresh){try{localStorage.setItem(DK,JSON.stringify({n:dayN(),g:hist.map(function(x){return x.g;})}));}catch(e){}}
 if(fresh){st.p++;if(win){st.w++;st.s++;st.b=Math.max(st.b,st.s);st.d[hist.length-1]++;}else st.s=0;save(st);}
 if(win){Arc.emit('win:wordle',{tries:hist.length,mode:m});}else Arc.emit('wordle:lose');
 var max=Math.max.apply(null,st.d.concat([1])),bars=st.d.map(function(n,i){return (i+1)+' '+'█'.repeat(Math.round(n/max*14))+' '+n;}).join('\n');
 document.getElementById('st').textContent=(win?'You got it in '+hist.length+'!':'The word was '+ans.toUpperCase())+'\n\nPlayed '+st.p+'   Won '+(st.p?Math.round(st.w/st.p*100):0)+'%   Streak '+st.s+'   Best '+st.b+'\n\n'+bars;
 document.getElementById('ov').classList.add('on');}
function daily(){try{var d=JSON.parse(localStorage.getItem(DK));return d&&d.n===dayN();}catch(e){return false;}}
document.getElementById('sh').onclick=function(){var em={c:'🟩',p:'🟨',a:'⬛'},t='ColtonOS Wordle '+(hist.length&&hist[hist.length-1].g===ans?hist.length:'X')+'/6\n'+hist.map(function(h){return h.s.map(function(x){return em[x];}).join('');}).join('\n');try{navigator.clipboard.writeText(t);msg.textContent='Result copied!';}catch(e){msg.textContent=t;}};
document.getElementById('cl').onclick=document.getElementById('si').onclick=function(){var o=document.getElementById('ov');if(this.id==='si'){var st=stats();document.getElementById('st').textContent='Played '+st.p+'   Won '+st.w+'\nStreak '+st.s+'   Best '+st.b+'\n\n'+st.d.map(function(n,i){return (i+1)+' '+'█'.repeat(Math.min(14,n))+' '+n;}).join('\n');o.classList.add('on');}else o.classList.remove('on');};
document.getElementById('nx').onclick=function(){document.getElementById('ov').classList.remove('on');if(document.getElementById('md').value==='daily')document.getElementById('md').value='random';init();};
document.getElementById('nw').onclick=function(){if(document.getElementById('md').value==='daily')document.getElementById('md').value='random';init();};
document.getElementById('md').onchange=init;
document.addEventListener('keydown',function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;if(document.getElementById('ov').classList.contains('on')){if(e.key==='Escape')document.getElementById('cl').click();return;}if(e.key==='Enter')press('+');else if(e.key==='Backspace')press('-');else if(/^[a-z]$/i.test(e.key))press(e.key.toLowerCase());});
init();})();
</script></body></html>
