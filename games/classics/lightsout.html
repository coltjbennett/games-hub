<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"><title>Lights Out</title>
<style>#b{display:grid;gap:6px;width:min(88vw,60vh,380px);aspect-ratio:1;padding:6px}.l{border:2px solid #000080;border-radius:8px;background:#c0c0c0;cursor:pointer;transition:background .12s,box-shadow .12s}.l.on{background:#ff0;box-shadow:0 0 16px #ff0;border-color:#fff}</style></head><body>
<div class="hud"><span>MOVES <b id="mv">0</b></span><span>LEVEL <b id="lv">1</b></span><button class="ab" id="nw" type="button">New Puzzle</button></div><div id="b"></div><div class="msg" id="m">Turn off every light. Pressing a light flips it and its neighbours.</div>
<script src="_arcade.js"></script><script>
(function(){var N=5,G,mv=0,lvl=1,b=document.getElementById('b'),done=false;
function tog(r,c){if(r>=0&&c>=0&&r<N&&c<N)G[r][c]^=1;}function press(r,c){[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){tog(r+d[0],c+d[1]);});}
function init(){N=Math.min(7,4+Math.ceil(lvl/3));G=[];for(var i=0;i<N;i++)G.push(new Array(N).fill(0));var n=3+lvl*2;for(var k=0;k<n;k++)press(Math.random()*N|0,Math.random()*N|0);if(G.every(function(r){return r.every(function(v){return !v;});}))press(1,1);mv=0;done=false;document.getElementById('m').textContent='Turn off every light. Pressing a light flips it and its neighbours.';draw();}
function draw(){b.textContent='';b.style.gridTemplateColumns='repeat('+N+',1fr)';G.forEach(function(row,r){row.forEach(function(v,c){var d=document.createElement('button');d.type='button';d.className='l'+(v?' on':'');d.setAttribute('aria-label','Light '+(r+1)+','+(c+1)+(v?' on':' off'));d.onclick=function(){if(done)return;press(r,c);mv++;draw();if(G.every(function(x){return x.every(function(y){return !y;});})){done=true;document.getElementById('m').textContent='Solved in '+mv+' moves! Next level...';Arc.emit('win:lightsout',{lvl:lvl});lvl++;setTimeout(init,1400);}};b.appendChild(d);});});document.getElementById('mv').textContent=mv;document.getElementById('lv').textContent=lvl;}
document.getElementById('nw').onclick=init;init();})();
</script></body></html>
