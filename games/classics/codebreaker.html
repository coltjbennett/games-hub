<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"><title>Code Breaker</title>
<style>#bd{display:flex;flex-direction:column;gap:5px;padding:8px;border:2px solid #000080;background:#c0c0c0}.row{display:flex;gap:8px;align-items:center}.pg{width:28px;height:28px;border-radius:50%;border:2px solid #808080;background:#000}.fb{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:32px}.fb i{width:12px;height:12px;border-radius:50%;background:#c0c0c0;display:block}.fb i.b{background:#fff}.fb i.w{background:#888}.cur{outline:2px solid #ff0;border-radius:6px}#pal{display:flex;gap:8px}#pal button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;cursor:pointer}</style></head><body>
<div class="hud"><span>TRY <b id="t">1</b>/10</span><button class="ab" id="nw" type="button">New Code</button></div><div id="bd"></div><div id="pal"></div><div class="hud"><button class="ab" id="del" type="button">⌫</button><button class="ab" id="ok" type="button">Guess</button></div><div class="msg" id="m">Crack the 4-colour code. ● white = right colour &amp; place, ● grey = right colour, wrong place. Colours may repeat.</div>
<script src="_arcade.js"></script><script>
(function(){var C=['#e22','#2c2','#26f','#fc0','#c3f','#0cc'],L=10,code,cur,turn,over,bd=document.getElementById('bd'),m=document.getElementById('m');
function init(){code=[0,0,0,0].map(function(){return Math.random()*6|0;});cur=[];turn=0;over=false;bd.textContent='';for(var r=0;r<L;r++){var row=document.createElement('div');row.className='row';row.id='r'+r;for(var i=0;i<4;i++){var p=document.createElement('div');p.className='pg';row.appendChild(p);}var f=document.createElement('div');f.className='fb';for(var j=0;j<4;j++)f.appendChild(document.createElement('i'));row.appendChild(f);bd.appendChild(row);}mark();document.getElementById('t').textContent=1;m.textContent='Crack the 4-colour code. White peg = right colour and place, grey = right colour, wrong place. Colours may repeat.';}
function mark(){var row=document.getElementById('r'+turn);if(!row)return;row.classList.add('cur');var p=row.querySelectorAll('.pg');p.forEach(function(e,i){e.style.background=cur[i]!=null?C[cur[i]]:'#000';});}
document.getElementById('pal').append.apply(document.getElementById('pal'),C.map(function(c,i){var b=document.createElement('button');b.type='button';b.style.background=c;b.setAttribute('aria-label','Colour '+(i+1));b.onclick=function(){if(over||cur.length>=4)return;cur.push(i);mark();};return b;}));
document.getElementById('del').onclick=function(){cur.pop();mark();};
document.getElementById('ok').onclick=function(){if(over||cur.length<4){m.textContent='Pick 4 colours first.';return;}var b=0,w=0,cc=code.slice(),gg=cur.slice();for(var i=0;i<4;i++)if(gg[i]===cc[i]){b++;cc[i]=gg[i]=-1;}for(var i2=0;i2<4;i2++){if(gg[i2]<0)continue;var k=cc.indexOf(gg[i2]);if(k>=0){w++;cc[k]=-1;}}
 var row=document.getElementById('r'+turn),f=row.querySelectorAll('.fb i');for(var q=0;q<b;q++)f[q].className='b';for(var q2=0;q2<w;q2++)f[b+q2].className='w';row.classList.remove('cur');
 if(b===4){over=true;m.textContent='Cracked it in '+(turn+1)+' tries!';Arc.emit('win:codebreaker',{tries:turn+1});return;}turn++;cur=[];if(turn>=L){over=true;m.innerHTML='Out of tries. The code was '+code.map(function(i){return '<span style="color:'+C[i]+'">●</span>';}).join(' ');return;}document.getElementById('t').textContent=turn+1;mark();};
document.getElementById('nw').onclick=init;init();})();
</script></body></html>
