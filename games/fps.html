        /* ==========================================================================
           4. MAIN GAME ENGINE
           ========================================================================== */
        class GameEngine {
            constructor() {
                this.container = document.getElementById('game-canvas');
                this.nametagContainer = document.getElementById('nametags-container');
                
                this.remotePlayers = {}; this.worldObjects = []; this.props = {}; this.jumpPads = [];
                this.input = { moveX: 0, moveZ: 0, yaw: 0, pitch: 0 };
                this.isLocked = false;
                
                this.curWIdx = 0; this.isAiming = false; this.isReloading = false;
                this.isFiring = false; this.nextFireAt = 0; this.currentSpread = 0;
                this.recoilPitchOffset = 0; this.launcherRecoilOffset = 0;
                this.projectiles = []; this.hitParticles = []; this.corpses = [];
                
                this.lastTime = performance.now();
                this.bobTime = 0; this.health = 100;

                this.isSprinting = false;

                this.initGraphics();
                this.initPhysics();
                this.initInput();

                window.addEventListener('resize', () => this.onResize());
                this.animate();
            }

            initGraphics() {
                this.scene = new THREE.Scene();
                
                // Procedural Skybox Shader
                const vertexShader = `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `;
                const fragmentShader = `
                    uniform vec3 topColor;
                    uniform vec3 bottomColor;
                    uniform float offset;
                    uniform float exponent;
                    varying vec3 vWorldPosition;
                    void main() {
                        float h = normalize(vWorldPosition + offset).y;
                        gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
                    }
                `;
                const uniforms = {
                    topColor: { value: new THREE.Color(0x1a3045) },
                    bottomColor: { value: new THREE.Color(0xa0b8d0) },
                    offset: { value: 33 },
                    exponent: { value: 0.6 }
                };
                const skyGeo = new THREE.SphereGeometry(1000, 32, 15);
                const skyMat = new THREE.ShaderMaterial({
                    vertexShader: vertexShader, fragmentShader: fragmentShader,
                    uniforms: uniforms, side: THREE.BackSide
                });
                const sky = new THREE.Mesh(skyGeo, skyMat);
                this.scene.add(sky);
                this.scene.fog = new THREE.FogExp2(0x8098b0, 0.005);

                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1500);
                this.camera.rotation.order = 'YXZ'; 
                
                this.renderer = new THREE.WebGLRenderer({ canvas: this.container, antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

                const ambient = new THREE.AmbientLight(0xffffff, 0.35);
                this.scene.add(ambient);

                const sun = new THREE.DirectionalLight(0xaaccff, 0.65);
                sun.position.set(50, 150, 50);
                sun.castShadow = true;
                sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
                sun.shadow.camera.left = -150; sun.shadow.camera.right = 150;
                sun.shadow.camera.top = 150; sun.shadow.camera.bottom = -150;
                sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 600;
                this.scene.add(sun);
                
                this.launcherAnchor = new THREE.Group();
                this.camera.add(this.launcherAnchor);
                this.scene.add(this.camera);
                
                this.launcherModel = new THREE.Group();
                this.launcherAnchor.add(this.launcherModel);
                
                this.muzzleFlash = new THREE.PointLight(0xffaa00, 0, 20);
                this.scene.add(this.muzzleFlash);
                
                this.projectileGeo = new THREE.CylinderGeometry(.02, .02, 1.2, 4);
                this.projectileGeo.rotateX(Math.PI/2);
                this.projectileMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
                this.hitGeo = new THREE.SphereGeometry(.05, 4, 4);
                
                this.buildLauncher();
            }

            initPhysics() {
                this.world = new CANNON.World();
                this.world.gravity.set(0, -60, 0); 
                this.world.broadphase = new CANNON.NaiveBroadphase();

                this.playerMaterial = new CANNON.Material('playerMat');
                this.worldMaterial = new CANNON.Material('worldMat');
                const contactMat = new CANNON.ContactMaterial(
                    this.playerMaterial, this.worldMaterial,
                    { friction: 0.01, restitution: 0.0 }
                );
                this.world.addContactMaterial(contactMat);

                this.playerBody = new CANNON.Body({
                    mass: 75, shape: new CANNON.Sphere(0.8),
                    position: new CANNON.Vec3(0, 30, 0),
                    material: this.playerMaterial, linearDamping: 0, angularDamping: 1
                });
                this.playerBody.fixedRotation = true;
                this.playerBody.updateMassProperties();
                this.world.addBody(this.playerBody);

                this.groundedUntil = 0;
            }

            buildProceduralWorld(roomCode) {
                // Clear Previous
                this.worldObjects.forEach(obj => { if (obj.mesh) this.scene.remove(obj.mesh); if (obj.body) this.world.remove(obj.body); });
                Object.values(this.props).forEach(p => { this.scene.remove(p.mesh); this.world.remove(p.body); });
                this.worldObjects = []; this.props = {}; this.jumpPads = [];

                const rng = mulberry32(getSeedFromCode(roomCode || "XYZ"));
                
                // Textures
                const gridTex = TextureGenerator.createGrid('#1f2937', '#374151');
                gridTex.wrapS = THREE.RepeatWrapping; gridTex.wrapT = THREE.RepeatWrapping; gridTex.repeat.set(80, 80);
                const groundMat = new THREE.MeshStandardMaterial({ map: gridTex, roughness: 0.9 });
                
                const concreteTex = TextureGenerator.createNoiseTexture('#475569', '#334155');
                const boxMat = new THREE.MeshStandardMaterial({ map: concreteTex, roughness: 0.8 });
                
                const buildingTex = TextureGenerator.createGrid('#0f172a', '#1e293b');
                buildingTex.wrapS = THREE.RepeatWrapping; buildingTex.wrapT = THREE.RepeatWrapping;
                buildingTex.repeat.set(3, 10);
                const buildingMat = new THREE.MeshStandardMaterial({ map: buildingTex, roughness: 0.6, metalness: 0.2 });

                const containerMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, roughness: 0.5 });
                const barrelMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.6 });
                const woodMat = new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.9 });

                // Ground
                const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), groundMat);
                groundMesh.rotation.x = -Math.PI / 2;
                groundMesh.receiveShadow = true;
                this.scene.add(groundMesh);
                
                const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: this.worldMaterial });
                groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
                this.world.addBody(groundBody);
                this.worldObjects.push({ mesh: groundMesh, body: groundBody });

                // Map Architecture: Multi-Story Hollow Towers
                const createHollowTower = (cx, cz, isRotated) => {
                    const bw = 24, bd = 24;
                    // Floors
                    for(let f = 1; f <= 3; f++) {
                        let y = f * 12;
                        this.createBox(new THREE.Vector3(cx, y, cz), new THREE.Vector3(bw, 1, bd), boxMat);
                        // Interior Ramp
                        this.createRamp(new THREE.Vector3(cx + (isRotated?4:0), y-6, cz + (isRotated?0:4)), new THREE.Vector3(6, 1, 16), isRotated?'z':'x', isRotated?-Math.PI/4:Math.PI/4, boxMat);
                    }
                    // Walls (Hollow Center)
                    this.createBox(new THREE.Vector3(cx-12, 18, cz), new THREE.Vector3(1, 36, 24), buildingMat);
                    this.createBox(new THREE.Vector3(cx+12, 18, cz), new THREE.Vector3(1, 36, 24), buildingMat);
                    this.createBox(new THREE.Vector3(cx, 18, cz-12), new THREE.Vector3(24, 36, 1), buildingMat);
                    // Partial front wall for entry
                    this.createBox(new THREE.Vector3(cx-8, 18, cz+12), new THREE.Vector3(8, 36, 1), buildingMat);
                    this.createBox(new THREE.Vector3(cx+8, 18, cz+12), new THREE.Vector3(8, 36, 1), buildingMat);
                };

                const towers = [[30, 30], [-30, 30], [30, -30], [-30, -30]];
                towers.forEach((t, idx) => createHollowTower(t[0], t[1], idx%2===0));

                // Center Structure
                this.createBox(new THREE.Vector3(0, 6, 0), new THREE.Vector3(20, 12, 20), boxMat);

                // Add Jump Pads & Jump Lights
                const createJumpPad = (x, y, z) => {
                    const jm = new THREE.Mesh(new THREE.BoxGeometry(4, 0.4, 4), new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x008888 }));
                    jm.position.set(x, y, z);
                    this.scene.add(jm);
                    const l = new THREE.PointLight(0x00ffff, 1, 15); l.position.set(x, y+2, z); this.scene.add(l);
                    this.jumpPads.push({ pos: new THREE.Vector3(x, y, z), force: 45 });
                };
                createJumpPad(0, 0.2, 25); createJumpPad(0, 0.2, -25);
                createJumpPad(25, 0.2, 0); createJumpPad(-25, 0.2, 0);

                // Prop Generator Helper
                let propIdCounter = 0;
                const addDynamicProp = (pos, size, mat, mass, type, maxHp, shapeType='box') => {
                    let id = "prop_" + propIdCounter++;
                    let geo = shapeType === 'box' ? new THREE.BoxGeometry(size.x, size.y, size.z) : new THREE.CylinderGeometry(size.x, size.y, size.z, 8);
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.copy(pos); mesh.castShadow = true; mesh.receiveShadow = true;
                    this.scene.add(mesh);

                    let shape = shapeType === 'box' ? new CANNON.Box(new CANNON.Vec3(size.x/2, size.y/2, size.z/2)) : new CANNON.Cylinder(size.x, size.y, size.z, 8);
                    const body = new CANNON.Body({ mass: mass, shape: shape, position: new CANNON.Vec3(pos.x, pos.y, pos.z), material: this.worldMaterial });
                    if(shapeType === 'cylinder'){
                        const quat = new CANNON.Quaternion(); quat.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
                        body.addShape(shape, new CANNON.Vec3(), quat);
                    }
                    this.world.addBody(body);
                    this.props[id] = { id, mesh, body, type, hp: maxHp };
                };

                // Scatter Cover Props
                for(let i=0; i<30; i++){
                    let x = (rng() - 0.5) * 120; let z = (rng() - 0.5) * 120;
                    if(Math.abs(x) < 25 && Math.abs(z) < 25) continue; 
                    
                    let rand = rng();
                    if(rand < 0.3) {
                        // Exploding Barrel
                        addDynamicProp(new THREE.Vector3(x, 1.5, z), new THREE.Vector3(0.6, 0.6, 1.5), barrelMat, 15, 'barrel', 15, 'cylinder');
                    } else if (rand < 0.6) {
                        // Shipping Container
                        addDynamicProp(new THREE.Vector3(x, 2, z), new THREE.Vector3(3, 4, 8), containerMat, 1500, 'container', 1000);
                    } else {
                        // Destructible Wood Barrier
                        addDynamicProp(new THREE.Vector3(x, 1.5, z), new THREE.Vector3(4, 3, 0.5), woodMat, 20, 'wood', 30);
                    }
                }

                // Surrounding City Blockers
                for (let i = 0; i < 24; i++) {
                    const angle = (i / 24) * Math.PI * 2;
                    const r = 90;
                    this.createBox(new THREE.Vector3(Math.cos(angle)*r, 40, Math.sin(angle)*r), new THREE.Vector3(30, 80, 20), buildingMat);
                }
            }

            createBox(pos, size, mat) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(size.x, size.y, size.z), mat);
                mesh.position.copy(pos); mesh.castShadow = true; mesh.receiveShadow = true;
                this.scene.add(mesh);
                const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(size.x/2, size.y/2, size.z/2)), position: new CANNON.Vec3(pos.x, pos.y, pos.z), material: this.worldMaterial });
                this.world.addBody(body);
                this.worldObjects.push({ mesh, body });
            }

            createRamp(pos, size, axis, angle, mat) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(size.x, size.y, size.z), mat);
                mesh.position.copy(pos);
                if (axis === 'x') mesh.rotation.x = angle;
                if (axis === 'z') mesh.rotation.z = angle;
                mesh.rotateY(Math.PI); mesh.castShadow = true; mesh.receiveShadow = true;
                this.scene.add(mesh);

                const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(size.x/2, size.y/2, size.z/2)), position: new CANNON.Vec3(pos.x, pos.y, pos.z), material: this.worldMaterial });
                const tiltQuat = new CANNON.Quaternion(); tiltQuat.setFromAxisAngle(new CANNON.Vec3(axis === 'x' ? 1 : 0, 0, axis === 'z' ? 1 : 0), angle);
                const yFlipQuat = new CANNON.Quaternion(); yFlipQuat.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), Math.PI);
                tiltQuat.mult(yFlipQuat, body.quaternion);
                this.world.addBody(body);
                this.worldObjects.push({ mesh, body });
            }

            initInput() {
                this.keys = {}; 
                this.touchState = { joystickId: null, lookId: null, lastX: 0, lastY: 0, lastJoyTap: 0, sprintReady: false };
                
                window.addEventListener('keydown', (e) => { 
                    if(GAME_STATE !== 'PLAYING') return;
                    this.keys[e.code] = true; 
                    if (e.code === 'Space') this.jump(); 
                    if (e.code === 'KeyR') this.reloadLauncher();
                    if (e.code === 'KeyF' || e.code === 'KeyQ') this.swapLauncher();
                    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') this.isAiming = !this.isAiming;
                });
                window.addEventListener('keyup', (e) => this.keys[e.code] = false);

                window.addEventListener('mousedown', (e) => {
                    if (GAME_STATE === 'PLAYING' && this.isLocked && e.button === 0) { this.isFiring = true; this.shoot(); }
                    if (GAME_STATE === 'PLAYING' && this.isLocked && e.button === 2) { this.isAiming = !this.isAiming; }
                });
                window.addEventListener('mouseup', (e) => { if (e.button === 0) this.isFiring = false; });
                this.container.addEventListener('click', () => { if (GAME_STATE === 'PLAYING' && !this.isTouchDevice()) this.container.requestPointerLock(); });
                document.addEventListener('pointerlockchange', () => {
                    this.isLocked = document.pointerLockElement === this.container;
                    if (!this.isLocked) this.isFiring = false;
                });
                document.addEventListener('mousemove', (e) => {
                    if (this.isLocked && GAME_STATE === 'PLAYING') {
                        this.input.yaw -= e.movementX * SETTINGS.sensitivity;
                        this.input.pitch -= e.movementY * SETTINGS.sensitivity;
                        this.clampPitch();
                    }
                });
                this.setupTouchEvents();
            }

            isTouchDevice() { return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0); }

            setupTouchEvents() {
                const joyZone = document.getElementById('joystick-zone'), joyKnob = document.getElementById('joystick-knob');
                window.addEventListener('touchstart', (e) => {
                    if(GAME_STATE !== 'PLAYING') return;
                    const now = Date.now();
                    for (let touch of e.changedTouches) {
                        const target = touch.target;
                        if (target.classList.contains('touch-btn') || target.closest('.card')) continue;
                        const joyRect = joyZone.getBoundingClientRect();
                        if (this.touchState.joystickId === null && touch.clientX >= joyRect.left && touch.clientX <= joyRect.right && touch.clientY >= joyRect.top && touch.clientY <= joyRect.bottom) {
                            this.touchState.joystickId = touch.identifier; 
                            
                            // Virtual Joystick Sprint Double-Tap
                            if (now - this.touchState.lastJoyTap < 300) this.touchState.sprintReady = true;
                            else this.touchState.sprintReady = false;
                            this.touchState.lastJoyTap = now;
                            continue;
                        }
                        if (this.touchState.lookId === null) {
                            this.touchState.lookId = touch.identifier; this.touchState.lastX = touch.clientX; this.touchState.lastY = touch.clientY;
                        }
                    }
                }, { passive: false });
                
                window.addEventListener('touchmove', (e) => {
                    if(GAME_STATE !== 'PLAYING') return;
                    for (let touch of e.changedTouches) {
                        if (touch.identifier === this.touchState.joystickId) {
                            const joyRect = joyZone.getBoundingClientRect();
                            const centerX = joyRect.left + joyRect.width / 2, centerY = joyRect.top + joyRect.height / 2;
                            let dx = touch.clientX - centerX, dy = touch.clientY - centerY;
                            const dist = Math.hypot(dx, dy), maxDist = joyRect.width / 2;
                            
                            if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                            this.input.moveX = dx / maxDist; this.input.moveZ = dy / maxDist;
                            
                            // Trigger Sprint if dragging > 80%
                            const distRatio = Math.hypot(dx, dy) / maxDist;
                            if (this.touchState.sprintReady && distRatio > 0.8) this.isSprinting = true;
                            else if (distRatio <= 0.8) this.isSprinting = false;
                        }
                        if (touch.identifier === this.touchState.lookId) {
                            const dx = touch.clientX - this.touchState.lastX, dy = touch.clientY - this.touchState.lastY;
                            this.input.yaw -= dx * SETTINGS.sensitivity * 1.5; this.input.pitch -= dy * SETTINGS.sensitivity * 1.5; this.clampPitch();
                            this.touchState.lastX = touch.clientX; this.touchState.lastY = touch.clientY;
                        }
                    }
                }, { passive: false });
                
                const handleTouchEnd = (e) => {
                    for (let touch of e.changedTouches) {
                        if (touch.identifier === this.touchState.joystickId) {
                            this.touchState.joystickId = null; joyKnob.style.transform = `translate(0px, 0px)`;
                            this.input.moveX = 0; this.input.moveZ = 0;
                            this.isSprinting = false;
                        }
                        if (touch.identifier === this.touchState.lookId) this.touchState.lookId = null;
                    }
                };
                window.addEventListener('touchend', handleTouchEnd); window.addEventListener('touchcancel', handleTouchEnd);

                const bindBtn = (id, startFunc, endFunc) => {
                    const btn = document.getElementById(id); if(!btn) return;
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); startFunc(); });
                    if(endFunc) {
                        btn.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); endFunc(); });
                        btn.addEventListener('touchcancel', (e) => { e.preventDefault(); e.stopPropagation(); endFunc(); });
                    }
                };
                bindBtn('btn-jump', () => this.jump());
                bindBtn('btn-aim', () => { this.isAiming = !this.isAiming; });
                bindBtn('btn-shoot', () => { this.isFiring = true; this.shoot(); }, () => { this.isFiring = false; });
                bindBtn('btn-reload', () => this.reloadLauncher());
                bindBtn('btn-swap', () => this.swapLauncher());
            }

            clampPitch() { this.input.pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, this.input.pitch)); }

            jump() {
                if (GAME_STATE !== 'PLAYING') return;
                const grounded = performance.now() < this.groundedUntil;
                if (grounded) {
                    this.playerBody.velocity.y = SETTINGS.jumpForce;
                    this.groundedUntil = 0;
                }
            }

            createWeaponModel(wInfo) {
                const group = new THREE.Group();
                if (!wInfo) return group;
                const matMetal = new THREE.MeshStandardMaterial({color:wInfo.color||0x333, roughness:0.3, metalness:0.9});
                const matPolymer = new THREE.MeshStandardMaterial({color:0x151515, roughness:0.8, metalness:0.1});
                const matChrome = new THREE.MeshStandardMaterial({color:0xa6a6a6, roughness:0.2, metalness:1.0});
                const matWood = new THREE.MeshStandardMaterial({color:0x4a3728, roughness:0.9});
                
                const addPart = (geo, mat, x, y, z, rotX=0) => {
                    const mesh = new THREE.Mesh(geo, mat); mesh.position.set(x, y, z); mesh.rotation.x = rotX; group.add(mesh); return mesh;
                };

                switch(wInfo.name){
                    case"M4 CARBINE":addPart(new THREE.BoxGeometry(.08,.12,.4),matMetal,0,0,0);addPart(new THREE.CylinderGeometry(.025,.025,.3),matMetal,0,.02,.3,Math.PI/2);addPart(new THREE.BoxGeometry(.07,.15,.2),matPolymer,0,-.02,.45);addPart(new THREE.BoxGeometry(.09,.09,.35),matPolymer,0,.01,-.35);addPart(new THREE.CylinderGeometry(.015,.015,.5),matChrome,0,.01,-.5,Math.PI/2);addPart(new THREE.BoxGeometry(.06,.25,.12),matPolymer,0,-.18,-.1).rotation.x=0.2;addPart(new THREE.BoxGeometry(.04,.02,.3),matChrome,0,.075,-.15);break;
                    case"AUG":addPart(new THREE.BoxGeometry(.1,.2,.7),matMetal,0,-.05,.2);addPart(new THREE.CylinderGeometry(.02,.02,.6),matChrome,0,.05,-.4,Math.PI/2);addPart(new THREE.BoxGeometry(.07,.22,.12),matPolymer,0,-.15,.4);addPart(new THREE.BoxGeometry(.06,.15,.08),matPolymer,0,-.15,.1,-.3);addPart(new THREE.BoxGeometry(.04,.06,.4),matMetal,0,.12,-.1);break;
                    case"SCAR-H":addPart(new THREE.BoxGeometry(.1,.15,.6),matMetal,0,.05,-.1);addPart(new THREE.BoxGeometry(.09,.1,.4),matPolymer,0,-.05,0);addPart(new THREE.BoxGeometry(.08,.2,.3),matMetal,0,.02,.4);addPart(new THREE.BoxGeometry(.08,.28,.15),matPolymer,0,-.2,-.05);addPart(new THREE.CylinderGeometry(.02,.03,.4),matChrome,0,.06,-.6,Math.PI/2);addPart(new THREE.BoxGeometry(.04,.02,.5),matChrome,0,.09,-.1);break;
                    case"TRENCH GUN":addPart(new THREE.BoxGeometry(.09,.13,.4),matMetal,0,0,0);addPart(new THREE.CylinderGeometry(.035,.035,.9),matMetal,0,.04,-.5,Math.PI/2);addPart(new THREE.CylinderGeometry(.045,.045,.3),matWood,0,-.01,-.4,Math.PI/2);addPart(new THREE.BoxGeometry(.08,.15,.5),matWood,0,-.1,.45).rotation.x=-0.1;break;
                }
                return group;
            }

            buildLauncher() {
                this.launcherModel.clear();
                const w = WEAPONS[this.curWIdx];
                if (!w) return;
                const wGroup = this.createWeaponModel(w);
                this.launcherModel.add(wGroup);
                this.currentSpread = w.baseSpread || 0;

                if(w.reticle) {
                    const matPolymer = new THREE.MeshStandardMaterial({color:0x151515, roughness:0.8, metalness:0.1});
                    const addPart = (geo, mat, x, y, z) => { const mesh = new THREE.Mesh(geo, mat); mesh.position.set(x, y, z); this.launcherModel.add(mesh); };
                    addPart(new THREE.BoxGeometry(.08,.05,.15),matPolymer,0,.13,-.1);
                    addPart(new THREE.BoxGeometry(.06,.06,.01),new THREE.MeshBasicMaterial({color:0x55aaff, transparent:true, opacity:.4}),0,.18,-.1);
                    const dot = new THREE.Mesh(new THREE.SphereGeometry(.005), new THREE.MeshBasicMaterial({color:w.reticle}));
                    dot.position.set(0,.18,-.101); this.launcherModel.add(dot);
                }
                this.updateWeaponUI();
            }

            swapLauncher() {
                if (this.isReloading) return;
                this.curWIdx = (this.curWIdx + 1) % WEAPONS.length;
                this.recoilPitchOffset = 0; this.launcherRecoilOffset = 0; this.nextFireAt = 0; this.isFiring = false;
                this.buildLauncher();
            }

            reloadLauncher() {
                const w = WEAPONS[this.curWIdx];
                if (this.isReloading || w.ammo === w.mag) return;
                this.isReloading = true;
                document.getElementById('reloading-text').style.display = 'block';
                setTimeout(() => {
                    w.ammo = w.mag; this.isReloading = false;
                    document.getElementById('reloading-text').style.display = 'none';
                    this.updateWeaponUI();
                }, w.reloadTime);
            }

            updateWeaponUI() {
                const w = WEAPONS[this.curWIdx];
                document.getElementById('w-name').innerText = w.name;
                document.getElementById('ammo-count').innerText = w.ammo;
                document.getElementById('ammo-count').style.color = w.ammo === 0 ? '#f33' : '#fff';
            }

            shoot() {
                if (GAME_STATE !== 'PLAYING') return;
                const w = WEAPONS[this.curWIdx];
                if (this.isReloading || w.ammo <= 0) return;
                const now = Date.now();
                if (now < this.nextFireAt) return;
                
                this.nextFireAt = now + w.rate; w.ammo--; this.updateWeaponUI();

                // Dynamic Bloom / Recoil
                this.currentSpread = Math.min(w.maxSpread, this.currentSpread + w.spreadGrowth);

                const activeRecoil = this.isAiming ? w.recoil * .5 : w.recoil;
                const activeCamRecoil = this.isAiming ? w.camRecoil * .5 : w.camRecoil;
                this.recoilPitchOffset = Math.min(1.5, this.recoilPitchOffset + activeCamRecoil);
                this.launcherRecoilOffset = Math.max(-.25, this.launcherRecoilOffset - activeRecoil);
                
                const viewForward = new THREE.Vector3(0, 0, -1).applyQuaternion(this.camera.quaternion);
                const moveRight = new THREE.Vector3(1, 0, 0).applyQuaternion(this.camera.quaternion);
                const muzzlePos = this.camera.position.clone().addScaledVector(viewForward, .15).addScaledVector(moveRight, .1).addScaledVector(new THREE.Vector3(0, -.1, 0), .1);

                this.muzzleFlash.position.copy(muzzlePos); this.muzzleFlash.intensity = 4;

                const shots = w.pellets || 1;
                for (let s = 0; s < shots; s++) {
                    const fireDir = viewForward.clone();
                    const spreadScale = this.isAiming ? this.currentSpread * .5 : this.currentSpread;
                    fireDir.x += (Math.random() - .5) * spreadScale;
                    fireDir.y += (Math.random() - .5) * spreadScale;
                    fireDir.z += (Math.random() - .5) * spreadScale;
                    fireDir.normalize();

                    this.spawnLocalBullet(muzzlePos, fireDir, w.dmg);

                    if (network.peer && network.peer.open) {
                        network.broadcast({ type: 'shoot', origin: { x: muzzlePos.x, y: muzzlePos.y, z: muzzlePos.z }, direction: { x: fireDir.x, y: fireDir.y, z: fireDir.z }, power: w.dmg });
                    }
                }
                if (w.ammo === 0) this.reloadLauncher();
            }

            spawnLocalBullet(origin, direction, power) {
                const proj = new THREE.Mesh(this.projectileGeo, this.projectileMat);
                proj.position.copy(origin);
                proj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), direction);
                proj.velocity = direction.clone().multiplyScalar(4.0 / 1.3); 
                proj.life = 60; proj.power = power; proj.ownerId = network.myId;
                this.scene.add(proj); this.projectiles.push(proj);
            }

            spawnRemoteBullet(originRaw, directionRaw, ownerId, power) {
                const origin = new THREE.Vector3(originRaw.x, originRaw.y, originRaw.z);
                const direction = new THREE.Vector3(directionRaw.x, directionRaw.y, directionRaw.z);
                const proj = new THREE.Mesh(this.projectileGeo, this.projectileMat);
                proj.position.copy(origin);
                proj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), direction);
                proj.velocity = direction.clone().multiplyScalar(4.0 / 1.3);
                proj.life = 60; proj.power = power || 15; proj.ownerId = ownerId;
                this.scene.add(proj); this.projectiles.push(proj);
            }

            spawnHitParticles(pt, count = 10, color = 0xff2222) {
                for(let i=0; i<count; i++){
                    const mat = new THREE.MeshBasicMaterial({color, transparent:true, opacity:1});
                    const p = new THREE.Mesh(this.hitGeo, mat); p.position.copy(pt);
                    const dir = new THREE.Vector3((Math.random()-.5)*1.8, Math.random()*1.4+.4, (Math.random()-.5)*1.8).normalize();
                    p.velocity = dir.multiplyScalar(2 + Math.random()*4.5); p.velocity.y += 1.5;
                    p.life = .25 + Math.random()*.2; p.maxLife = p.life;
                    this.scene.add(p); this.hitParticles.push(p);
                }
            }

            // Destructible Trigger Logic
            handlePropDamage(id, damage) {
                const prop = this.props[id];
                if (!prop) return;
                prop.hp -= damage;
                if (prop.hp <= 0) {
                    if (prop.type === 'barrel') {
                        this.triggerExplosion(prop.mesh.position);
                    } else if (prop.type === 'wood') {
                        this.spawnHitParticles(prop.mesh.position, 20, 0x854d0e);
                    }
                    this.scene.remove(prop.mesh);
                    this.world.remove(prop.body);
                    delete this.props[id];
                }
            }

            triggerExplosion(pos) {
                this.spawnHitParticles(pos, 40, 0xff8800);
                const explLight = new THREE.PointLight(0xff4400, 5, 25);
                explLight.position.copy(pos); this.scene.add(explLight);
                setTimeout(() => this.scene.remove(explLight), 200);

                const explosionRadius = 15;
                const maxDmg = 50;
                const force = 800;

                // Push & Damage Local Player
                const dist = this.playerBody.position.distanceTo(pos);
                if (dist < explosionRadius) {
                    const dmg = maxDmg * (1 - dist/explosionRadius);
                    this.takeDamage(dmg, 'barrel_explosion');

                    const pushDir = this.playerBody.position.clone().sub(pos).normalize();
                    pushDir.y += 0.5; pushDir.normalize();
                    this.playerBody.applyImpulse(
                        new CANNON.Vec3(pushDir.x * force, pushDir.y * force, pushDir.z * force),
                        this.playerBody.position
                    );
                }

                // Push Dynamic Props
                Object.values(this.props).forEach(p => {
                    const pDist = p.mesh.position.distanceTo(pos);
                    if (pDist < explosionRadius) {
                        const pushDir = p.mesh.position.clone().sub(pos).normalize();
                        pushDir.y += 0.5; pushDir.normalize();
                        p.body.applyImpulse(
                            new CANNON.Vec3(pushDir.x * force * 2, pushDir.y * force * 2, pushDir.z * force * 2),
                            new CANNON.Vec3(p.mesh.position.x, p.mesh.position.y, p.mesh.position.z)
                        );
                        // Chain reaction
                        if (p.type === 'barrel' || p.type === 'wood') {
                            setTimeout(() => this.handlePropDamage(p.id, 50), 100);
                        }
                    }
                });
            }

            takeDamage(damage, attackerId) {
                this.health -= damage;
                if (this.health < 0) this.health = 0;
                this.updateHealthUI();
                network.broadcast({ type: 'hp_update', id: network.myId, hp: this.health });
                
                document.getElementById('hud').style.backgroundColor = 'rgba(255,0,0,0.3)';
                setTimeout(() => { document.getElementById('hud').style.backgroundColor = 'transparent'; }, 150);

                if (this.health === 0) this.respawn(attackerId);
            }

            respawn(killerId) {
                if (network.peer && network.peer.open) {
                    const msg = { type: 'player_killed', victimId: network.myId, killerId: killerId };
                    if (network.isHost) network.handleData(network.myId, msg); else network.broadcast(msg);
                }
                this.health = 100; this.updateHealthUI();
                network.broadcast({ type: 'hp_update', id: network.myId, hp: this.health });
                
                this.playerBody.position.set((Math.random() - 0.5) * 60, 40, (Math.random() - 0.5) * 60);
                this.playerBody.velocity.set(0, 0, 0);
            }

            updateHealthUI() {
                const bar = document.getElementById('health-bar');
                document.getElementById('health-text').innerText = `${Math.floor(this.health)} / 100`;
                bar.style.width = `${this.health}%`;
                bar.style.backgroundColor = this.health > 50 ? '#22c55e' : this.health > 25 ? '#eab308' : '#ef4444';
            }

            createPlayerModel(username = "Player") {
                const group = new THREE.Group();
                const sc = 0.85; const hs = 0.95; 

                const pColor = stringToColorHex(username);
                const uniformMat = new THREE.MeshStandardMaterial({ color: pColor, roughness: 0.9 });
                const skinMat = new THREE.MeshStandardMaterial({ color: 0xd8b890, roughness: 0.6 });
                const darkMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });

                const head = new THREE.Mesh(new THREE.BoxGeometry(.35*hs, .4*hs, .35*hs), skinMat);
                head.position.y = 1.6*sc;
                const band = new THREE.Mesh(new THREE.BoxGeometry(.38, .12, .38), darkMat);
                band.position.set(0, -.1, 0); head.add(band); group.add(head);

                const torso = new THREE.Mesh(new THREE.BoxGeometry(.65*sc, .85*sc, .35*sc), uniformMat);
                torso.position.y = 0.95*sc; group.add(torso);

                const armL = new THREE.Mesh(new THREE.BoxGeometry(.2*sc, .8*sc, .2*sc), uniformMat);
                armL.position.set(-.45*sc, 1.3*sc, 0); armL.geometry.translate(0, -.4*sc, 0); group.add(armL);

                const armR = new THREE.Mesh(new THREE.BoxGeometry(.2*sc, .8*sc, .2*sc), uniformMat);
                armR.position.set(.45*sc, 1.3*sc, 0); armR.geometry.translate(0, -.4*sc, 0); group.add(armR);

                const legL = new THREE.Mesh(new THREE.BoxGeometry(.25*sc, .8*sc, .25*sc), uniformMat);
                legL.position.set(-.2*sc, .8*sc, 0); legL.geometry.translate(0, -.4*sc, 0); group.add(legL);

                const legR = new THREE.Mesh(new THREE.BoxGeometry(.25*sc, .8*sc, .25*sc), uniformMat);
                legR.position.set(.2*sc, .8*sc, 0); legR.geometry.translate(0, -.4*sc, 0); group.add(legR);

                group.head = head; group.torso = torso; group.leftArm = armL; group.rightArm = armR; group.leftLeg = legL; group.rightLeg = legR;
                group.animTime = 0; group.weaponIdx = -1; group.weaponMesh = null;

                const tagWrap = document.createElement('div');
                tagWrap.className = 'nametag-wrapper';
                tagWrap.innerHTML = `
                    <div class="nametag">${username}</div>
                    <div class="remote-hp-bg"><div class="remote-hp-fill" id="hp-fill-${username}"></div></div>
                `;
                this.nametagContainer.appendChild(tagWrap);
                group.tag = tagWrap;

                return group;
            }

            updateRemotePlayer(id, data) {
                if (!this.remotePlayers[id]) {
                    const playerInfo = network.lobbyPlayers.find(p => p.id === id);
                    const uname = playerInfo ? playerInfo.username : "Player";
                    const mesh = this.createPlayerModel(uname);
                    this.scene.add(mesh); this.remotePlayers[id] = { mesh };
                    mesh.tag.querySelector('.remote-hp-fill').id = `hp-fill-${id}`;
                }

                const rp = this.remotePlayers[id].mesh;
                const dx = data.x - rp.position.x; const dz = data.z - rp.position.z;
                const speed = Math.sqrt(dx*dx + dz*dz);
                
                // Adjust animation speed based on whether they are sprinting
                const animSpeed = data.sprint ? 0.6 : 0.4;
                if (speed > 0.05) rp.animTime += animSpeed;
                else rp.animTime += (Math.round(rp.animTime / Math.PI) * Math.PI - rp.animTime) * 0.2;

                const swing = Math.sin(rp.animTime) * 0.8;
                rp.leftArm.rotation.x = swing;
                rp.rightArm.rotation.x = data.pitch - Math.PI/4; 
                rp.leftLeg.rotation.x = -swing; rp.rightLeg.rotation.x = swing;

                rp.position.set(data.x, data.y, data.z);
                rp.rotation.set(0, data.yaw, 0);
                if(rp.head) rp.head.rotation.set(data.pitch, 0, 0);

                if (data.wIdx !== undefined && rp.weaponIdx !== data.wIdx && WEAPONS[data.wIdx]) {
                    if (rp.weaponMesh) { rp.rightArm.remove(rp.weaponMesh); }
                    rp.weaponIdx = data.wIdx;
                    const wMesh = this.createWeaponModel(WEAPONS[data.wIdx]);
                    wMesh.position.set(0.05, -0.65, 0.25); wMesh.rotation.x = -0.3; wMesh.scale.set(0.8, 0.8, 0.8);
                    rp.rightArm.add(wMesh); rp.weaponMesh = wMesh;
                }
            }

            removeRemotePlayer(id) {
                if (this.remotePlayers[id]) {
                    this.scene.remove(this.remotePlayers[id].mesh);
                    this.remotePlayers[id].mesh.tag.remove();
                    delete this.remotePlayers[id];
                }
            }

            triggerRagdoll(id) {
                if (!this.remotePlayers[id]) return;
                const rp = this.remotePlayers[id].mesh;
                rp.tag.style.display = 'none'; rp.deathStart = performance.now();
                this.corpses.push(rp); delete this.remotePlayers[id];

                const hitPoint = rp.position.clone();
                [rp.head, rp.torso, rp.leftArm, rp.rightArm, rp.leftLeg, rp.rightLeg].forEach(part => {
                    if (!part) return;
                    let away = part.position.clone().sub(rp.worldToLocal(hitPoint.clone()));
                    if (away.lengthSq() < 0.0001) away.set((Math.random()-.5), Math.random()*.7+.4, (Math.random()-.5));
                    away.normalize();
                    part.userData.velocity = away.multiplyScalar(1.5 + Math.random()*2.5);
                    part.userData.velocity.y += 2 + Math.random()*1.4;
                    part.userData.spin = new THREE.Vector3((Math.random()-.5)*10, (Math.random()-.5)*10, (Math.random()-.5)*10);
                });
            }

            updateNametags() {
                Object.values(this.remotePlayers).forEach(player => {
                    const vector = player.mesh.position.clone(); vector.y += 2.4;
                    vector.project(this.camera);
                    if (vector.z < 1) {
                        player.mesh.tag.style.display = 'flex';
                        player.mesh.tag.style.left = `${(vector.x * .5 + .5) * window.innerWidth}px`;
                        player.mesh.tag.style.top = `${(vector.y * -.5 + .5) * window.innerHeight}px`;
                    } else player.mesh.tag.style.display = 'none';
                });
            }

            updatePhysics() {
                if(GAME_STATE !== 'PLAYING') return;
                const nowTime = performance.now();
                const dt = Math.min((nowTime - this.lastTime) / 1000, 0.1);
                this.lastTime = nowTime;
                this.world.step(1 / 60, dt, 3);

                // Check Jump Pads
                this.jumpPads.forEach(pad => {
                    if (this.playerBody.position.distanceTo(pad.pos) < 2.5 && this.playerBody.position.y < pad.pos.y + 2) {
                        this.playerBody.velocity.y = pad.force * 1.25;
                    }
                });

                // Soft Touch Aim Assist (Soft-lock cone)
                if (this.isTouchDevice() && !this.isFiring) {
                    let bestTarget = null;
                    let minScreenDist = 0.25; 
                    Object.values(this.remotePlayers).forEach(rp => {
                        const targetPos = rp.mesh.position.clone(); targetPos.y += 1.0; 
                        const screenPos = targetPos.clone().project(this.camera);
                        if (screenPos.z < 1) {
                            const dist = Math.hypot(screenPos.x, screenPos.y);
                            if (dist < minScreenDist) { minScreenDist = dist; bestTarget = targetPos; }
                        }
                    });
                    if (bestTarget) {
                        const dir = bestTarget.clone().sub(this.camera.position).normalize();
                        const targetYaw = Math.atan2(-dir.x, -dir.z);
                        const targetPitch = Math.asin(dir.y);
                        
                        let dy = targetYaw - this.input.yaw;
                        while (dy > Math.PI) dy -= Math.PI*2;
                        while (dy < -Math.PI) dy += Math.PI*2;
                        
                        this.input.yaw += dy * 0.15;
                        this.input.pitch += (targetPitch - this.input.pitch) * 0.15;
                    }
                }

                // Ground Check
                let isGrounded = false;
                for (let i = 0; i < this.world.contacts.length; i++) {
                    const c = this.world.contacts[i];
                    if (c.bi === this.playerBody || c.bj === this.playerBody) {
                        const ny = c.bi === this.playerBody ? -c.ni.y : c.ni.y;
                        if (ny > 0.45) { isGrounded = true; break; }
                    }
                }
                if (isGrounded) this.groundedUntil = performance.now() + 150;

                const w = WEAPONS[this.curWIdx];
                if (w && w.auto && this.isFiring && !this.isReloading && w.ammo > 0 && Date.now() >= this.nextFireAt) this.shoot();
                if (this.muzzleFlash.intensity > 0) this.muzzleFlash.intensity -= 0.5;

                let moveX = this.input.moveX; let moveZ = this.input.moveZ;
                if (this.keys['KeyW']) moveZ = -1; if (this.keys['KeyS']) moveZ = 1;
                if (this.keys['KeyA']) moveX = -1; if (this.keys['KeyD']) moveX = 1;
                if (this.keys['ShiftLeft']) this.isSprinting = true; else if(!this.isTouchDevice()) this.isSprinting = false;

                const moveVector = new THREE.Vector3(moveX, 0, moveZ);
                if (moveVector.length() > 1) moveVector.normalize();
                const yawRotation = new THREE.Euler(0, this.input.yaw, 0, 'YXZ');
                moveVector.applyEuler(yawRotation);

                if (moveX === 0 && moveZ === 0) {
                    this.playerBody.velocity.x = 0; this.playerBody.velocity.z = 0;
                    this.isSprinting = false; 
                } else {
                    let speedMult = 1.0;
                    if (this.isAiming) speedMult = 0.6;
                    else if (this.isSprinting) speedMult = SETTINGS.sprintMultiplier;
                    
                    this.playerBody.velocity.x = moveVector.x * SETTINGS.moveSpeed * speedMult;
                    this.playerBody.velocity.z = moveVector.z * SETTINGS.moveSpeed * speedMult;
                }

                const speed = Math.sqrt(this.playerBody.velocity.x ** 2 + this.playerBody.velocity.z ** 2);
                if (speed > 2 && Math.abs(this.playerBody.velocity.y) < 1) this.bobTime += dt * (this.isSprinting ? 15 : (this.isAiming ? 8 : 12));
                else this.bobTime += (Math.round(this.bobTime / Math.PI) * Math.PI - this.bobTime) * 0.1;
                const bobOffset = Math.sin(this.bobTime) * (this.isAiming ? 0.05 : 0.15);

                if (this.recoilPitchOffset > 0) this.recoilPitchOffset = Math.max(0, this.recoilPitchOffset - w.recoilRecover * dt);
                if (this.launcherRecoilOffset < 0) this.launcherRecoilOffset = Math.min(0, this.launcherRecoilOffset + w.recoilRecover * dt);
                if (this.currentSpread > w.baseSpread) this.currentSpread = Math.max(w.baseSpread, this.currentSpread - w.recoilRecover * dt);

                this.camera.position.set(this.playerBody.position.x, this.playerBody.position.y + 0.6 + bobOffset, this.playerBody.position.z);
                this.camera.rotation.set(this.input.pitch + this.recoilPitchOffset, this.input.yaw, 0, 'YXZ');

                const targetPos = this.isAiming ? new THREE.Vector3(w.ads.x, w.ads.y, w.ads.z) : new THREE.Vector3(.35, -.35 + (this.isReloading ? -.5 : 0), -.6);
                targetPos.z += this.launcherRecoilOffset;
                const ADS_SPEED = 0.2; const ADS_SCALE = 0.8;
                this.launcherModel.scale.setScalar(THREE.MathUtils.lerp(this.launcherModel.scale.x, this.isAiming ? ADS_SCALE : 1.0, ADS_SPEED));
                this.launcherModel.position.lerp(targetPos, ADS_SPEED);
                
                // Dynamic FOV for Sprinting
                const targetFov = this.isSprinting ? w.fov + 38 : (this.isAiming ? w.fov : 75);
                this.camera.fov = THREE.MathUtils.lerp(this.camera.fov, targetFov, ADS_SPEED);
                this.camera.updateProjectionMatrix();

                // Broadcast Transform & Sprint State Cleanly
                if (network.peer && network.peer.open) {
                    network.broadcast({
                        type: 'transform', id: network.myId,
                        x: this.playerBody.position.x, y: this.playerBody.position.y - 0.8, z: this.playerBody.position.z,
                        yaw: this.input.yaw, pitch: this.input.pitch, wIdx: this.curWIdx, sprint: this.isSprinting
                    });
                }

                // Projectiles Raycast Collisions (Props & Players)
                for (let i = this.projectiles.length - 1; i >= 0; i--) {
                    const p = this.projectiles[i];
                    const prevPos = p.position.clone();
                    
                    const travelDist = p.velocity.length() * dt * 60;
                    p.position.addScaledVector(p.velocity, dt * 60); 
                    p.life--;

                    const travelDir = p.velocity.clone().normalize();
                    const mathRay = new THREE.Ray(prevPos, travelDir);
                    
                    let hitType = null;
                    let closestDist = travelDist + 0.1;
                    let closestPt = null;
                    let hitId = null;

                    // 1. Raycast Static Walls & Dynamic Props
                    const hitMeshes = this.worldObjects.map(obj => obj.mesh).concat(Object.values(this.props).map(prop => prop.mesh));
                    const wallRay = new THREE.Raycaster(prevPos, travelDir, 0, closestDist);
                    const wallHits = wallRay.intersectObjects(hitMeshes, false);
                    if (wallHits.length > 0) {
                        closestDist = wallHits[0].distance;
                        closestPt = wallHits[0].point.clone();
                        
                        // Check if hit object is a dynamic prop
                        hitType = 'wall';
                        const hitMesh = wallHits[0].object;
                        const matchedProp = Object.values(this.props).find(prop => prop.mesh === hitMesh);
                        if (matchedProp) { hitType = 'prop'; hitId = matchedProp.id; }
                    }

                    // 2. Raycast Players (Bounding Box)
                    if (p.ownerId === network.myId) {
                        for (const [id, rpInfo] of Object.entries(this.remotePlayers)) {
                            const rpBox = new THREE.Box3().setFromObject(rpInfo.mesh);
                            rpBox.expandByScalar(0.2); 
                            const targetPt = new THREE.Vector3();
                            if (mathRay.intersectBox(rpBox, targetPt)) {
                                const dist = prevPos.distanceTo(targetPt);
                                if (dist <= closestDist) {
                                    closestDist = dist; closestPt = targetPt.clone();
                                    hitType = 'player'; hitId = id;
                                }
                            }
                        }
                    } else {
                        const myBox = new THREE.Box3().setFromCenterAndSize(this.playerBody.position, new THREE.Vector3(1.4, 2.2, 1.4));
                        const targetPt = new THREE.Vector3();
                        if (mathRay.intersectBox(myBox, targetPt)) {
                            const dist = prevPos.distanceTo(targetPt);
                            if (dist <= closestDist) {
                                closestDist = dist; closestPt = targetPt.clone();
                                hitType = 'me';
                            }
                        }
                    }

                    if (hitType) {
                        p.position.copy(closestPt); p.life = 0;
                        if (hitType === 'wall') this.spawnHitParticles(closestPt, 6, 0xaaaaaa);
                        else if (hitType === 'prop') {
                            this.spawnHitParticles(closestPt, 6, 0xffbb55);
                            this.handlePropDamage(hitId, p.power);
                            network.broadcast({ type: 'prop_dmg', id: hitId, damage: p.power });
                        }
                        else if (hitType === 'player') {
                            this.spawnHitParticles(closestPt, 12, 0xff0000);
                            network.send(hitId, { type: 'damage', targetId: hitId, attackerId: network.myId, damage: p.power });
                        }
                        else if (hitType === 'me') {
                            this.spawnHitParticles(closestPt, 12, 0xff0000);
                        }
                    }

                    if (p.life <= 0) { this.scene.remove(p); this.projectiles.splice(i, 1); }
                }

                for(let i=this.hitParticles.length-1; i>=0; i--){
                    const p = this.hitParticles[i];
                    p.position.addScaledVector(p.velocity, dt); p.velocity.y -= 12 * dt; p.life -= dt;
                    p.material.opacity = Math.max(0, p.life/p.maxLife);
                    if(p.life <= 0){ this.scene.remove(p); p.material.dispose(); this.hitParticles.splice(i, 1); }
                }

                for (let i=this.corpses.length-1; i>=0; i--) {
                    const rp = this.corpses[i];
                    [rp.head, rp.torso, rp.leftArm, rp.rightArm, rp.leftLeg, rp.rightLeg].forEach(part => {
                        if (!part || !part.userData.velocity) return;
                        part.position.addScaledVector(part.userData.velocity, dt); part.userData.velocity.y -= 25 * dt; 
                        if (part.userData.spin) {
                            part.rotation.x += part.userData.spin.x * dt; part.rotation.y += part.userData.spin.y * dt; part.rotation.z += part.userData.spin.z * dt;
                        }
                    });
                    if (performance.now() - rp.deathStart > 4000) {
                        this.scene.remove(rp); if(rp.tag) rp.tag.remove(); this.corpses.splice(i, 1);
                    }
                }
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                if (GAME_STATE === 'PLAYING') {
                    this.updatePhysics(); this.updateNametags();
                } else {
                    this.camera.position.set(Math.sin(Date.now()*0.0003)*80, 40, Math.cos(Date.now()*0.0003)*80);
                    this.camera.lookAt(0,10,0);
                    this.lastTime = performance.now(); 
                }
                this.renderer.render(this.scene, this.camera);
            }
        }

        /* ==========================================================================
           5. BOOTSTRAP
           ========================================================================== */
        const network = new NetworkManager();
        let game;

        function startGameLoop() {
            GAME_STATE = 'PLAYING';
            document.getElementById('waiting-room').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            game.playerBody.position.set((Math.random() - 0.5) * 60, 40, (Math.random() - 0.5) * 60);
            network.updateLeaderboardUI();
            game.updateWeaponUI();
        }

        window.addEventListener('DOMContentLoaded', () => {
            game = new GameEngine();

            const lobbyMenu = document.getElementById('lobby-menu'), waitingRoom = document.getElementById('waiting-room');
            const statusText = document.getElementById('status-text'), displayRoomCode = document.getElementById('display-room-code');
            const btnStartGame = document.getElementById('btn-start-game'), waitingStatus = document.getElementById('waiting-status');

            const savedName = localStorage.getItem('fps_username');
            if(savedName) document.getElementById('username-input').value = savedName;

            function getUsername() {
                const u = document.getElementById('username-input').value.trim();
                if(!u) { alert("Please enter a username!"); return null; }
                localStorage.setItem('fps_username', u);
                return u;
            }

            document.getElementById('btn-host').addEventListener('click', () => {
                const uname = getUsername(); if(!uname) return;
                GAME_STATE = 'WAITING'; statusText.innerText = "Provisioning Arena...";
                network.initHost(uname, (code) => {
                    lobbyMenu.classList.add('hidden'); waitingRoom.classList.remove('hidden');
                    displayRoomCode.innerText = code; document.getElementById('settings-room-code').innerText = code;
                    btnStartGame.classList.remove('hidden'); waitingStatus.classList.add('hidden');
                });
            });

            document.getElementById('btn-join').addEventListener('click', () => {
                const uname = getUsername(); if(!uname) return;
                const code = document.getElementById('room-input').value.trim();
                if (code.length !== 3) { statusText.innerText = "Enter valid 3-char code!"; return; }
                GAME_STATE = 'WAITING'; statusText.innerText = "Connecting to Host...";
                network.initClient(uname, code, () => {
                    document.getElementById('settings-room-code').innerText = code;
                    lobbyMenu.classList.add('hidden'); waitingRoom.classList.remove('hidden');
                    displayRoomCode.innerText = code; btnStartGame.classList.add('hidden'); waitingStatus.classList.remove('hidden');
                }, () => { statusText.innerText = "Connection Failed!"; GAME_STATE = 'LOBBY'; });
            });

            btnStartGame.addEventListener('click', () => { network.broadcast({ type: 'start_game' }); startGameLoop(); });
            
            document.getElementById('btn-settings-hud').addEventListener('click', () => {
                if (game.isLocked) document.exitPointerLock();
                document.getElementById('settings-menu').classList.remove('hidden');
            });
            document.getElementById('btn-close-settings').addEventListener('click', () => document.getElementById('settings-menu').classList.add('hidden'));
            document.getElementById('btn-leave-match').addEventListener('click', () => location.reload());
            
            document.getElementById('sensitivity-slider').addEventListener('input', (e) => SETTINGS.sensitivity = e.target.value * 0.0006);
        });
    </script>
</body>
