<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D FPS - Vertical Cityscape Update</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050a10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay Systems */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 10;
            background: radial-gradient(circle, rgba(10,20,30,0.8) 0%, rgba(0,0,0,0.95) 100%);
        }

        .interactive { pointer-events: auto; }

        /* UI Panels */
        .card {
            background: rgba(15, 20, 25, 0.95);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 30px;
            color: #fff;
            box-shadow: 0 12px 40px rgba(0, 255, 255, 0.15);
            width: 380px;
            text-align: center;
        }

        .card h1 { margin-bottom: 20px; font-size: 28px; text-transform: uppercase; letter-spacing: 2px; color: #0fa; text-shadow: 0 0 10px rgba(0,255,170,0.5); }
        .card h2 { margin-bottom: 15px; font-size: 20px; color: #fff; }

        .input-group {
            background: rgba(0,0,0,0.5);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%; padding: 12px; margin: 8px 0;
            border-radius: 6px; border: 1px solid #555;
            background: #111; color: #fff; font-size: 16px;
            text-align: center; pointer-events: auto; user-select: auto;
        }
        
        input[id="room-input"] { text-transform: uppercase; letter-spacing: 4px; font-weight: bold; color: #fa0; }

        button.btn {
            width: 100%; padding: 14px; margin: 6px 0;
            border-radius: 6px; border: none;
            background: #2563eb; color: #fff;
            font-weight: bold; font-size: 16px; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: all 0.2s; pointer-events: auto;
        }

        button.btn:active { transform: translateY(2px); }
        button.btn-host { background: #10b981; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        button.btn-host:active { background: #059669; }
        button.btn-join { background: #f59e0b; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); color: #000; }
        button.btn-join:active { background: #d97706; }
        button.btn-danger { background: #ef4444; }
        button.btn-danger:active { background: #b91c1c; }

        .player-list {
            background: #0a0a0a; border-radius: 6px; padding: 10px;
            margin: 12px 0; max-height: 150px; overflow-y: auto;
            text-align: left; border: 1px solid #333;
        }

        .player-item { padding: 8px; border-bottom: 1px solid #222; font-size: 15px; display: flex; justify-content: space-between; }
        .player-item:last-child { border-bottom: none; }

        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: rgba(0, 255, 255, 1); border-radius: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 0 5px #0ff;
        }

        .crosshair-line { position: absolute; background: rgba(255, 255, 255, 0.8); }
        .ch-top { top: -10px; left: 1px; width: 2px; height: 8px; }
        .ch-bottom { bottom: -10px; left: 1px; width: 2px; height: 8px; }
        .ch-left { left: -10px; top: 1px; width: 8px; height: 2px; }
        .ch-right { right: -10px; top: 1px; width: 8px; height: 2px; }

        #status-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
        
        #health-container {
            width: 260px; height: 24px; background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 12px;
            overflow: hidden; position: relative;
        }
        #health-bar { width: 100%; height: 100%; background: #22c55e; transition: width 0.1s linear, background-color 0.2s; }
        #health-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 13px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px #000; }
        
        #ammo-display {
            background: rgba(10, 15, 20, 0.85); padding: 8px 24px; border-radius: 8px;
            border: 1px solid #0fa; color: white; font-weight: bold; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #w-name { color: #0fa; font-size: 15px; margin-bottom: 2px; text-transform: uppercase; }
        #ammo-count { font-size: 20px; }
        
        #reloading-text {
            position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
            color: #0fa; font-weight: bold; font-size: 1.2em; display: none;
            text-shadow: 0 0 5px #000; background: rgba(0,0,0,0.6);
            padding: 6px 16px; border-radius: 8px; border: 1px solid #0fa;
        }

        #leaderboard { position: absolute; top: 20px; left: 20px; background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 13px; min-width: 200px; backdrop-filter: blur(4px); }
        #leaderboard h3 { font-size: 14px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 4px; color: #0fa; }
        .lb-row { display: flex; justify-content: space-between; margin-bottom: 5px; }

        #kill-feed { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .kill-msg { background: rgba(239, 68, 68, 0.9); color: white; font-size: 13px; font-weight: bold; padding: 6px 14px; border-radius: 6px; animation: fadeOut 4s forwards; border-left: 3px solid #fff; }

        @keyframes fadeOut { 0% { opacity: 1; transform: translateY(0); } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }

        /* Touch Controls */
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 50%; pointer-events: auto; }
        #joystick-knob { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(255, 255, 255, 0.4); border-radius: 50%; pointer-events: none; }
        .touch-btn { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: rgba(30, 35, 40, 0.85); border: 2px solid rgba(255, 255, 255, 0.3); color: white; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-transform: uppercase; }
        .touch-btn:active { background: rgba(60, 70, 80, 0.9); transform: translateY(2px) scale(0.95); }
        #btn-jump { bottom: 220px; right: 40px; border-color: #fff; }
        #btn-aim { bottom: 140px; right: 40px; border-color: #0ff; width: 70px; height: 70px; }
        #btn-shoot { bottom: 40px; right: 130px; width: 90px; height: 90px; border-color: #f33; background: radial-gradient(circle, #c00 0%, #600 100%); box-shadow: 0 0 20px rgba(255,50,50,0.4); }
        #btn-shoot:active { background: radial-gradient(circle, #f33 0%, #800 100%); }
        #btn-reload { bottom: 40px; right: 240px; border-color: #0fa; }
        #btn-swap { bottom: 110px; right: 240px; border-color: #fa0; }
        #btn-settings-hud { top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 8px; font-size: 16px; }

        /* Nametags Overlay */
        #nametags-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 5; }
        .nametag-wrapper { position: absolute; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -100%); }
        .nametag { color: white; background: rgba(0,0,0,0.7); padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); margin-bottom: 4px; }
        .remote-hp-bg { width: 100%; height: 6px; background: rgba(0,0,0,0.8); border: 1px solid #333; border-radius: 3px; overflow: hidden; }
        .remote-hp-fill { height: 100%; background: #22c55e; transition: width 0.1s; }
        .hidden { display: none !important; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
</head>
<body>

    <canvas id="game-canvas"></canvas>
    <div id="nametags-container"></div>

    <div id="lobby-menu" class="overlay interactive">
        <div class="card">
            <h1>URBAN OPS</h1>
            <input type="text" id="username-input" placeholder="Enter Username" maxlength="12">
            
            <div class="input-group" style="margin-top: 15px;">
                <button id="btn-host" class="btn btn-host">Create New Match</button>
            </div>
            
            <div style="margin: 10px 0; color: #888; font-size: 13px; font-weight: bold;">— OR JOIN EXISTING —</div>
            
            <div class="input-group">
                <input type="text" id="room-input" placeholder="3-CHAR CODE" maxlength="3">
                <button id="btn-join" class="btn btn-join">Join Match</button>
            </div>
            
            <p id="status-text" style="margin-top: 8px; font-size: 14px; color: #0fa; font-weight: bold;"></p>
        </div>
    </div>

    <div id="waiting-room" class="overlay hidden interactive">
        <div class="card">
            <h1>Lobby</h1>
            <h2 style="color: #0fa;">Room Code: <span id="display-room-code" style="background:#111; padding: 4px 8px; border-radius: 4px; border: 1px solid #333;">---</span></h2>
            
            <div class="player-list" id="player-list-container"></div>
        
            <button id="btn-start-game" class="btn btn-host hidden">START COMBAT</button>
            <p id="waiting-status" style="font-size: 14px; color: #aaa;">Waiting for host to start deployment...</p>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div id="crosshair">
            <div class="crosshair-line ch-top"></div>
            <div class="crosshair-line ch-bottom"></div>
            <div class="crosshair-line ch-left"></div>
            <div class="crosshair-line ch-right"></div>
        </div>
        
        <div id="reloading-text">RELOADING...</div>

        <div id="status-container">
            <div id="ammo-display">
                <div id="w-name">AUG</div>
                <div><span id="ammo-count">30</span> / ∞</div>
            </div>
            <div id="health-container">
                <div id="health-bar"></div>
                <div id="health-text">100 / 100</div>
            </div>
        </div>

        <div id="leaderboard">
            <h3>SCOREBOARD</h3>
            <div id="lb-rows"></div>
        </div>

        <div id="kill-feed"></div>

        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="btn-jump" class="touch-btn">JUMP</div>
        <div id="btn-aim" class="touch-btn">AIM</div>
        <div id="btn-shoot" class="touch-btn">FIRE</div>
        <div id="btn-reload" class="touch-btn">RELOAD</div>
        <div id="btn-swap" class="touch-btn">SWAP</div>
        
        <div id="btn-settings-hud" class="touch-btn">⚙️</div>
    </div>

    <div id="settings-menu" class="overlay hidden interactive">
        <div class="card">
            <h2>Settings</h2>
            <p style="margin-bottom: 15px; color: #0fa; font-weight: bold;">Room Code: <span id="settings-room-code">---</span></p>
            <div style="text-align: left; margin-bottom: 20px;">
                <label style="color:#ccc; font-size:14px; font-weight:bold;">Look Sensitivity</label>
                <input type="range" id="sensitivity-slider" min="1" max="10" value="5" style="width: 100%; margin-top: 8px;">
            </div>
            <button id="btn-close-settings" class="btn btn-host">Resume Game</button>
            <button id="btn-leave-match" class="btn btn-danger" style="margin-top: 10px;">Leave Match</button>
        </div>
    </div>

    <script>
        /* ==========================================================================
           1. CONFIGURATION & NETWORK TRANSPORT
           ========================================================================== */
        const MQTT_BROKER_URL = "wss://broker.hivemq.com:8884/mqtt";
        const TOPIC_PREFIX = "coltons-multiplayer-fps-v3/";

        const SETTINGS = {
            sensitivity: 0.003,
            moveSpeed: 16,
            jumpForce: 30,
            sprintMultiplier: 1.3
        };
        let GAME_STATE = 'LOBBY';

        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 8, t | 38);
                return ((t ^ t >>> 10) >>> 0) / 4294967296;
            }
        }
        function getSeedFromCode(code) {
            let seed = 0;
            for (let i = 0; i < code.length; i++) seed = (seed << 5) - seed + code.charCodeAt(i);
            return seed >>> 0;
        }

        function stringToColorHex(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            let c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
            return parseInt('00000'.substring(0, 6 - c.length) + c, 16);
        }

        /* ==========================================================================
           2. PROCEDURAL TEXTURES & WEAPON DATA
           ========================================================================== */
        const TextureGenerator = {
            createTex: (w, h, draw) => {
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const x = c.getContext('2d');
                draw(x, w, h);
                const tex = new THREE.CanvasTexture(c);
                tex.anisotropy = 4;
                return tex;
            },
            createNoiseTexture: (a, b) => {
                return TextureGenerator.createTex(256, 256, (c, w, h) => {
                    c.fillStyle = a; c.fillRect(0, 0, w, h);
                    for (let i = 0; i < 8000; i++) {
                        c.fillStyle = Math.random() > .5 ? b : a;
                        c.fillRect(Math.random() * w, Math.random() * h, 3, 3);
                    }
                });
            },
            createGrid: (color1 = '#222', color2 = '#333') => {
                return TextureGenerator.createTex(512, 512, (c, w, h) => {
                    c.fillStyle = color1; c.fillRect(0, 0, w, h);
                    c.fillStyle = color2;
                    const thick = 8;
                    c.fillRect(0, 0, w, thick); c.fillRect(0, h-thick, w, thick);
                    c.fillRect(0, 0, thick, h); c.fillRect(w-thick, 0, thick, h);
                });
            }
        };

        // BALANCED WEAPONS: Lowered base damage on automatic rifles, added dynamic spread growth/drift metrics.
        const WEAPONS = [
            {name:"M4 CARBINE", auto:true, color:0x222222, ads:{x:0, y:-.14, z:-.5}, fov:48, rate:95, recoil:.045, camRecoil:.025, recoilRecover:.14, baseSpread:.009, spreadGrowth:.006, maxSpread:.08, reticle:0xff0000, dmg:10, mag:30, reloadTime:1700},
            {name:"AUG", auto:true, color:0x3d4436, ads:{x:0, y:-.14, z:-.5}, fov:42, rate:85, recoil:.075, camRecoil:.03, recoilRecover:.13, baseSpread:.004, spreadGrowth:.008, maxSpread:.07, reticle:0x00ff00, dmg:10, mag:30, reloadTime:1900},
            {name:"SCAR-H", auto:true, color:0xc2b280, ads:{x:0, y:-.14, z:-.5}, fov:45, rate:145, recoil:.09, camRecoil:.045, recoilRecover:.16, baseSpread:.012, spreadGrowth:.01, maxSpread:.1, reticle:0xff0000, dmg:15, mag:20, reloadTime:2100},
            {name:"TRENCH GUN", auto:false, color:0xe3e3e3, ads:{x:0, y:-.12, z:-.5}, fov:50, rate:750, recoil:.22, camRecoil:.13, recoilRecover:.20, baseSpread:.32, spreadGrowth:0, maxSpread:.32, pellets:12, reticle:null, dmg:6, mag:6, reloadTime:2500}
        ];
        WEAPONS.forEach(w => w.ammo = w.mag);

        /* ==========================================================================
           3. NETWORK MANAGER
           ========================================================================== */
        class NetworkManager {
            constructor() {
                this.peer = null; this.mqttClient = null; this.roomTopic = null;
                this.connections = {}; this.lastSeen = {};
                this.isHost = false; this.myId = null; this.roomCode = null;
                this.username = "Player"; this.lobbyPlayers = [];
            }

            _makeId() { return Math.random().toString(36).substring(2, 10) + Date.now().toString(36); }

            _connectMqtt(onReady) {
                this.myId = this._makeId();
                this.mqttClient = mqtt.connect(MQTT_BROKER_URL);
                this.mqttClient.on('connect', () => {
                    this.mqttClient.subscribe(this.roomTopic, (err) => { if (!err) onReady(); });
                });
                this.mqttClient.on('error', (err) => { if (this._onNetError) this._onNetError(err); });
                this.mqttClient.on('message', (topic, payloadBuf) => {
                    if (topic !== this.roomTopic) return;
                    let msg; try { msg = JSON.parse(payloadBuf.toString()); } catch (e) { return; }
                    if (!msg || !msg.__senderId || msg.__senderId === this.myId) return;
                    this.connections[msg.__senderId] = true;
                    this.lastSeen[msg.__senderId] = Date.now();
                    this.handleData(msg.__senderId, msg.payload);
                });
                
                if (!this._presenceInterval) {
                    this._presenceInterval = setInterval(() => {
                        if (this.mqttClient && this.mqttClient.connected) this.broadcast({ type: 'presence' });
                    }, 3000);
                }
                if (!this._timeoutInterval) {
                    this._timeoutInterval = setInterval(() => {
                        const now = Date.now();
                        Object.keys(this.lastSeen).forEach((id) => {
                            if (now - this.lastSeen[id] > 9000 && this.connections[id]) {
                                delete this.connections[id]; delete this.lastSeen[id];
                                game.removeRemotePlayer(id);
                                if (this.isHost) {
                                    this.lobbyPlayers = this.lobbyPlayers.filter(p => p.id !== id);
                                    this.broadcast({ type: 'lobby_update', players: this.lobbyPlayers });
                                    this.updateLobbyUI(); this.updateLeaderboardUI();
                                }
                            }
                        });
                    }, 3000);
                }
            }

            initHost(username, onOpen) {
                this.username = username; this.isHost = true;
                this.roomCode = Math.random().toString(36).substring(2, 5).toUpperCase();
                this.roomTopic = TOPIC_PREFIX + this.roomCode;
                this._connectMqtt(() => {
                    this.lobbyPlayers = [{ id: this.myId, username: this.username, isHost: true, kills: 0, deaths: 0 }];
                    this.updateLobbyUI();
                    game.buildProceduralWorld(this.roomCode);
                    this.peer = { open: true }; 
                    onOpen(this.roomCode);
                });
            }

            initClient(username, code, onConnected, onError) {
                this.username = username; this.isHost = false;
                this.roomCode = code.toUpperCase();
                this.roomTopic = TOPIC_PREFIX + this.roomCode;
                this._onNetError = onError;
                this._connectMqtt(() => {
                    this.peer = { open: true };
                    this.broadcast({ type: 'join', username: this.username });
                    game.buildProceduralWorld(this.roomCode);
                    onConnected();
                });
            }

            broadcast(data) {
                if (!this.mqttClient) return;
                this.mqttClient.publish(this.roomTopic, JSON.stringify({ __senderId: this.myId, payload: data }));
            }

            send(connId, data) { this.broadcast(Object.assign({ __targetId: connId }, data)); }

            handleData(senderId, data) {
                if (data.__targetId && data.__targetId !== this.myId) return;

                if (data.type === 'presence') {}
                else if (data.type === 'join' && this.isHost) {
                    this.lobbyPlayers.push({ id: senderId, username: data.username, isHost: false, kills: 0, deaths: 0 });
                    this.broadcast({ type: 'lobby_update', players: this.lobbyPlayers });
                    this.updateLobbyUI(); this.updateLeaderboardUI();
                    
                    if (GAME_STATE === 'PLAYING') {
                        this.send(senderId, { type: 'start_game' });
                    }
                }
                else if (data.type === 'lobby_update') {
                    this.lobbyPlayers = data.players;
                    this.updateLobbyUI(); this.updateLeaderboardUI();
                }
                else if (data.type === 'start_game') { startGameLoop(); }
                else if (data.type === 'transform' && GAME_STATE === 'PLAYING') {
                    game.updateRemotePlayer(senderId, data);
                    if (this.isHost) {
                        Object.keys(this.connections).forEach(id => {
                            if (id !== senderId) this.send(id, data);
                        });
                    }
                } 
                else if (data.type === 'shoot' && GAME_STATE === 'PLAYING') {
                    game.spawnRemoteBullet(data.origin, data.direction, senderId, data.power);
                    if (this.isHost) {
                        Object.keys(this.connections).forEach(id => {
                            if (id !== senderId) this.send(id, data);
                        });
                    }
                }
                else if (data.type === 'damage' && GAME_STATE === 'PLAYING') {
                    if (data.targetId === this.myId) game.takeDamage(data.damage, data.attackerId);
                }
                else if (data.type === 'prop_dmg' && GAME_STATE === 'PLAYING') {
                    game.handlePropDamage(data.id, data.damage);
                }
                else if (data.type === 'hp_update' && GAME_STATE === 'PLAYING') {
                    if (game.remotePlayers[senderId]) {
                        const fill = document.getElementById(`hp-fill-${senderId}`);
                        if (fill) fill.style.width = `${Math.max(0, data.hp)}%`;
                    }
                }
                else if (data.type === 'player_killed' && GAME_STATE === 'PLAYING') {
                    game.triggerRagdoll(data.victimId);
                    if (this.isHost) {
                        const killer = this.lobbyPlayers.find(p => p.id === data.killerId);
                        const victim = this.lobbyPlayers.find(p => p.id === data.victimId);
                        if (killer && killer.id !== victim.id) killer.kills++;
                        if (victim) victim.deaths++;

                        const kName = killer ? killer.username : "Unknown";
                        const vName = victim ? victim.username : "Unknown";

                        this.broadcast({ type: 'lobby_update', players: this.lobbyPlayers });
                        this.broadcast({ type: 'kill_msg', msg: `${kName} eliminated ${vName}` });
                        this.updateLeaderboardUI();
                        showKillFeed(`${kName} eliminated ${vName}`);
                    }
                }
                else if (data.type === 'kill_msg') { showKillFeed(data.msg); }
            }

            updateLobbyUI() {
                const container = document.getElementById('player-list-container');
                if (!container) return;
                container.innerHTML = '';
                this.lobbyPlayers.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'player-item';

            updateLeaderboardUI() {

        function showKillFeed(msg) {
