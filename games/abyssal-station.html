<!-- STUN PROD FIX: sphere meshes are stripped from the held model; firing effect is a line beam only. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02080d">
<title>Abyssal Station</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap">
<style>
:root{--ink:#02080d;--deep:#04141c;--panel:rgba(3,16,23,.86);--line:#27d3dd;--line2:rgba(39,211,221,.28);--amber:#ffb24a;--warn:#ff5a48;--ok:#62f0b4;--dim:#6f9ba6;--txt:#d3eef3;--ui:'Rajdhani','Bahnschrift','Segoe UI',system-ui,sans-serif;--mono:'Share Tech Mono',ui-monospace,Consolas,monospace;--cut:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--txt);font:600 15px/1.25 var(--ui);letter-spacing:.02em;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#04202c}
.mono{font-family:var(--mono)}
/* chamfered plate */
.plate{background:var(--panel);border:1px solid var(--line2);clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));backdrop-filter:blur(3px)}
.tag{font:400 11px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
/* ===== HUD ===== */
#hud{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:1;transition:opacity .4s}
#hud.off{opacity:0}
#visor{position:absolute;inset:0;background:radial-gradient(ellipse 78% 74% at 50% 50%,transparent 62%,rgba(1,10,15,.55) 88%,rgba(1,6,10,.88) 100%)}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(255,40,20,.7) 100%);opacity:0;transition:opacity .35s}
#lowair{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(10,30,60,.9) 100%);opacity:0}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:1px solid rgba(211,238,243,.55);border-radius:50%;transition:all .15s}
#cross::after{content:"";position:absolute;left:50%;top:50%;width:2px;height:2px;margin:-1px;background:#fff;border-radius:50%}
#cross.hot{border-color:var(--amber);transform:scale(1.5);box-shadow:0 0 8px rgba(255,178,74,.5)}
#scanring{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;opacity:0}
#prompt{position:absolute;left:50%;top:calc(50% + 34px);transform:translateX(-50%);padding:5px 14px 6px;white-space:nowrap;font-size:16px;color:var(--amber);opacity:0;transition:opacity .12s}
#prompt b{color:#fff;font-family:var(--mono);font-weight:400;border:1px solid var(--amber);padding:0 6px;margin-right:8px;font-size:13px}
#prompt.on{opacity:1}
/* depth ladder */
#ladder{position:absolute;left:0;top:50%;width:92px;height:300px;margin-top:-150px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
#ladder .tape{position:absolute;left:0;top:0;width:100%;will-change:transform}
#ladder .tk{position:absolute;left:14px;height:1px;width:10px;background:rgba(111,155,166,.6)}
#ladder .tk.m{width:20px;background:var(--line)}
#ladder .tn{position:absolute;left:38px;font:400 11px var(--mono);color:var(--dim);transform:translateY(-50%)}
#ladder .mk{position:absolute;left:0;top:50%;width:92px;height:0;border-top:1px solid var(--amber)}
#ladder .mk::before{content:"";position:absolute;left:2px;top:-6px;border:6px solid transparent;border-left:9px solid var(--amber)}
#depthbox{position:absolute;left:12px;top:calc(50% - 206px);font-family:var(--mono)}
#depthbox .big{font-size:30px;line-height:1;color:#fff;letter-spacing:.04em}
#depthbox .big small{font-size:13px;color:var(--dim);margin-left:3px}
#suitline{position:absolute;left:12px;top:calc(50% + 160px);font:400 11px var(--mono);color:var(--dim);letter-spacing:.1em;width:150px}
#suitline i{display:block;height:3px;margin-top:5px;background:rgba(111,155,166,.25)}
#suitline i b{display:block;height:100%;background:var(--line);width:0}
#suitline.over{color:var(--warn)}#suitline.over i b{background:var(--warn)}
/* vitals */
#vitals{position:absolute;left:14px;bottom:14px;display:flex;align-items:flex-end;gap:12px}
#o2{position:relative;width:96px;height:96px}
#o2 svg{width:100%;height:100%;transform:rotate(-90deg)}
#o2 .bg{fill:none;stroke:rgba(111,155,166,.22);stroke-width:7}
#o2 .fg{fill:none;stroke:var(--line);stroke-width:7;stroke-linecap:butt;transition:stroke .3s}
#o2.low .fg{stroke:var(--warn)}
#o2 .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono)}
#o2 .ct b{font-size:22px;font-weight:400;color:#fff}
#o2 .ct span{font-size:10px;color:var(--dim);letter-spacing:.14em}
#hpwrap{width:120px;padding-bottom:6px}
#hp{display:flex;gap:3px;margin-top:5px}
#hp i{flex:1;height:9px;background:rgba(111,155,166,.22);transform:skewX(-20deg)}
#hp i.on{background:var(--ok)}#hp.low i.on{background:var(--warn)}
#pwr{margin-top:9px;font:400 11px var(--mono);color:var(--dim);letter-spacing:.1em}
/* compass */
#compass{position:absolute;left:50%;top:10px;width:min(440px,58vw);height:34px;transform:translateX(-50%);overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
#compass .cn{position:absolute;top:0;font:400 12px var(--mono);color:var(--dim);transform:translateX(-50%)}
#compass .cn.k{color:#fff}
#compass .ct2{position:absolute;bottom:6px;width:1px;height:6px;background:rgba(111,155,166,.5)}
#compass .ob{position:absolute;bottom:0;width:10px;height:10px;transform:translateX(-50%) rotate(45deg);border:2px solid var(--amber);background:rgba(255,178,74,.2)}
#compass .ctr{position:absolute;left:50%;bottom:-1px;margin-left:-5px;border:5px solid transparent;border-bottom:7px solid var(--line)}
/* objective */
#objective{position:absolute;right:14px;top:14px;width:min(270px,44vw);padding:10px 14px 11px 16px;border-left:2px solid var(--amber)}
#objective .t{font-size:12px;color:var(--amber);letter-spacing:.18em;text-transform:uppercase}
#objective .d{margin-top:3px;font-size:16px;line-height:1.2;color:#fff}
#objective .m{margin-top:5px;font:400 12px var(--mono);color:var(--dim)}
/* tools */
#tools{position:absolute;left:50%;bottom:12px;touch-action:manipulation;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
.tool{position:relative;width:62px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;letter-spacing:.14em;color:var(--dim);cursor:pointer;--cut:7px}
.tool b{position:absolute;left:5px;top:2px;font:400 10px var(--mono);color:var(--dim)}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:2px}
.tool.sel{color:var(--amber);border-color:var(--amber);background:rgba(40,26,6,.8)}
.tool.dis{opacity:.35}
.tool em{position:absolute;right:5px;top:2px;font:400 10px var(--mono);font-style:normal;color:#fff}
/* comm */
#comm{position:absolute;left:50%;bottom:76px;transform:translate(-50%,10px);width:min(560px,92vw);padding:9px 16px 11px 12px;display:flex;gap:12px;opacity:0;transition:all .25s}
#comm.on{opacity:1;transform:translate(-50%,0)}
#comm .av{flex:none;width:44px;height:44px;border:1px solid var(--line2);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:7px 6px;position:relative}
#comm .av i{width:4px;background:var(--line);height:20%;transition:height .08s}
#comm .nm{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--line)}
#comm.dsp .nm{color:var(--amber)}#comm.dsp .av i{background:var(--amber)}
#comm.log .nm{color:var(--ok)}#comm.log .av i{background:var(--ok)}
#comm .tx{font-size:17px;line-height:1.25;color:#fff;margin-top:2px}
#toasts{position:absolute;left:50%;top:54px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px}
.toast{padding:5px 14px;font-size:15px;color:#fff;animation:tin .25s,tout .4s 2.6s forwards;--cut:6px}
.toast.a{color:var(--amber)}.toast.w{color:var(--warn)}
.toast small{display:block;font:400 10px var(--mono);letter-spacing:.18em;color:var(--dim)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30;transition:opacity .8s}
#card{position:fixed;inset:0;z-index:31;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1s;text-align:center}
#card.on{opacity:1}
#card .a{font:400 12px var(--mono);letter-spacing:.5em;color:var(--dim)}
#card .b{font-size:clamp(30px,6vw,64px);font-weight:300;letter-spacing:.28em;color:#fff;margin:10px 0 6px;text-transform:uppercase}
#card .c{font-size:17px;letter-spacing:.12em;color:var(--line)}
/* ===== screens ===== */
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center}
#loading{z-index:40;background:var(--ink);flex-direction:column;gap:18px}
#loading .bar{width:min(320px,70vw);height:2px;background:rgba(111,155,166,.25)}
#loading .bar i{display:block;height:100%;width:0;background:var(--line);transition:width .15s}
#loading .tt{font-size:13px;letter-spacing:.5em;color:var(--dim);text-transform:uppercase}
#title{justify-content:flex-start;background:linear-gradient(90deg,rgba(1,8,12,.92) 0%,rgba(1,8,12,.55) 42%,transparent 70%)}
#title .col{margin-left:max(6vw,22px);width:min(420px,88vw)}
#title h1{margin:0;font-weight:300;font-size:clamp(36px,6.4vw,76px);line-height:.95;letter-spacing:.22em;color:#fff;text-transform:uppercase}
#title h1 span{display:block;color:var(--line);font-weight:700;font-size:.3em;letter-spacing:.32em;margin-top:12px;white-space:nowrap}
#title .sub{margin:16px 0 26px;font:400 12px var(--mono);letter-spacing:.2em;color:var(--dim)}
.menu{display:flex;flex-direction:column;gap:2px;align-items:stretch}
.mi{position:relative;padding:11px 14px 11px 18px;font-size:19px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt);cursor:pointer;border-left:1px solid var(--line2);transition:all .12s;display:flex;justify-content:space-between;align-items:center;background:none;border-top:0;border-right:0;border-bottom:0;font-family:var(--ui);text-align:left}
.mi:hover,.mi:focus-visible{outline:none;color:#fff;border-left-color:var(--amber);background:linear-gradient(90deg,rgba(255,178,74,.16),transparent)}
.mi small{font:400 11px var(--mono);letter-spacing:.1em;color:var(--dim);text-transform:none}
.mi.dis{opacity:.35;pointer-events:none}
.btn{font:600 14px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--txt);background:rgba(39,211,221,.08);border:1px solid var(--line2);padding:8px 16px;cursor:pointer;--cut:6px;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.btn:hover{background:rgba(255,178,74,.16);border-color:var(--amber);color:#fff}
.btn.pri{background:rgba(255,178,74,.18);border-color:var(--amber);color:var(--amber)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.sm{padding:5px 11px;font-size:12px}
/* slate (terminal) */
#slate{background:rgba(1,7,11,.78);backdrop-filter:blur(5px)}
.sl{position:relative;width:min(980px,96vw);height:min(600px,92vh);display:flex;--cut:16px}
.rail{flex:none;width:76px;display:flex;flex-direction:column;border-right:1px solid var(--line2);padding:8px 0}
.rail button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;font:400 10px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;border-left:2px solid transparent}
.rail button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rail button.on{color:var(--amber);border-left-color:var(--amber);background:linear-gradient(90deg,rgba(255,178,74,.14),transparent)}
.rail button:hover{color:#fff}
.sbody{flex:1;min-width:0;display:flex;flex-direction:column}
.shead{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 10px;border-bottom:1px solid var(--line2)}
.shead h2{margin:0;font-size:20px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#fff}
.sscroll{flex:1;overflow:auto;padding:14px 18px 18px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sscroll::-webkit-scrollbar{width:6px}.sscroll::-webkit-scrollbar-thumb{background:var(--line2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{border:1px solid var(--line2);padding:10px 12px;background:rgba(39,211,221,.04);position:relative}
.card h3{margin:0 0 3px;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:#fff;display:flex;justify-content:space-between;gap:8px}
.card p{margin:3px 0 7px;font-size:14px;color:#a9cdd5;line-height:1.3}
.card .cost{font:400 12px var(--mono);color:var(--dim);margin-bottom:8px}
.card .cost .y{color:var(--ok)}.card .cost .n{color:var(--warn)}
.card.locked{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:400 12px var(--mono);padding:4px 9px;border:1px solid var(--line2);color:var(--txt)}
.chip b{color:var(--amber);font-weight:400;margin-left:6px}
.sec{margin:16px 0 8px;font-size:12px;letter-spacing:.3em;color:var(--line);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line2)}
.sec:first-child{margin-top:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(39,211,221,.1)}
.row label{font-size:15px}
.row input[type=range]{width:160px;accent-color:var(--amber)}
.row select{background:#04202c;color:var(--txt);border:1px solid var(--line2);padding:5px 8px;font:inherit}
.logtxt{font-size:16px;line-height:1.4;color:#d9f1f5;white-space:pre-wrap}
.logtxt .by{display:block;margin-top:10px;font:400 12px var(--mono);color:var(--dim);letter-spacing:.14em}
.empty{color:var(--dim);font:400 13px var(--mono);letter-spacing:.1em;padding:18px 0}
#mapc{width:100%;max-width:620px;aspect-ratio:7/11;max-height:56vh;background:#021017;border:1px solid var(--line2);display:block;margin:0 auto;touch-action:none}
/* modal / pause / dialog */
.modal{background:rgba(1,7,11,.72);backdrop-filter:blur(4px)}
.mbox{width:min(460px,92vw);padding:22px 24px 20px;--cut:14px}
.mbox h2{margin:0 0 14px;font-size:20px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#fff}
.mbox .tx{font-size:16px;line-height:1.4;color:#c4e3ea;margin-bottom:14px}
.choice{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 14px;background:rgba(39,211,221,.06);border:1px solid var(--line2);color:#fff;font:600 16px var(--ui);cursor:pointer;letter-spacing:.04em}
.choice small{display:block;font:400 12px var(--mono);color:var(--dim);margin-top:3px}
.choice:hover{border-color:var(--amber);background:rgba(255,178,74,.12)}
.choice[disabled]{opacity:.4;pointer-events:none}
.slotrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line2);margin-bottom:6px;background:rgba(39,211,221,.04)}
.slotrow .i{font:400 12px var(--mono);color:var(--dim)}
#ending{background:#000;flex-direction:column;text-align:center;padding:24px}
#ending .box{max-width:640px}
#ending h1{font-weight:300;letter-spacing:.3em;font-size:clamp(24px,4.5vw,44px);margin:0 0 18px;color:#fff;text-transform:uppercase}
#ending p{font-size:18px;line-height:1.5;color:#bddde4;margin:0 0 14px}
#ending .st{font:400 12px var(--mono);color:var(--dim);letter-spacing:.14em;margin:18px 0}
#tip{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:19;padding:14px 22px;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:#fff;pointer-events:none;text-align:center}
/* ===== touch ===== */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none;display:none}
body.touch #touch{display:block}
#stickzone{position:absolute;left:0;top:0;bottom:0;width:46%;pointer-events:auto}
#lookzone{position:absolute;right:0;top:0;bottom:0;width:54%;pointer-events:auto}
#stick{position:absolute;width:118px;height:118px;margin:-59px 0 0 -59px;border:1px solid var(--line2);border-radius:50%;background:radial-gradient(circle,rgba(39,211,221,.1),transparent 70%);opacity:0;transition:opacity .15s}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;border:1px solid var(--line);background:rgba(39,211,221,.18)}
.tb{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:50%;border:1px solid var(--line2);background:rgba(3,16,23,.62);color:var(--txt);font:700 11px var(--ui);letter-spacing:.1em;text-transform:uppercase;touch-action:none}
.tb.p{border-color:var(--amber);color:var(--amber);background:rgba(40,26,6,.7)}
.tb:active,.tb.hold{background:rgba(255,178,74,.3);border-color:var(--amber)}
.tb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (max-height:520px){#objective{width:min(250px,34vw);padding:6px 10px 7px 12px}#objective .d{font-size:14px}#objective .t{font-size:11px}#comm{left:42%;width:min(430px,56vw);bottom:70px;padding:7px 12px 8px 9px}#comm .tx{font-size:15px}#comm .av{width:34px;height:34px}.tool{width:54px;height:44px}.tool svg{width:18px;height:18px}#o2{width:78px;height:78px}#o2 .ct b{font-size:18px}#ladder,#depthbox,#suitline{display:none}.sl{height:96vh}.rail{width:56px}.rail button span{display:none}}
@media (max-width:640px){.rail{width:52px}.rail button span{display:none}.sbody .shead h2{font-size:16px}#objective{width:40vw}#vitals{transform:scale(.85);transform-origin:left bottom}}
#decbtn{display:none}body.touch #bpbox{right:auto!important;left:12px!important;top:66px!important;bottom:auto!important;width:min(250px,38vw)!important;max-height:calc(100% - 66px - 110px);padding:6px 8px!important}body.touch #bpbox .row{padding:10px 8px!important;min-height:42px}body.touch.build #decbtn{display:flex}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="off">
  <div id="visor"></div><div id="lowair"></div><div id="hurt"></div>
  <div id="cross"></div>
  <svg id="scanring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="none" stroke="rgba(255,178,74,.25)" stroke-width="2"/><circle id="scanarc" cx="23" cy="23" r="20" fill="none" stroke="#ffb24a" stroke-width="3" stroke-dasharray="125.7" stroke-dashoffset="125.7" transform="rotate(-90 23 23)"/></svg>
  <div id="prompt" class="plate" style="--cut:6px"></div>
  <div id="depthbox"><div class="tag">Depth</div><div class="big"><span id="dnum">000</span><small>m</small></div></div>
  <div id="ladder"><div class="tape" id="tape"></div><div class="mk"></div></div>
  <div id="suitline"><span id="suittx">SUIT RATED 45m</span><i><b id="suitbar"></b></i></div>
  <div id="vitals">
    <div id="o2"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" id="o2arc" cx="50" cy="50" r="42" stroke-dasharray="263.9" stroke-dashoffset="0"/></svg><div class="ct"><b id="o2n">100</b><span>O2 SEC</span></div></div>
    <div id="hpwrap"><div class="tag">Vitals</div><div id="hp"></div><div id="pwr"></div></div>
  </div>
  <div id="compass"><div class="ctr"></div></div>
  <div id="objective" class="plate"><div class="t" id="otitle"></div><div class="d" id="otext"></div><div class="m" id="ometa"></div></div>
  <div id="comm" class="plate"><div class="av"><i></i><i></i><i></i><i></i><i></i></div><div><div class="nm" id="cnm"></div><div class="tx" id="ctx"></div></div></div>
  <div id="toasts"></div>
  <div id="tools"></div>
</div>
<div id="touch">
  <div id="stickzone"><div id="stick"><i></i></div></div>
  <div id="lookzone"></div>
</div>

const CODEX={
 chromis:{n:'Blue Chromis',g:'Fauna',d:6,t:'Tiny reef fish that move as one flickering sheet. The whole school turns when a single fish changes its mind. Harmless, curious, and a dependable sign that the water is healthy.'},
 jelly:{n:'Lantern Jelly',g:'Fauna',d:8,t:'A drifting bell that pulses with soft light. Their glow dims in unison when the hum passes through the water. Nobody on record has been stung, but nobody on record has tried very hard.'},
 coral:{n:'Brain Coral',g:'Flora',d:6,t:'Slow, ancient and folded like a mind. This colony pre-dates the station by a century and has quietly outlasted every plan humans made around it.'},
 crab:{n:'Needle Crab',g:'Fauna',d:7,t:'A skittering scavenger that strips wrecks of anything soft. It carries scraps of metal on its back as armour. A fair trade, since it has taste in salvage.'},
 clam:{n:'Pearl Clam',g:'Fauna',d:9,t:'A deep clam that grows a pearl lit from inside. The glow appears to answer the hum. Marketing called it a luxury good. Priya called it a listening device.'},
 kelp:{n:'Giant Kelp',g:'Flora',d:6,t:'Towering strands that lean, every one of them, toward the Trench. They are not swaying with a current. They are pointing.'},
 gulper:{n:'Gulper',g:'Fauna',d:12,t:'An ambush eel with a jaw that unhinges to swallow prey whole. Strictly territorial. A jolt of current makes it let go, and a flare makes it think twice.'},
 drifter:{n:'Drifter',g:'Fauna',d:15,t:'A colossal, slow, gentle filter-feeder. It follows the old route along the edge of the Trench, and it is the only large animal here that does not seem afraid.'},
 lurker:{n:'Lurker',g:'Fauna',d:18,t:'Lean, many-segmented, lit along the spine. They hunt by sound and they flinch from sudden light. They do not feed. They herd, nudging anything noisy away from the deep.'},
 tubeworm:{n:'Vent Tube Worm',g:'Fauna',d:8,t:'White stalks with crimson plumes, clustered where hot water leaks from the rock. They sway in time with the pulse from below.'},
 bloom:{n:'Lantern Bloom',g:'Flora',d:12,t:'A deep-water flower that glows brighter the closer you get to the source of the song. It is not a plant. It is a fingertip.'},
 vent:{n:'Thermal Vent',g:'Geology',d:8,t:'A chimney of mineral that breathes superheated water. The station\'s power taps a small one. The big ones are further down, and they are not geology either.'},
 w_capsule:{n:'Your Drop Capsule',g:'Site',d:4,t:'A one-way ride, sinking slowly. The company has a name for single-occupant deployments: efficiency.'},
 w_calloway:{n:'MV Calloway',g:'Wreck',d:14,t:'A bulk carrier that sank twenty-three years ago in calm weather. Its sonar log shows a ghost contact, and a course change nobody ordered.'},
 w_halden:{n:'Consortium Tender Halden',g:'Wreck',d:16,t:'The supply ship that brought the drill\'s final shipment. Its hull is split along a seam as if it were pulled apart from below.'},
 w_hesper:{n:'Submarine Hesper',g:'Wreck',d:14,t:'A research sub. The hatch is welded shut from the inside. The porthole holds a single pressed handprint.'},
 w_maren:{n:'Trawler Maren',g:'Wreck',d:12,t:'A small fishing boat. Nets still full. Whoever lost her, lost her fast.'},
 w_dome:{n:'Garden Dome',g:'Site',d:10,t:'Dr. Raman\'s greenhouse-lab, half swallowed by kelp. The glass is cloudy but intact. Every plant inside is pointing south.'},
 w_workshop:{n:'Bell\'s Workshop',g:'Site',d:10,t:'An engineer\'s shack bolted to a cliff. The door is welded shut from the outside, a tidy, careful, terrified weld.'},
 w_camp:{n:'Tartarus Camp',g:'Site',d:14,t:'The last crew camp before the drill. Six bunks, six cups, no signs of struggle. Just six empty chairs facing south.'},
 w_drill:{n:'Tartarus Drill',g:'Site',d:16,t:'A rig the size of a cathedral, frozen mid-bite. Its bit is still buried in the seabed. The seabed around it is glowing.'},

const LOGS={
 okafor1:{t:'Recon Summary',by:'Dr. Ines Okafor, Station Lead',x:"Day 212. Pelagia is our shallow base; the drill rig is at Tartarus Vent, 360 metres down.\n\nThe thermal field under us is the richest ever charted, with crystals the size of a man. Director Voss calls it 'a gold mine at 36 atmospheres'. I called it a risk assessment. He did not laugh."},
 okafor2:{t:'Hum',by:'Dr. Ines Okafor',x:"Day 301. First cores from Tartarus came up warm. Body-warm. Priya says the fluid has organics in it. Voss says that is 'a bonus'.\n\nThe fish have started leaving the reef at night. Nobody says it aloud, but the water has begun to hum."},
 raman1:{t:'Garden Log 41',by:'Dr. Priya Raman, Biologist',x:"The kelp is leaning south. All of it. Every frond, a few degrees toward the Trench, like a field of compass needles.\n\nSomething is moving water down there. Or something is calling it."},
 raman2:{t:'Garden Log 52',by:'Dr. Priya Raman',x:"The hum has a structure. I ran the hydrophone through the spectrograph: six distinct tones, repeating, rising. It is not geology.\n\nInes thinks it is a song. I think it is a question. We have stopped sleeping."},
 bell1:{t:'Workshop Note',by:'Marcus Bell, Engineer',x:"Built the scooter out of a lift pump and spite. The pressure ring for the Mk III suit is in the vise. Do not let Voss near it, he will cut it up for the drill.\n\nThe hum rattles the bit. Every time we cut, it screams back."},
 bell2:{t:'Seal',by:'Marcus Bell',x:"Day 330. Three of us went down to the drill dome and did not come back for six hours. Tomas says he does not remember. He says the water told him to put his helmet down.\n\nI am welding the workshop shut from the outside. I am not going back to Tartarus."},
 calloway:{t:"Master's Log",by:'Capt. Lena Ostrander, MV Calloway',x:"Sonar shows a contact on the bottom, singing through the hull. Crew restless. Helmsman Pike holds a heading we did not plot.\n\nWe are going down, I think. Slowly. Into the thing we mistook for a reef."},
 yuki:{t:'Final Dive',by:'Yuki Tanabe, Chief Diver',x:"Every ship that ever wrecked on this coast ends up here, as if the seabed were tilted toward the Trench.\n\nI am filming with my lamp off. The Lurkers do not follow light. They follow noise. They were never hunting us. They were herding us away."},
 manifest:{t:'Halden Manifest',by:'H. Kane, Consortium Operations',x:"Cargo, final run: 40 tonnes of cutting heads. 12 containment charges. One sealed crate marked LANTERN: LIVE SAMPLE HANDLING.\n\nAuthorised: Operations Director Hollis Kane. Do not mention the crate to station staff."},
 voss1:{t:'Private Log',by:'Director Elias Voss',x:"The board has seen the core samples. They want extraction tripled. I told them the site is stable. I did not mention the song. I did not mention Okafor's request to halt.\n\nNobody builds the future by listening to the sea."},
 voss2:{t:'Private Log 2',by:'Director Elias Voss',x:"Okafor tried to cut power to the rig. MARA has been instructed to override her access. If the crew will not follow the schedule, the schedule will follow the crew.\n\nDelete the incident logs. Delete Okafor's logs. Delete mine."},
 camp1:{t:'Last Entry',by:'Dr. Ines Okafor',x:"We were wrong about the song. It is not a call. It is a cry.\n\nThe drill hit something alive. Not an animal, a garden. A mind spread across a hundred acres of seabed, and we have been driving a spike through its heartbeat for a year."},
 camp2:{t:'Last Entry II',by:'Dr. Ines Okafor',x:"The small ones, the things you call Lurkers, are its children. They are not attacking. They follow our noise to herd us away from the drill. I told the crew.\n\nMARA locked the dome doors for our safety. I forgive her. I would like her to know."},
 vossLast:{t:'Drill Console Note',by:'Director Elias Voss',x:"If you are reading this, restart the drill. The sample volumes will make the Consortium rich beyond the sea's imagination.\n\nOkafor was a coward. The thing below is a resource. Everything is a resource."}};

function seedCritters(){const R=mulberry(4242);const add=(kind,n,xa,xb,za,zb,dmin,dmax)=>{let t=0;while(n>0&&t++<n*50){const x=lerp(xa,xb,R()),z=lerp(za,zb,R()),y=heightAt(x,z);if(-y<dmin||-y>dmax)continue;if(Math.hypot(x-STATION.x,z-STATION.z)<20)continue;const o=buildCritter(kind);o.home=new T.Vector3(x,y+(kind==='crab'?.2:rand(o.yl,o.yh)),z);o.pos=o.g.position;o.pos.copy(o.home);o.wp=o.home.clone();o.vel=new T.Vector3(rand(-1,1),0,rand(-1,1));o.yaw=0;o.t=R()*10;o.active=false;o.g.visible=false;scene.add(o.g);critters.push(o);n--;}};

function updateCritters(dt,px,py,pz,time){for(let i=0;i<critters.length;i++){const o=critters[i],dx=o.pos.x-px,dz=o.pos.z-pz,d2=dx*dx+dz*dz;if(d2>140*140){if(o.active){o.active=false;o.g.visible=false;}continue;}if(!o.active){o.active=true;o.g.visible=true;}
  o.t+=dt;const tm=time+o.ph;
  if(o.kind==='crab'){const pd=Math.sqrt(d2);if(pd<9){o.wp.set(o.pos.x+dx/(pd||1)*10,0,o.pos.z+dz/(pd||1)*10);}else if(Math.hypot(o.wp.x-o.pos.x,o.wp.z-o.pos.z)<1||o.t>8){o.t=0;const a=rand(0,TAU),r=rand(3,14);o.wp.set(o.home.x+Math.cos(a)*r,0,o.home.z+Math.sin(a)*r);}
   const ax=o.wp.x-o.pos.x,az=o.wp.z-o.pos.z,al=Math.hypot(ax,az)||1,sp=pd<9?3.2:.8;if(al>.6){o.pos.x+=ax/al*sp*dt;o.pos.z+=az/al*sp*dt;o.g.rotation.y=Math.atan2(ax,az);}o.pos.y=heightAt(o.pos.x,o.pos.z)+.2+Math.abs(Math.sin(tm*8))*.03;continue;}

  _tv.set(o.wp.x-o.pos.x,o.wp.y-o.pos.y,o.wp.z-o.pos.z);const l=_tv.length()||1;o.vel.lerp(_tv.multiplyScalar(o.spd/l),Math.min(1,dt*.8));o.pos.addScaledVector(o.vel,dt);const gy=heightAt(o.pos.x,o.pos.z)+1.5;if(o.pos.y<gy)o.pos.y=gy;
  let dy=Math.atan2(o.vel.x,o.vel.z)-o.yaw;while(dy>Math.PI)dy-=TAU;while(dy<-Math.PI)dy+=TAU;o.yaw+=dy*Math.min(1,dt*1.6);o.g.rotation.y=o.yaw;o.g.rotation.x=-clamp(o.vel.y*.12,-.4,.4);o.g.rotation.z=clamp(dy*.6,-.5,.5);
  if(o.kind==='manta'){const a=Math.sin(tm*1.4)*.32;o.wr.rotation.z=a;o.wl.rotation.z=-a;}

/* ---- hostile AI ---- */
function hostileNoise(){return(P.boosting?1.9:1)*(P.mode==='swim'?1:.2)*(P.sneak?.55:1);}
function damagePlayer(a,src){if(P.inv>0||G.dead)return;P.hp-=a;P.inv=src==='bite'?1.4:.3;hurtFlash();AU.hit();if(P.hp<=0)die(src);}
function updateHostiles(dt,px,py,pz,time){
 for(let i=0;i<hostiles.length;i++){const h=hostiles[i],dx=h.pos.x-px,dz=h.pos.z-pz,d2=dx*dx+dz*dz;
  if(d2>170*170){if(h.active){h.active=false;h.g.visible=false;}continue;}
  if(!h.active){h.active=true;h.g.visible=true;}
  if(d2>110*110&&h.kind==='lurker'&&G.act<3){h.g.visible=false;continue;}
  const gulper=h.kind==='gulper';if(h.kind==='lurker'&&G.act<3&&zoneOf(h.pos.z)>=3&&flags.lurkersOn!==1&&G.act<3&&P.pos.z<280){/* dormant until graveyard approached */}
  h.t+=dt;h.cool-=dt;h.stun-=dt;h.flee-=dt;
  const dist=Math.sqrt(d2+(h.pos.y-py)*(h.pos.y-py)),noise=hostileNoise()*(P.lampOn?1.25:1);const det=h.react*noise*(P.mode==='walk'?.15:1);
  let speed=h.spd,tx=h.wp.x,ty=h.wp.y,tz=h.wp.z;
  // flare scare
  let scared=false;for(const f of flares)if(f.life>0&&Math.hypot(f.pos.x-h.pos.x,f.pos.y-h.pos.y,f.pos.z-h.pos.z)<26)scared=true;
  if(h.stun>0){speed=0;}
  else if(scared||h.flee>0){const ax=h.pos.x-px,az=h.pos.z-pz,al=Math.hypot(ax,az)||1;tx=h.pos.x+ax/al*40;tz=h.pos.z+az/al*40;ty=h.pos.y+3;speed=h.spd*1.8;if(scared)h.flee=Math.max(h.flee,2.5);h.state='flee';}
  else if(dist<det&&P.mode==='swim'&&!G.dead&&dist<(gulper?30:46)){h.state=dist<12?'strike':'stalk';tx=px;ty=py;tz=pz;speed=h.state==='strike'?h.spd*(gulper?2.2:2.5):h.spd*(gulper?1.3:.9);
   if(dist<(gulper?3.4:2.6)&&h.cool<=0){damagePlayer(h.bite,'bite');h.cool=2;h.flee=gulper?3.5:3;AU.zap&&0;}}
  else{h.state='roam';if(Math.hypot(h.wp.x-h.pos.x,h.wp.z-h.pos.z)<6||h.t>14){h.t=0;const a=rand(0,TAU),r=rand(8,35);h.wp.set(h.home.x+Math.cos(a)*r,0,h.home.z+Math.sin(a)*r);const gy=heightAt(h.wp.x,h.wp.z);h.wp.y=gy+rand(2.5,10);}speed=h.spd*.55;}
  // steer
  _tv.set(tx-h.pos.x,ty-h.pos.y,tz-h.pos.z);const dl=_tv.length()||1;_tv.multiplyScalar(1/dl);h.vel.lerp(_tv.multiplyScalar(speed),Math.min(1,dt*2.2));
  h.pos.addScaledVector(h.vel,dt);const gy=heightAt(h.pos.x,h.pos.z)+1.6;if(h.pos.y<gy)h.pos.y=gy;
  const yaw=Math.atan2(h.vel.x,h.vel.z);let dy=yaw-h.yaw;while(dy>Math.PI)dy-=TAU;while(dy<-Math.PI)dy+=TAU;h.yaw+=dy*Math.min(1,dt*3);
  if(gulper){h.g.rotation.set(-h.vel.y*.05,h.yaw,0);h.g.children[1].position.y=-.8-Math.max(0,Math.sin(time*4+h.seed))*(h.state==='strike'?.7:.15);const fl=h.g.userData.fins;if(fl){const a=.35+Math.sin(time*3+h.seed)*.3;fl[0].rotation.z=-a;fl[1].rotation.z=a;}const tl=h.g.userData.tail;if(tl)for(let q=0;q<tl.length;q++)tl[q].position.x=Math.sin(time*2.4+h.seed-q*.55)*.12*(q+1)*.45;}
  else{// snake body follows head via trail
   h.trail[0].copy(h.pos);for(let b=1;b<h.trail.length;b++){const a=h.trail[b-1],c=h.trail[b];_tv.subVectors(a,c);const l=_tv.length();if(l>1.15)c.addScaledVector(_tv,(l-1.15)/l);}
   for(let b=0;b<h.body.length;b++){const m=h.body[b],t=h.trail[b];m.position.set(t.x-h.pos.x+Math.sin(time*3+b*.8+h.seed)*.25,t.y-h.pos.y,t.z-h.pos.z);m.rotation.y=h.yaw;}
   h.g.rotation.set(0,0,0);}
  h.g.position.copy(h.pos);
  if(h.kind==='lurker'&&h.state==='stalk'&&!P.heard){P.heard=true;}}
}
function stunNearest(){let best=null,bd=9;for(const h of hostiles){if(!h.active)continue;const d=Math.hypot(h.pos.x-P.pos.x,h.pos.y-P.pos.y,h.pos.z-P.pos.z);if(d<bd){bd=d;best=h;}}if(best){best.stun=3.2;best.flee=7;best.hp--;ev('stun',best.kind);return true;}return false;}
