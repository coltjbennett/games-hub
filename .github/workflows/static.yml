# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync version
        run: node scripts/sync-version.js
      # Generates /scram, /baremux, /curl and /epoxy (proxy engine files) for the Internet
      # Explorer applet. Retries npm 3x per package. If a REQUIRED package still fails, this
      # step fails loudly (red X + error annotation) instead of silently shipping a broken proxy.
      - name: Build proxy files
        run: node scripts/setup-proxy.js
      - name: Verify proxy files exist
        run: |
          for f in scram/scramjet.all.js scram/scramjet.wasm.wasm baremux/worker.js baremux/index.mjs curl/index.mjs; do
            test -s "$f" || { echo "::error::Missing generated file: $f"; exit 1; }
          done
          du -sh scram baremux curl epoxy
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
