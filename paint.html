<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MS Paint Clone</title>
  <style>
    body {
      margin: 0;
      background: #c0c0c0;
      font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .toolbar {
      padding: 6px;
      background: #c0c0c0;
      border-bottom: 2px outset #fff;
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }
    .canvas-container {
      flex: 1;
      padding: 8px;
      background: #808080;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      background: white;
      box-shadow: 2px 2px 0px #000;
      cursor: crosshair;
    }
    button {
      border: 2px outset #fff;
      background: #c0c0c0;
      cursor: pointer;
      padding: 2px 8px;
      font-family: inherit;
    }
    button:active {
      border-style: inset;
    }
    input[type="color"] {
      border: 1px inset #808080;
      padding: 0;
      width: 25px;
      height: 25px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <label>Color: <input type="color" id="paintColor" value="#000000"></label>
    <label>Size: <input type="range" id="paintSize" min="1" max="25" value="3" style="vertical-align: middle;"></label>
    <button onclick="ctx.clearRect(0,0,canvas.width,canvas.height)">Clear Canvas</button>
  </div>
  <div class="canvas-container">
    <canvas id="paintCanvas" width="800" height="600"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    
    // Make the stroke rounded
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    function startDrawing(e) {
      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    }

    function draw(e) {
      if (!isDrawing) return;
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.strokeStyle = document.getElementById('paintColor').value;
      ctx.lineWidth = document.getElementById('paintSize').value;
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);
  </script>
</body>
</html>
