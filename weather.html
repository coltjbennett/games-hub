<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Report</title>
  <style>
    @font-face {
      font-family: "W95FA";
      src: url('images/w95f.woff2') format('woff2'),
           url('images/w95f.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --win-bg: #c0c0c0;
      --win-blue: #000080;
      --win-text: #000000;
      --win-border-light: #ffffff;
      --win-border-dark: #808080;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "W95FA", "MS Sans Serif", sans-serif;
    }

    body {
      background: var(--win-bg);
      color: var(--win-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 6px;
      overflow: hidden;
    }

    /* Controls Bar */
    .toolbar {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
      align-items: center;
    }

    input[type="text"], select {
      background: #ffffff;
      border: 2px inset var(--win-border-dark);
      padding: 3px 5px;
      font-size: 12px;
      outline: none;
    }

    button {
      background: var(--win-bg);
      border: 2px outset var(--win-border-light);
      padding: 3px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    button:active {
      border-style: inset;
    }

    /* Tabs Bar */
    .tabs-header {
      display: flex;
      gap: 2px;
      border-bottom: 2px solid var(--win-border-dark);
      margin-bottom: 6px;
    }

    .tab-btn {
      padding: 3px 8px;
      background: var(--win-bg);
      border: 2px outset var(--win-border-light);
      border-bottom: none;
      font-size: 12px;
      cursor: pointer;
    }

    .tab-btn.active {
      font-weight: bold;
      border-bottom: 2px solid var(--win-bg);
      margin-bottom: -2px;
    }

    /* Main Container */
    .content-panel {
      flex: 1;
      background: #ffffff;
      border: 2px inset var(--win-border-dark);
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Hero Weather Card */
    .weather-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #000080, #1040a0);
      color: #ffffff;
      padding: 12px 16px;
      border: 2px outset var(--win-border-light);
      margin-bottom: 10px;
    }

    .hero-temp {
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .hero-condition {
      font-size: 16px;
      color: #ffff80;
    }

    .hero-icon {
      font-size: 42px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }

    .stat-card {
      background: var(--win-bg);
      border: 2px outset var(--win-border-light);
      padding: 6px 8px;
    }

    .stat-label {
      font-size: 10px;
      color: #555555;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 14px;
      font-weight: bold;
      color: var(--win-blue);
    }

    /* Hourly & Daily Forecast Cards */
    .forecast-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .forecast-card {
      min-width: 75px;
      background: var(--win-bg);
      border: 2px outset var(--win-border-light);
      text-align: center;
      padding: 6px 4px;
      font-size: 11px;
    }

    .forecast-card .icon {
      font-size: 20px;
      margin: 4px 0;
    }

    /* Radar View Simulation */
    .radar-box {
      width: 100%;
      height: 180px;
      background: #001122;
      border: 2px inset var(--win-border-dark);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radar-sweep {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(0,255,0,0.4), transparent 60deg);
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .radar-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle, rgba(0,255,0,0.2) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Alert Banner */
    .alert-banner {
      background: #ffffcc;
      border: 2px solid #cccc00;
      color: #8b0000;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-footer {
      font-size: 10px;
      color: #666;
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <input type="text" id="cityInput" placeholder="Enter location..." style="flex: 1;" />
    <button id="searchBtn">Search</button>
    <select id="presetSelect">
      <option value="">-- Presets --</option>
      <option value="New York, NY">New York, NY</option>
      <option value="Los Angeles, CA">Los Angeles, CA</option>
      <option value="Chicago, IL">Chicago, IL</option>
      <option value="London, UK">London, UK</option>
      <option value="Tokyo, JP">Tokyo, JP</option>
      <option value="Sydney, AU">Sydney, AU</option>
    </select>
    <button id="unitBtn">°F / °C</button>
  </div>

  <div class="tabs-header">
    <div class="tab-btn active" data-tab="current">Current</div>
    <div class="tab-btn" data-tab="hourly">Hourly</div>
    <div class="tab-btn" data-tab="daily">5-Day</div>
    <div class="tab-btn" data-tab="radar">Radar</div>
  </div>

  <div class="content-panel" id="mainContent">
    <div style="text-align:center; margin-top:20px; font-weight:bold;">Initializing weather systems...</div>
  </div>

  <script>
    let currentCity = 'Local';
    let unit = 'F'; // 'F' or 'C'
    let activeTab = 'current';
    let weatherData = null;

    const weatherIcons = {
      0: '☀️', // Clear sky
      1: '🌤️', 2: '⛅', 3: '☁️', // Overcast
      45: '🌫️', 48: '🌫️', // Fog
      51: '🌧️', 61: '🌧️', 63: '🌧️', // Rain
      71: '❄️', 73: '❄️', 75: '❄️', // Snow
      95: '🌩️', 96: '🌩️' // Thunderstorm
    };

    const weatherDescriptions = {
      0: 'Clear Skies',
      1: 'Mainly Clear', 2: 'Partly Cloudy', 3: 'Overcast',
      45: 'Foggy', 48: 'Freezing Fog',
      51: 'Light Drizzle', 61: 'Light Rain', 63: 'Moderate Rain',
      71: 'Light Snow', 73: 'Moderate Snow',
      95: 'Thunderstorm'
    };

    function cToF(c) { return Math.round((c * 9/5) + 32); }
    function formatTemp(c) { return unit === 'F' ? `${cToF(c)}°F` : `${Math.round(c)}°C`; }

    // Fetch Weather Data via Open-Meteo API with Dynamic Fallback
    async function loadWeather(city) {
      currentCity = city;
      document.getElementById('cityInput').value = city; // Keep search bar in sync
      document.getElementById('mainContent').innerHTML = '<div style="text-align:center; margin-top:20px; font-weight:bold;">Fetching weather report...</div>';

      try {
        // Geocoding query
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
        const geoData = await geoRes.json();

        let lat, lon;
        if (geoData.results && geoData.results.length > 0) {
          lat = geoData.results[0].latitude;
          lon = geoData.results[0].longitude;
          currentCity = `${geoData.results[0].name}${geoData.results[0].admin1 ? ', ' + geoData.results[0].admin1 : ''}`;
          document.getElementById('cityInput').value = currentCity; 
        } else {
          throw new Error("Location not found");
        }

        // Weather query
        const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,relativehumidity_2m,weathercode,windspeed_10m&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`);
        weatherData = await wRes.json();
      } catch (err) {
        console.warn("Weather fetch failed, falling back to simulated data.", err);
        weatherData = generateFallbackData();
      }

      renderTab();
    }

    function generateFallbackData() {
      return {
        current_weather: {
          temperature: 21,
          windspeed: 12,
          weathercode: 1,
          time: new Date().toISOString()
        },
        hourly: {
          time: Array.from({length: 24}, (_, i) => `${i}:00`),
          temperature_2m: Array.from({length: 24}, () => 18 + Math.random() * 8),
          weathercode: Array.from({length: 24}, () => Math.floor(Math.random() * 3))
        },
        daily: {
          time: ['Today', 'Tomorrow', 'Day 3', 'Day 4', 'Day 5'],
          temperature_2m_max: [22, 24, 20, 19, 23],
          temperature_2m_min: [14, 15, 12, 11, 14],
          weathercode: [0, 1, 2, 61, 0]
        }
      };
    }

    function renderTab() {
      if (!weatherData) return;
      const content = document.getElementById('mainContent');
      const cw = weatherData.current_weather || {};
      const code = cw.weathercode || 0;
      const icon = weatherIcons[code] || '🌡️';
      const desc = weatherDescriptions[code] || 'Fair Conditions';

      if (activeTab === 'current') {
        content.innerHTML = `
          <div class="alert-banner">
            ⚠️ <span>ADVISORY: Routine weather conditions reported for ${currentCity}. No severe weather watches active.</span>
          </div>

          <div class="weather-hero">
            <div>
              <div style="font-size: 12px; text-transform: uppercase;">${currentCity}</div>
              <div class="hero-temp">${formatTemp(cw.temperature || 20)}</div>
              <div class="hero-condition">${desc}</div>
            </div>
            <div class="hero-icon">${icon}</div>
          </div>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Wind Speed</div>
              <div class="stat-value">${cw.windspeed || 10} mph</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Humidity</div>
              <div class="stat-value">54%</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Barometer</div>
              <div class="stat-value">30.12 inHg</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Visibility</div>
              <div class="stat-value">10.0 mi</div>
            </div>
          </div>

          <div class="status-footer">Updated: ${new Date().toLocaleTimeString()} · Weather Station: WIN95-WX-LOCAL</div>
        `;
      } else if (activeTab === 'hourly') {
        const hourly = weatherData.hourly || { time: [], temperature_2m: [], weathercode: [] };
        const cards = hourly.time.slice(0, 12).map((t, idx) => `
          <div class="forecast-card">
            <div>${String(t).includes('T') ? t.split('T')[1].substring(0, 5) : t}</div>
            <div class="icon">${weatherIcons[hourly.weathercode[idx]] || '🌤️'}</div>
            <div style="font-weight:bold;">${formatTemp(hourly.temperature_2m[idx] || 20)}</div>
          </div>
        `).join('');

        content.innerHTML = `
          <h4 style="margin-bottom: 8px; color: var(--win-blue);">12-Hour Forecast — ${currentCity}</h4>
          <div class="forecast-row">${cards}</div>
        `;
      } else if (activeTab === 'daily') {
        const daily = weatherData.daily || { time: [], temperature_2m_max: [], temperature_2m_min: [], weathercode: [] };
        const cards = daily.time.map((d, idx) => `
          <div class="forecast-card" style="flex:1;">
            <div style="font-weight:bold;">${d}</div>
            <div class="icon">${weatherIcons[daily.weathercode[idx]] || '☀️'}</div>
            <div style="color: red; font-weight:bold;">H: ${formatTemp(daily.temperature_2m_max[idx] || 22)}</div>
            <div style="color: blue;">L: ${formatTemp(daily.temperature_2m_min[idx] || 12)}</div>
          </div>
        `).join('');

        content.innerHTML = `
          <h4 style="margin-bottom: 8px; color: var(--win-blue);">5-Day Extended Forecast — ${currentCity}</h4>
          <div class="forecast-row">${cards}</div>
        `;
      } else if (activeTab === 'radar') {
        content.innerHTML = `
          <h4 style="margin-bottom: 6px; color: var(--win-blue);">Live Doppler Radar — ${currentCity}</h4>
          <div class="radar-box">
            <div class="radar-grid"></div>
            <div class="radar-sweep"></div>
            <div style="position: absolute; color: #00ff00; font-family: monospace; font-size: 11px; top: 6px; left: 6px;">RADAR: ACTIVE (100nm)</div>
          </div>
        `;
      }
    }

    // IP Geolocation Initializer
    async function initLocalWeather() {
      document.getElementById('mainContent').innerHTML = '<div style="text-align:center; margin-top:20px; font-weight:bold;">Locating you...</div>';
      try {
        const ipRes = await fetch('https://get.geojs.io/v1/ip/geo.json');
        const ipData = await ipRes.json();
        
        const city = ipData.city || '';
        const region = ipData.region || '';
        const detectedLoc = region ? `${city}, ${region}` : city;
        
        if (detectedLoc) {
          loadWeather(detectedLoc);
        } else {
          throw new Error("Could not parse city/region from IP");
        }
      } catch (err) {
        console.error("IP Geolocation failed, using fallback.", err);
        loadWeather('New York, NY'); // Safe fallback if adblockers block IP APIs
      }
    }

    // Event Listeners
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        renderTab();
      });
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
      const val = document.getElementById('cityInput').value.trim();
      if (val) loadWeather(val);
    });

    document.getElementById('cityInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = document.getElementById('cityInput').value.trim();
        if (val) loadWeather(val);
      }
    });

    document.getElementById('presetSelect').addEventListener('change', (e) => {
      if (e.target.value) {
        loadWeather(e.target.value);
      }
    });

    document.getElementById('unitBtn').addEventListener('click', () => {
      unit = unit === 'F' ? 'C' : 'F';
      renderTab();
    });

    // Boot up sequence
    initLocalWeather();
  </script>
</body>
</html>
