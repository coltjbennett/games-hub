<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Monitor</title>
  <style>
    @font-face{font-family:W95FA;src:url('images/w95f.woff2') format('woff2'),url('images/w95f.woff') format('woff')}
    *{box-sizing:border-box}body{margin:0;background:#c0c0c0;color:#000;font-family:W95FA,"MS Sans Serif",Tahoma,Arial,sans-serif;padding:8px}.bar{background:#000080;color:#fff;padding:5px 8px;font-weight:bold}.panel{border:2px outset #fff;padding:8px;margin-bottom:9px;background:#c0c0c0}.meter{height:18px;background:#fff;border:2px inset #808080;overflow:hidden}.meter>span{display:block;height:100%;width:0;background:#000080}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px}.stat{background:#fff;border:2px inset #808080;padding:7px}.label{display:block;color:#555;font:10px Arial,sans-serif;text-transform:uppercase}.value{font-size:15px;font-weight:bold}.tiny{font:11px Arial,sans-serif;color:#444;line-height:1.4}.good{color:#006600}.warn{color:#8b6500}.bad{color:#990000}
  </style>
</head>
<body>
  <div class="panel"><div class="bar">SYSTEM MONITOR</div><div class="tiny" style="margin-top:8px">Live browser diagnostics for the Games Hub. Values are estimates exposed by your browser, not operating-system telemetry.</div></div>
  <div class="panel"><div class="grid" id="stats"></div></div>
  <div class="panel"><div class="label">Animation / render FPS</div><div class="meter"><span id="fps-bar"></span></div><div id="fps-text" class="value" style="margin-top:5px">-- FPS</div></div>
  <div class="panel"><div class="label">Storage estimate</div><div class="meter"><span id="storage-bar"></span></div><div id="storage-text" class="value" style="margin-top:5px">Calculating…</div></div>
  <div class="panel"><div class="tiny" id="notes"></div></div>
  <script>
    const $=id=>document.getElementById(id); const fmtBytes=n=>{if(!Number.isFinite(n))return 'n/a';const u=['B','KB','MB','GB'];let i=0,v=n;while(v>=1024&&i<u.length-1){v/=1024;i++}return `${v.toFixed(i?1:0)} ${u[i]}`};
    const stat=(label,value,cls='')=>{const d=document.createElement('div');d.className='stat';d.innerHTML=`<span class="label">${label}</span><span class="value ${cls}">${value}</span>`;return d};
    async function refresh(){
      const stats=$('stats');stats.replaceChildren();
      stats.append(stat('Browser online',navigator.onLine?'YES':'NO',navigator.onLine?'good':'bad'));
      stats.append(stat('Viewport',`${innerWidth} × ${innerHeight}`));
      stats.append(stat('Device pixel ratio',window.devicePixelRatio||1));
      stats.append(stat('CPU threads',navigator.hardwareConcurrency||'n/a'));
      stats.append(stat('Device memory',navigator.deviceMemory?`${navigator.deviceMemory} GB`:'n/a'));
      stats.append(stat('Network',navigator.connection?.effectiveType||'n/a'));
      stats.append(stat('Downlink',navigator.connection?.downlink?`${navigator.connection.downlink} Mb/s`:'n/a'));
      stats.append(stat('Reduced motion',matchMedia('(prefers-reduced-motion: reduce)').matches?'YES':'NO'));
      if(performance.memory){stats.append(stat('JS heap',`${fmtBytes(performance.memory.usedJSHeapSize)} / ${fmtBytes(performance.memory.jsHeapSizeLimit)}`));}
      try{const e=await navigator.storage?.estimate();if(e&&e.quota){const ratio=(e.usage||0)/e.quota*100;$('storage-bar').style.width=Math.min(100,ratio)+'%';$('storage-text').textContent=`${fmtBytes(e.usage||0)} used of ${fmtBytes(e.quota)} (${ratio.toFixed(1)}%)`;}}catch(_){$('storage-text').textContent='Storage estimate unavailable.'}
      const notes=[]; if(document.visibilityState==='hidden')notes.push('The monitor throttles while hidden.'); if(navigator.connection?.saveData)notes.push('Data Saver is enabled.'); if(!navigator.onLine)notes.push('Offline mode is active; local apps remain available.');
      $('notes').textContent=notes.length?notes.join(' '):'System looks normal from the browser APIs available on this device.';
    }
    let frames=0,last=performance.now();function frame(now){frames++;if(now-last>=1000){const fps=frames*1000/(now-last);const rounded=Math.round(fps);$('fps-text').textContent=`${rounded} FPS`;$('fps-bar').style.width=Math.min(100,rounded/1.2)+'%';frames=0;last=now}requestAnimationFrame(frame)}requestAnimationFrame(frame);
    refresh();setInterval(refresh,2000);window.addEventListener('online',refresh);window.addEventListener('offline',refresh);window.addEventListener('resize',refresh);
  </script>
</body>
</html>
