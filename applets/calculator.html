<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <style>
    @font-face {
      font-family: "W95FA";
      src: url('images/w95f.woff2') format('woff2'),
           url('images/w95f.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --win-bg: #c0c0c0;
      --win-blue: #000080;
      --win-text: #000000;
      --win-border-light: #ffffff;
      --win-border-dark: #808080;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "W95FA", "MS Sans Serif", sans-serif;
      user-select: none;
    }

    body {
      background: var(--win-bg);
      color: var(--win-text);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      height: 100vh;
      overflow: hidden;
    }

    #display {
      width: 100%;
      height: 44px;
      background: #ffffff;
      border: 2px inset var(--win-border-dark);
      font-size: 1.5rem;
      text-align: right;
      padding: 5px 8px;
      color: #000000;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(7, 1fr);
      gap: 4px;
      flex: 1;
    }

    button {
      background: var(--win-bg);
      border: 2px outset var(--win-border-light);
      color: var(--win-text);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      border-style: inset;
      padding: 2px 0 0 2px;
    }
    
    button.clear { color: #ff0000; font-weight: bold; }
    button.op { color: var(--win-blue); font-weight: bold; }
    button.func { color: #006600; font-size: 0.9rem; }
  </style>
</head>
<body>
  <input type="text" id="display" readonly value="0">
  <div class="grid">
    <!-- Row 1 -->
    <button class="func" onclick="appendValue('sin(')">sin</button>
    <button class="func" onclick="appendValue('cos(')">cos</button>
    <button class="func" onclick="appendValue('tan(')">tan</button>
    <button class="func" onclick="appendValue('log(')">log</button>
    <button class="func" onclick="appendValue('ln(')">ln</button>
    
    <!-- Row 2 -->
    <button class="func" onclick="appendValue('π')">π</button>
    <button class="func" onclick="appendValue('e')">e</button>
    <button class="func" onclick="appendValue('sqrt(')">√</button>
    <button class="func" onclick="appendValue('^')">x^y</button>
    <button class="func" onclick="appendValue('!')">n!</button>
    
    <!-- Row 3 -->
    <button class="func" onclick="appendValue('(')">(</button>
    <button class="func" onclick="appendValue(')')">)</button>
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="clear" onclick="backspace()">⌫</button>
    <button class="op" onclick="appendValue('/')">÷</button>
    
    <!-- Row 4 -->
    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button class="op" onclick="appendValue('*')">×</button>
    <button class="func" onclick="appendValue('²')">x²</button>
    
    <!-- Row 5 -->
    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button class="op" onclick="appendValue('-')">-</button>
    <button class="func" onclick="appendValue('³')">x³</button>
    
    <!-- Row 6 -->
    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button class="op" onclick="appendValue('+')">+</button>
    <button class="op" onclick="calculate()" style="grid-row: span 2;">=</button>
    
    <!-- Row 7 -->
    <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
    <button onclick="appendValue('.')">.</button>
    <button class="func" onclick="appendValue('%')">%</button>
  </div>

  <script>
    const display = document.getElementById('display');
    let resetOnNext = false;

    function appendValue(val) {
      if (display.value === 'Error') display.value = '0';
      if (resetOnNext && !isNaN(val)) {
        display.value = val;
        resetOnNext = false;
      } else {
        if (display.value === '0' && val !== '.') {
          display.value = val;
        } else {
          display.value += val;
        }
        resetOnNext = false;
      }
    }

    function clearDisplay() { 
      display.value = '0'; 
      resetOnNext = false;
    }

    function backspace() {
      if (display.value === 'Error') {
        display.value = '0';
        return;
      }
      display.value = display.value.slice(0, -1);
      if (display.value === '') display.value = '0';
    }

    function calculate() {
      try {
        let expr = display.value;
        
        // Translate visual symbols into math operators
        expr = expr.replace(/×/g, '*').replace(/÷/g, '/');
        expr = expr.replace(/π/g, 'Math.PI').replace(/e/g, 'Math.E');
        expr = expr.replace(/sin\(/g, 'Math.sin(');
        expr = expr.replace(/cos\(/g, 'Math.cos(');
        expr = expr.replace(/tan\(/g, 'Math.tan(');
        expr = expr.replace(/log\(/g, 'Math.log10(');
        expr = expr.replace(/ln\(/g, 'Math.log(');
        expr = expr.replace(/sqrt\(/g, 'Math.sqrt(');
        expr = expr.replace(/\^/g, '**');
        expr = expr.replace(/([0-9.]+)?²/g, '($1**2)');
        expr = expr.replace(/([0-9.]+)?³/g, '($1**3)');
        expr = expr.replace(/([0-9.]+)?%/g, '($1/100)');
        
        // Custom simple parser for factorials (supports integers)
        while (expr.includes('!')) {
          expr = expr.replace(/(\d+)!/, (match, num) => {
            let n = parseInt(num);
            let fact = 1;
            for(let i = 1; i <= n; i++) fact *= i;
            return fact;
          });
        }

        // Evaluate and correct floating point math bugs (e.g. 0.1 + 0.2 = 0.30000000000000004)
        let result = Function('"use strict"; return (' + expr + ')')();
        if (typeof result !== 'number' || isNaN(result)) throw new Error("Invalid");
        
        display.value = Math.round(result * 1e12) / 1e12;
        resetOnNext = true;
      } catch (e) {
        display.value = 'Error';
        resetOnNext = true;
      }
    }
  </script>
</body>
</html>
