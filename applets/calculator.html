<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body {
      margin: 0;
      padding: 12px;
      font-family: inherit;
      background: transparent;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-sizing: border-box;
      height: 100vh;
      user-select: none;
    }
    #display {
      width: 100%;
      height: 48px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      font-size: 1.5rem;
      text-align: right;
      padding: 5px 12px;
      box-sizing: border-box;
      color: #fff;
      outline: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      flex: 1;
    }
    button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: rgba(255, 255, 255, 0.25); }
    button:active { transform: scale(0.96); }
    button.op { background: rgba(0, 162, 255, 0.3); }
    button.op:hover { background: rgba(0, 162, 255, 0.5); }
    button.clear { background: rgba(255, 75, 75, 0.3); }
    button.clear:hover { background: rgba(255, 75, 75, 0.5); }
  </style>
</head>
<body>
  <input type="text" id="display" readonly value="0">
  <div class="grid">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="appendValue('(')">(</button>
    <button onclick="appendValue(')')">)</button>
    <button class="op" onclick="appendValue('/')">÷</button>
    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button class="op" onclick="appendValue('*')">×</button>
    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button class="op" onclick="appendValue('-')">-</button>
    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button class="op" onclick="appendValue('+')">+</button>
    <button onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <button onclick="backspace()">⌫</button>
    <button class="op" onclick="calculate()">=</button>
  </div>
  <script>
    const display = document.getElementById('display');
    function appendValue(val) {
      if (display.value === '0' && val !== '.') display.value = val;
      else display.value += val;
    }
    function clearDisplay() { display.value = '0'; }
    function backspace() {
      display.value = display.value.slice(0, -1);
      if (display.value === '') display.value = '0';
    }
    function calculate() {
      try {
        display.value = Function('"use strict"; return (' + display.value + ')')();
      } catch (e) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
