<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disk Defragmenter</title>
<link rel="stylesheet" href="w95.css">
<style>
  #w{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
  #map{flex:1;min-height:80px;display:grid;gap:1px;background:#000080;border:2px inset #808080;padding:2px;align-content:start;overflow:hidden}
  #map i{background:#fff;display:block;aspect-ratio:1;min-width:0}
  #map i.f{background:#0000ff}#map i.r{background:#00ffff}#map i.w{background:#ff0000}#map i.d{background:#008000}
  #bar{height:20px;border:2px inset #808080;background:#fff;padding:1px}#fill{height:100%;width:0;background:#000080}
  .leg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}.leg b{display:inline-block;width:10px;height:10px;border:1px solid #000;margin-right:3px}
</style></head><body>
<div id="w">
  <div>Drive C: <span id="frag"></span></div><div id="map" aria-label="Disk map"></div>
  <div id="bar"><div id="fill"></div></div><div id="txt">Click Start to defragment drive C. (It will not touch your files - this is a very convincing simulation.)</div>
  <div class="leg"><span><b style="background:#0000ff"></b>Fragmented</span><span><b style="background:#00ffff"></b>Reading</span><span><b style="background:#ff0000"></b>Writing</span><span><b style="background:#008000"></b>Optimised</span><span><b></b>Free</span></div>
  <div style="display:flex;gap:6px"><button id="go">Start</button><button id="stop" disabled>Stop</button></div>
</div>
<script>
(function(){
  var COLS=40,N=0,map=document.getElementById('map'),cells=[],st=[],timer=0,run=false;
  function build(){N=COLS*Math.max(6,Math.min(14,Math.floor(map.clientHeight/12)));map.style.gridTemplateColumns='repeat('+COLS+',1fr)';map.textContent='';cells=[];st=[];
    for(var i=0;i<N;i++){var e=document.createElement('i'),v=Math.random()<0.62?1:0;e.className=v?'f':'';map.append(e);cells.push(e);st.push(v);}paintFrag();}
  function frag(){var f=0,used=0;for(var i=0;i<N;i++){if(st[i]===1){used++;if(i>0&&st[i-1]===0)f++;}}return f;}
  function paintFrag(){document.getElementById('frag').textContent=(run?'defragmenting...':'idle')+'  ('+frag()+' fragments)';}
  function hdd(){try{parent.GHShell.fx&&parent.GHShell.fx.hdd&&parent.GHShell.fx.hdd();}catch(e){}}
  document.getElementById('go').onclick=function(){
    if(run)return;run=true;this.disabled=true;document.getElementById('stop').disabled=false;build();hdd();
    var done=0,total=0;for(var i=0;i<N;i++)if(st[i]===1)total++;var write=0;
    (function step(){
      if(!run)return;
      /* find the first free cell before the last used cell, move the last used cell into it */
      var free=st.indexOf(0),last=st.lastIndexOf(1);
      if(free<0||free>last){finish();return;}
      cells[last].className='r';cells[free].className='w';
      timer=setTimeout(function(){st[last]=0;st[free]=1;cells[last].className='';cells[free].className='d';done++;write++;
        var pct=Math.min(100,Math.round(done/Math.max(1,total*0.45)*100));document.getElementById('fill').style.width=pct+'%';document.getElementById('txt').textContent='Moving clusters... '+pct+'%';paintFrag();timer=setTimeout(step,8);},18);
    })();
  };
  function finish(){run=false;for(var i=0;i<N;i++)if(st[i])cells[i].className='d';document.getElementById('fill').style.width='100%';document.getElementById('txt').textContent='Defragmentation complete. Drive C is 0% fragmented.';document.getElementById('go').disabled=false;document.getElementById('stop').disabled=true;paintFrag();try{parent.GHShell.emit('defrag:complete');}catch(e){}}
  document.getElementById('stop').onclick=function(){run=false;clearTimeout(timer);document.getElementById('go').disabled=false;this.disabled=true;document.getElementById('txt').textContent='Stopped.';paintFrag();};
  build();window.addEventListener('resize',function(){if(!run)build();});
})();
</script></body></html>
