<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Proxy Applet</title>
  
  <script type="module" src="https://unpkg.com/x-frame-bypass"></script>
  
  <style>
    :root {
      --win-bg: #c0c0c0;
      --win-blue: #000080;
      --win-text-dark: #000000;
      --win-text-light: #ffffff;
      --win-border-light: #ffffff;
      --win-border-dark: #808080;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0;
      font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      background-color: var(--win-bg);
      overflow: hidden;
      /* Optional fallback cursor */
      cursor: default;
    }

    .panel {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--win-bg);
      border: 3px outset var(--win-border-light);
      color: var(--win-text-dark);
    }

    .panel-title-bar {
      background: var(--win-blue);
      color: var(--win-text-light);
      font-size: 1rem;
      font-weight: bold;
      padding: 4px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--win-border-light);
      letter-spacing: 0.05em;
      user-select: none;
    }

    .panel-title-bar .win-btns {
      display: inline-flex;
      gap: 3px;
    }

    button.win-btn {
      display: inline-block;
      appearance: none;
      -webkit-appearance: none;
      padding: 0;
      width: 16px;
      height: 14px;
      background: var(--win-bg);
      border: 2px outset var(--win-border-light);
      font-size: 0.6rem;
      font-weight: bold;
      color: var(--win-text-dark);
      text-align: center;
      line-height: 10px;
      text-decoration: none;
      cursor: pointer;
    }

    button.win-btn:active {
      border-style: inset;
    }

    .panel-body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      height: calc(100% - 28px);
    }

    .address-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .address-label {
      font-size: 13px;
    }

    .search-input {
      flex-grow: 1;
      background: var(--win-text-light);
      border: 2px inset var(--win-border-dark);
      padding: 4px 6px;
      font-size: 13px;
      color: var(--win-text-dark);
      outline: none;
    }
    
    .search-input:focus {
      outline: 1px dotted #000;
      outline-offset: -3px;
    }

    .win95-btn {
      display: inline-block;
      background-color: #c0c0c0;
      color: #000000;
      font-size: 13px;
      font-weight: bold;
      padding: 3px 12px;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: inset 1px 1px 0px #dfdfdf, inset -1px -1px 0px #808080;
      cursor: pointer;
      text-align: center;
      user-select: none;
    }

    .win95-btn:active {
      border-top: 2px solid #000000;
      border-left: 2px solid #000000;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      box-shadow: inset 1px 1px 0px #808080, inset -1px -1px 0px #dfdfdf;
      padding: 4px 11px 2px 13px; /* shift text for click effect */
    }

    #proxy-frame {
      width: 100%;
      flex-grow: 1;
      border: 2px inset var(--win-border-dark);
      background-color: var(--win-text-light);
    }
  </style>
</head>
<body>

  <div class="panel">
    <div class="panel-title-bar">
      <span>Web Proxy Applet</span>
      <span class="win-btns">
        <button type="button" class="win-btn" aria-label="Minimize">-</button>
        <button type="button" class="win-btn" aria-label="Maximize">□</button>
        <button type="button" class="win-btn" aria-label="Close">✕</button>
      </span>
    </div>
    
    <div class="panel-body">
      <div class="address-bar">
        <span class="address-label">Address:</span>
        <input type="text" id="url-input" class="search-input" placeholder="Enter URL (e.g., example.com)" value="https://example.com" />
        <button type="button" id="go-btn" class="win95-btn">GO</button>
      </div>
      
      <!-- The x-frame-bypass component intercepts this iframe's loading -->
      <iframe id="proxy-frame" is="x-frame-bypass" src="https://example.com"></iframe>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlInput = document.getElementById('url-input');
      const goBtn = document.getElementById('go-btn');
      const proxyFrame = document.getElementById('proxy-frame');

      // Function to process the URL and update the iframe
      const navigate = () => {
        let targetUrl = urlInput.value.trim();
        
        if (!targetUrl) return;

        // Automatically prepend https:// if missing a protocol
        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
          targetUrl = 'https://' + targetUrl;
          urlInput.value = targetUrl; // Update input field to show formatted URL
        }

        // Update iframe source
        proxyFrame.src = targetUrl;
      };

      // Handle 'GO' button click
      goBtn.addEventListener('click', navigate);

      // Handle 'Enter' key press in the input field
      urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          navigate();
        }
      });
      
      // Basic interactivity for the window controls (visual only for the iframe applet)
      const winBtns = document.querySelectorAll('.win-btn');
      winBtns.forEach(btn => {
        btn.addEventListener('click', function() {
           // Simulate click but do nothing functional, 
           // as this applet is designed to live inside your site's larger UI.
           console.log(this.getAttribute('aria-label') + ' button clicked in applet.');
        });
      });
    });
  </script>
</body>
</html>
