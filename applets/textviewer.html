<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>Text Viewer</title>
<style>
  @font-face{font-family:W95FA;src:url('../images/w95f.woff2') format('woff2'),url('../images/w95f.woff') format('woff')}
  :root{color-scheme:light only}
  html,body{margin:0;height:100%;background:#fff !important;color:#000 !important;filter:none !important}
  html::after,body::before{display:none !important}
  pre{margin:0;padding:8px 10px;white-space:pre-wrap;word-wrap:break-word;font:14px/1.3 W95FA,"MS Sans Serif",monospace;color:#000 !important;background:#fff !important;user-select:text;-webkit-user-select:text}
</style>
</head>
<body><pre id="t">Loading…</pre>
<script>
(function(){
  var qs=new URLSearchParams(location.search), t=document.getElementById('t');
  /* a save slot from the File Manager: C:\Games\<Game>\saves\<slot>.sav (read-only view of the slot's stored data) */
  if(qs.has('slot')){
    var url=qs.get('slot')||'', n=qs.get('n')||'1', all={};
    try{all=JSON.parse(localStorage.getItem('gh-slots-v1')||'{}')||{};}catch(e){}
    var s=(all[url]||{})[n], title=url, P=null;
    try{P=parent.GHShell;var g=P.catalog().games.filter(function(x){return x.url===url;})[0];if(g)title=g.title;}catch(e){}
    if(!s){t.textContent='This save slot no longer exists.\n\nIt may have been deleted or renamed in the File Manager.';return;}
    var line=new Array(61).join('-'), keys=Object.keys(s.data||{}), out=['ColtonOS save slot (read-only view)',line,
      'Game:   '+title,'Slot:    '+n+'  "'+s.name+'"','Saved:   '+new Date(s.ts).toLocaleString(),'Size:    '+(s.size||0)+' bytes in '+keys.length+' key'+(keys.length===1?'':'s'),
      'Source: '+url,line,'This is the data the game stored in this browser. Editing it here does not change the real slot.','Use Load in the game window to restore it.',''];
    keys.forEach(function(k){
      var v=s.data[k], txt=v;
      try{var j=JSON.parse(v);if(j&&typeof j==='object')txt=JSON.stringify(j,null,2);}catch(e){}
      txt=String(txt); if(txt.length>6000)txt=txt.slice(0,6000)+'\n... ('+(txt.length-6000)+' more characters)';
      out.push('['+k+']',txt,'');
    });
    if(!keys.length)out.push('(this slot is empty)');
    t.textContent=out.join('\n'); document.title=title+' - '+s.name+'.sav'; return;
  }
  var q=qs.get('src')||'';
  if(!/^[A-Za-z0-9_\-][A-Za-z0-9_\-.\/]*\.txt$/.test(q)||q.indexOf('..')>-1){t.textContent='Cannot open this file.';return;}
  fetch('../'+q).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
   .then(function(s){t.textContent=s;})
   .catch(function(){t.textContent='This file could not be found.';});
})();
</script>
</body></html>
