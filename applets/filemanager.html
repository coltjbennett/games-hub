<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"><title>File Manager</title>
<link rel="stylesheet" href="w95.css">
<style>
  :root{--navy:#000080;--face:#c0c0c0}
  body{user-select:none;-webkit-user-select:none;overflow:hidden}
  button{font:inherit}
  #menubar{display:flex;flex:none;padding:1px 2px;border-bottom:1px solid #808080;box-shadow:0 1px #fff;position:relative;z-index:30}
  #menubar>button{background:none;border:1px solid transparent;padding:2px 8px;min-height:0;cursor:default;color:#000}
  #menubar>button.open,#menubar>button:hover{border-color:#fff #808080 #808080 #fff}
  #menubar>button.open{border-color:#808080 #fff #fff #808080}
  .menu{position:fixed;z-index:60;min-width:190px;background:var(--face);border:2px outset #fff;padding:2px;box-shadow:2px 2px 0 rgba(0,0,0,.35);font-size:13px}
  .menu .mi{display:flex;align-items:center;gap:6px;padding:2px 22px 2px 20px;white-space:nowrap;cursor:default;position:relative;color:#000}
  .menu .mi:hover:not(.dis){background:var(--navy);color:#fff}
  .menu .mi.dis{color:#808080;text-shadow:1px 1px #fff}
  .menu .mi.dis:hover{background:none}
  .menu .mi .ck{position:absolute;left:5px;font-size:12px}
  .menu .mi .ac{margin-left:auto;padding-left:24px;opacity:.75}
  .menu .mi .ar{position:absolute;right:6px;font-size:9px}
  .menu .sp{height:2px;margin:3px 1px;border-top:1px solid #808080;border-bottom:1px solid #fff}
  .menu .mi img{width:16px;height:16px;position:absolute;left:2px;object-fit:contain}
  #toolbar{display:flex;gap:1px;padding:3px 4px;flex:none;border-bottom:1px solid #808080;box-shadow:0 1px #fff;overflow:hidden;align-items:stretch}
  #toolbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:46px;min-height:38px;padding:2px 4px;border:1px solid transparent;background:none;font-size:11px;line-height:1.1;cursor:default;color:#000}
  #toolbar button:hover:not(:disabled){border-color:#fff #808080 #808080 #fff}
  #toolbar button:active:not(:disabled){border-color:#808080 #fff #fff #808080}
  #toolbar button:disabled i,#toolbar button:disabled span{color:#808080;text-shadow:1px 1px #fff;filter:grayscale(1) opacity(.5)}
  #toolbar i{font-style:normal;font-size:19px;line-height:1.05;display:block;height:21px}
  #toolbar .vs{width:2px;margin:2px 3px;border-left:1px solid #808080;border-right:1px solid #fff}
  #addr{display:flex;align-items:center;gap:6px;padding:3px 6px;flex:none;border-bottom:1px solid #808080;box-shadow:0 1px #fff}
  #addr label{white-space:nowrap}
  #path{flex:1;min-width:60px;height:22px;padding:1px 4px 1px 24px;background:#fff url(../images/icons/folder.svg) 4px 3px/16px 16px no-repeat}
  #q{width:140px;height:22px}
  #main{flex:1;display:flex;min-height:0;position:relative}
  #tree{width:210px;flex:none;overflow:auto;background:#fff;border:2px inset #808080;margin:3px 0 3px 3px;padding:0 0 6px;font-size:13px}
  #tree .th{background:var(--face);padding:2px 6px;border-bottom:1px solid #808080;position:sticky;top:0;z-index:2;display:flex;margin-bottom:2px}
  #tree .th b{font-weight:normal;flex:1}
  .tr{display:flex;align-items:center;height:20px;white-space:nowrap;cursor:default;padding-right:6px}
  .tr .pm{width:11px;height:11px;border:1px solid #808080;background:#fff;margin:0 4px 0 2px;font:9px/9px monospace;text-align:center;flex:none;color:#000;cursor:default}
  .tr .pm.none{visibility:hidden}
  .tr img{width:16px;height:16px;margin-right:4px;object-fit:contain;flex:none}
  .tr span.l{padding:1px 3px;border:1px dotted transparent;overflow:hidden;text-overflow:ellipsis}
  .tr.cur span.l{background:var(--navy);color:#fff}
  .tr.dropt span.l{background:#808000;color:#fff}
  #split{width:5px;cursor:col-resize;flex:none}
  #right{flex:1;min-width:0;display:flex;flex-direction:column;margin:3px 3px 3px 0;position:relative}
  #view{flex:1;min-height:0;overflow:auto;background:#fff;border:2px inset #808080;position:relative;outline:0}
  #prev{width:210px;flex:none;margin:3px 3px 3px 0;border:2px inset #808080;background:#fff;overflow:auto;padding:10px;display:none;font-size:12px}
  #prev.on{display:block}
  #prev .pi{text-align:center;margin-bottom:8px}#prev .pi img{width:64px;height:64px;object-fit:contain;image-rendering:pixelated}
  #prev h3{margin:0 0 6px;font-size:14px;word-break:break-word}
  #prev dl{margin:6px 0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}#prev dt{color:#555}#prev dd{margin:0;word-break:break-word}
  #prev pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:#f4f4f4;border:1px solid #c0c0c0;padding:4px;max-height:200px;overflow:auto;margin:6px 0;user-select:text}
  #prev .pimg{max-width:100%;max-height:180px;display:block;margin:6px auto;border:1px solid #808080}
  #prev .hint{color:#555;margin-top:8px}
  .hd{display:flex;position:sticky;top:0;background:var(--face);z-index:3;border-bottom:1px solid #808080}
  .hd div{padding:2px 6px;border-right:1px solid #808080;box-shadow:inset 1px 1px #fff;overflow:hidden;white-space:nowrap;cursor:default}
  .hd .c0{flex:1;min-width:140px}.hd .c1{width:90px;text-align:right}.hd .c2{width:130px}.hd .c3{width:150px}
  .it{cursor:default;position:relative}
  .it .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it img.ic{object-fit:contain;flex:none}
  .it.sel .nm span,.it.sel .nm input{background:var(--navy);color:#fff}
  .it.cut{opacity:.55}
  .it .nm span{padding:1px 3px;border:1px dotted transparent}
  .it.foc .nm span{border-color:#ff0}
  .it.dropt .nm span{background:#808000;color:#fff}
  .it input.rn{font:inherit;color:#000;background:#fff;border:1px solid #000;padding:0 2px;min-width:80px;width:calc(100% - 4px)}
  .v-details .it{display:flex;height:20px;align-items:center}
  .v-details .it>div{padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .v-details .it .c0{flex:1;min-width:140px;display:flex;align-items:center;gap:5px}.v-details .it .c0 img{width:16px;height:16px}
  .v-details .it .c1{width:90px;text-align:right}.v-details .it .c2{width:130px}.v-details .it .c3{width:150px}
  .v-details .it.sel>div:not(.c0){background:var(--navy);color:#fff}
  .v-large .hd,.v-small .hd,.v-list .hd{display:none}
  .v-large #items{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:2px;padding:6px;align-content:start}
  .v-large .it{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 2px;min-height:78px}
  .v-large .it img.ic{width:32px;height:32px;margin-bottom:4px}
  .v-large .it .nm{white-space:normal;word-break:break-word;font-size:12px;max-height:3.6em;overflow:hidden}
  .v-large .it>div:not(.c0){display:none}.v-large .it .c0{display:flex;flex-direction:column;align-items:center}
  .v-small #items,.v-list #items{display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,22px);grid-auto-columns:minmax(150px,220px);padding:4px;height:calc(100% - 8px);align-content:start}
  .v-small .it,.v-list .it{display:flex;height:22px;align-items:center}
  .v-small .it>div:not(.c0),.v-list .it>div:not(.c0){display:none}.v-small .it .c0,.v-list .it .c0{display:flex;align-items:center;gap:4px;min-width:0}
  .v-small .it img.ic,.v-list .it img.ic{width:16px;height:16px}
  .empty{padding:18px;color:#555}
  #st{display:flex;gap:2px;padding:2px;flex:none;border-top:1px solid #fff}
  #st div{padding:2px 6px;border:1px solid;border-color:#808080 #fff #fff #808080;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #st .a{flex:2}#st .b{flex:1}#st .c{flex:1.2}
  #ov{position:fixed;inset:0;background:rgba(0,0,0,.22);display:none;align-items:center;justify-content:center;z-index:80}
  #ov.on{display:flex}
  .dlg{background:var(--face);border:2px outset #fff;padding:2px;min-width:280px;max-width:min(480px,94vw);box-shadow:3px 3px 0 rgba(0,0,0,.4)}
  .dlg .tb{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:2px 5px;display:flex}
  .dlg .tb span{flex:1}
  .dlg .bd{padding:10px;max-height:70vh;overflow:auto;user-select:text}
  .dlg .ft{display:flex;gap:6px;justify-content:flex-end;padding:0 10px 10px}
  .dlg .ft button{min-width:76px}
  .dlg table{border-collapse:collapse;width:100%}.dlg td{padding:2px 4px;vertical-align:top}.dlg td:first-child{color:#444;white-space:nowrap;width:1%}
  .dlg hr{border:0;border-top:1px solid #808080;border-bottom:1px solid #fff;margin:8px 0}
  .dlg .pie{display:flex;gap:14px;align-items:center;margin-top:6px}.dlg .pie canvas{image-rendering:pixelated;flex:none}
  .dlg .lg i{display:inline-block;width:10px;height:10px;margin-right:6px;border:1px solid #000}
  .dlg .lg div{margin:2px 0}
  #npad{display:flex;gap:2px;margin-left:6px;flex:none}#npad button{min-width:24px;height:22px;padding:0 4px;font:13px/1 W95FA,'MS Sans Serif',sans-serif;color:#000;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px 0 #808080;cursor:pointer;touch-action:manipulation}#npad button:active{border-color:#404040 #fff #fff #404040;box-shadow:inset 1px 1px 0 #808080}
  #drop{position:absolute;inset:3px;border:3px dashed #000080;background:rgba(0,0,128,.08);display:none;align-items:center;justify-content:center;font-size:15px;color:#000080;z-index:20;pointer-events:none}
  #drop.on{display:flex}
  @media (max-width:560px){#tree{display:none}#toolbar button{min-width:38px;min-height:30px}#toolbar button span{display:none}}
</style></head><body>
<div id="menubar" role="menubar"></div>
<div id="toolbar" role="toolbar" aria-label="File Manager toolbar"></div>
<div id="addr"><label for="path">Address</label><input id="path" type="text" spellcheck="false" autocomplete="off"><input id="q" type="search" placeholder="Search C:\" aria-label="Search"><div id="npad" role="group" aria-label="Navigation pad"><button type="button" data-p="ArrowLeft" title="Up one folder level (←)" aria-label="Left: up one folder level">&larr;</button><button type="button" data-p="ArrowUp" title="Highlight the previous item (↑)" aria-label="Up: previous item">&uarr;</button><button type="button" data-p="ArrowDown" title="Highlight the next item (↓)" aria-label="Down: next item">&darr;</button><button type="button" data-p="ArrowRight" title="Enter the highlighted folder (→)" aria-label="Right: enter the highlighted folder">&rarr;</button></div></div>
<div id="main"><div id="tree" role="tree" aria-label="All folders"></div><div id="split"></div>
  <div id="right"><div id="view" tabindex="0" class="v-details" role="listbox" aria-multiselectable="true" aria-label="Folder contents"><div class="hd"><div class="c0" data-k="name">Name</div><div class="c1" data-k="size">Size</div><div class="c2" data-k="type">Type</div><div class="c3" data-k="mod">Modified</div></div><div id="items"></div></div><div id="drop">Drop files here to copy them into this folder</div></div>
  <div id="prev" aria-label="Preview"></div></div>
<div id="st"><div class="a" id="s1"></div><div class="b" id="s2"></div><div class="c" id="s3"></div></div>
<div id="ov"><div class="dlg" role="dialog" aria-modal="true"><div class="tb"><span id="dt"></span></div><div class="bd" id="db"></div><div class="ft" id="df"></div></div></div>
<input type="file" id="pick" multiple hidden><input type="file" id="pickzip" accept=".zip" hidden><input type="file" id="pickslot" accept=".json,application/json" hidden>
<script>
(function () {
  'use strict';
  var P = null, FS = null, I = null;
  try { P = parent.GHShell; FS = parent.ColtonFS; I = P && P.internals; } catch (e) {}
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var el = function (t, a, c) { var n = document.createElement(t); if (a) Object.keys(a).forEach(function (k) { if (k === 'class') n.className = a[k]; else if (k === 'text') n.textContent = a[k]; else if (k === 'html') n.innerHTML = a[k]; else n.setAttribute(k, a[k]); }); (c || []).forEach(function (x) { n.append(x); }); return n; };
  if (!P || !I || !FS) { document.body.textContent = 'The File Manager runs inside ColtonOS.'; return; }
  var SLKEY = (P.slots && P.slots.key) || 'gh-slots-v1', NSLOT = (P.slots && P.slots.count) || 6;
  var IC = function (n) { return '../' + I.IC(n); };
  var A = function (p) { return !p ? IC('document') : /^(https?:|data:|blob:|\.\.\/)/.test(p) ? p : '../' + p; };
  var GHE = function (n, d) { try { P.emit(n, d); } catch (e) {} };
  var store = { get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  var CAP = 16 * 1024 * 1024;
  var esc = function (s) { return window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/"/g, '\\"'); };

  /* ---------------- locations: shell:<folder> vfs:<id> gamedir:<url> saves:<url> search:<text> ---------------- */
  var FOLDER_OF = { 'folder:poor': 'shell:poor', 'folder:documents': 'vfs:docs', 'folder:games': 'shell:games', 'folder:classics': 'shell:classics', 'folder:accessories': 'shell:accessories', 'drive:c': 'shell:drive-c', 'sys:my-computer': 'shell:my-computer', 'sys:network': 'shell:network' };
  var games = function () { try { return P.catalog().games; } catch (e) { return []; } };
  var gameTitle = function (url) { var g = games().filter(function (x) { return x.url === url; })[0]; return g ? g.title : url; };
  var allSlots = function () { try { return JSON.parse(localStorage.getItem(SLKEY) || '{}') || {}; } catch (e) { return {}; } };
  var saveSlots = function (a) { try { localStorage.setItem(SLKEY, JSON.stringify(a)); return true; } catch (e) { return false; } };
  var lastSave = function (url) { var m = allSlots()[url] || {}; return Object.keys(m).reduce(function (a, k) { return Math.max(a, m[k].ts || 0); }, 0); };
  var fmtSize = function (n) { return n < 1024 ? n + ' bytes' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB'; };
  var shortSize = function (n) { return n < 1024 ? n + ' B' : n < 1048576 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; };
  var fmtDate = function (t) { if (!t) return ''; var d = new Date(t); return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
  var slotFileName = function (s, i) { return (!s.name || s.name === 'Slot ' + i) ? 'Slot ' + i + '.sav' : 'Slot ' + i + ' - ' + s.name.replace(/[\\/:*?"<>|]+/g, '') + '.sav'; };

  function shellNode(id) {
    var it = I.ITEMS.get(id); if (!it) return null; var loc2 = FOLDER_OF[id] || null;
    var n = { key: id, name: it.title, icon: A(it.icon), type: it.type || 'Item', desc: it.desc || '', folder: !!loc2, loc: loc2, mod: 0, size: id === 'drive:c' ? CAP : -1 };
    n.open = function () { if (loc2) go(loc2); else P.openItem(id); };
    return n;
  }
  var vfsIcon = function (m) { return m.kind === 'folder' ? IC('folder') : m.kind === 'image' ? IC('document') : /\.htm/i.test(m.name) ? IC('wordpad') : IC('document'); };
  var vfsType = function (m) { return m.kind === 'folder' ? 'File Folder' : m.kind === 'image' ? 'Bitmap Image' : /\.htm/i.test(m.name) ? 'WordPad Document' : m.kind === 'text' ? 'Text Document' : (m.name.indexOf('.') > 0 ? m.name.split('.').pop().toUpperCase() + ' File' : 'File'); };
  function vfsNode(m) {
    var n = { key: 'vfs:' + m.id, vfs: m, name: m.name, icon: vfsIcon(m), type: vfsType(m), folder: m.kind === 'folder', loc: m.kind === 'folder' ? 'vfs:' + m.id : null, mod: m.mtime || 0, size: m.kind === 'folder' ? -1 : (m.size || 0) };
    n.open = function () { if (n.folder) go(n.loc); else P.openItem('vfs:' + m.id); };
    return n;
  }
  function slotNodes(url) {
    var m = allSlots()[url] || {};
    return Object.keys(m).sort(function (a, b) { return a - b; }).map(function (i) {
      var s = m[i];
      return { key: 'slot:' + url + '#' + i, slot: { url: url, i: +i }, name: slotFileName(s, i), icon: IC('save-slot'), type: 'Save Slot File', folder: false, size: s.size || 0, mod: s.ts || 0, open: function () { P.openSlotFile(url, +i); } };
    });
  }
  function gameDirNodes(url) {
    var t = gameTitle(url), it = I.ITEMS.get('game:' + url), ls = lastSave(url);
    return [
      { key: 'exe:' + url, name: t + '.exe', icon: it ? A(it.icon) : IC('gamepad'), type: 'Application', folder: false, size: -1, mod: 0, desc: it ? it.desc : '', thumb: true, open: function () { P.openItem('game:' + url); } },
      { key: 'savesdir:' + url, name: 'saves', icon: IC('folder'), type: 'File Folder', folder: true, loc: 'saves:' + url, size: -1, mod: ls, desc: 'Save slots for ' + t }
    ];
  }
  /* featured = the normal Games folder; the rest live in Games > Unfinished / Poor Quality (data.js: 'desktop-feature': false) */
  var POOR_NAME = 'Unfinished / Poor Quality', POOR_PATH = 'C:\\Games\\Unfinished - Poor Quality';
  var isPoorGame = function (url) { var g = games().filter(function (x) { return x.url === url; })[0]; return !!g && g.featured === false; };
  function gameNode(g) {
    var it = I.ITEMS.get('game:' + g.url);
    return { key: 'gamedir:' + g.url, name: g.title, icon: it ? A(it.icon) : IC('folder'), type: 'File Folder', folder: true, loc: 'gamedir:' + g.url, size: -1, mod: lastSave(g.url), desc: it ? it.desc : '', thumb: true };
  }
  function gamesNodes() {
    var out = games().filter(function (g) { return g.featured !== false; }).map(gameNode);
    if (I.FOLDERS.poor && I.FOLDERS.poor.items().length) out.push({ key: 'folder:poor', name: POOR_NAME, icon: IC('folder'), type: 'File Folder', folder: true, loc: 'shell:poor', size: -1, mod: 0, desc: 'Games and tools that are unfinished, abandoned or not up to the usual standard' });
    return out;
  }
  function poorNodes() {
    var out = games().filter(function (g) { return g.featured === false; }).map(gameNode);
    I.FOLDERS.poor.items().forEach(function (id) { if (/^game:/.test(id) && isPoorGame(id.slice(5))) return; var n = shellNode(id); if (n) out.push(n); });
    return out;
  }
  function shellList(fid) {
    var F = I.FOLDERS[fid]; if (!F) return [];
    var out = F.items().map(shellNode).filter(Boolean);
    if (fid === 'drive-c') { var di = out.map(function (n) { return n.key; }).indexOf('folder:documents'); var dn = { key: 'vfs:desktop', name: 'Desktop', icon: IC('folder'), type: 'File Folder', folder: true, loc: 'vfs:desktop', size: -1, mod: 0, open: function () { go('vfs:desktop'); } }; out.splice(di < 0 ? out.length : di + 1, 0, dn); }
    return out;
  }
  function listLoc(l) {
    var m;
    if ((m = /^shell:(.+)$/.exec(l))) return m[1] === 'games' ? gamesNodes() : m[1] === 'poor' ? poorNodes() : shellList(m[1]);
    if ((m = /^vfs:(.+)$/.exec(l))) return FS.children(m[1]).map(vfsNode);
    if ((m = /^gamedir:(.+)$/.exec(l))) return gameDirNodes(m[1]);
    if ((m = /^saves:(.+)$/.exec(l))) return slotNodes(m[1]);
    return [];
  }
  var vfsMeta = function (l) { var m = /^vfs:(.+)$/.exec(l); return m ? m[1] : null; };
  function info(l) {
    var m;
    if ((m = /^shell:(.+)$/.exec(l))) {
      var fid = m[1], F = I.FOLDERS[fid] || I.FOLDERS['my-computer'];
      var path = { 'my-computer': 'My Computer', 'drive-c': 'C:\\', poor: POOR_PATH, games: 'C:\\Games', classics: 'C:\\Classic Games', accessories: 'C:\\Accessories', network: 'Network Neighborhood' }[fid] || F.title;
      return { title: fid === 'drive-c' ? 'ColtonOS (C:)' : F.title, icon: A(F.icon), path: path, parent: { 'my-computer': null, 'drive-c': 'shell:my-computer', poor: 'shell:games', games: 'shell:drive-c', classics: 'shell:drive-c', accessories: 'shell:drive-c', network: 'shell:my-computer' }[fid] || null, kind: fid === 'drive-c' ? 'Local Disk' : 'System Folder' };
    }
    if ((m = /^vfs:(.+)$/.exec(l))) {
      var id = m[1], meta = FS.meta(id), par = (id === 'docs' || id === 'desktop' || !meta || !meta.parent) ? 'shell:drive-c' : 'vfs:' + meta.parent;
      return { title: id === 'docs' ? 'My Documents' : id === 'desktop' ? 'Desktop' : meta ? meta.name : 'Folder', icon: id === 'docs' ? IC('documents-folder') : IC('folder'), path: FS.pathOf(id), parent: par, kind: 'File Folder' };
    }
    if ((m = /^gamedir:(.+)$/.exec(l))) return { title: gameTitle(m[1]), icon: IC('folder'), path: (isPoorGame(m[1]) ? POOR_PATH : 'C:\\Games') + '\\' + gameTitle(m[1]), parent: isPoorGame(m[1]) ? 'shell:poor' : 'shell:games', kind: 'File Folder' };
    if ((m = /^saves:(.+)$/.exec(l))) return { title: 'saves', icon: IC('save-slot'), path: (isPoorGame(m[1]) ? POOR_PATH : 'C:\\Games') + '\\' + gameTitle(m[1]) + '\\saves', parent: 'gamedir:' + m[1], kind: 'File Folder', saves: m[1] };
    if (/^search:/.test(l)) return { title: 'Search Results', icon: IC('find'), path: 'Search Results', parent: null, kind: 'Search', search: l.slice(7) };
    return info('shell:my-computer');

  /* ---------------- address bar, search, splitter ---------------- */
  function resolvePath(str) {
    var parts = String(str || '').trim().replace(/\//g, '\\').split('\\').filter(function (x) { return x !== ''; }), cur = 'shell:my-computer'; if (!parts.length) return null;
    if (/^my computer$/i.test(parts[0])) parts.shift(); else if (/^network neighborhood$/i.test(parts[0])) return 'shell:network';
