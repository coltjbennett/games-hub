<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Entry Generator (Games &amp; Applets)</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e1e;
      color: #fff;
      display: flex;
      padding: 20px;
      gap: 20px;
    }
    .form-container {
      flex: 1;
      background: #2d2d2d;
      padding: 20px;
      border-radius: 8px;
    }
    .output-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      font-size: 0.9em;
      color: #aaa;
    }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      background: #3d3d3d;
      border: 1px solid #555;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .checkbox-group {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .checkbox-group label { margin-top: 0; color: #fff; }
    button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    button:hover { background: #005f9e; }
    pre {
      background: #000;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      flex-grow: 1;
      margin: 0;
      color: #9cdcfe;
      border: 1px solid #444;
    }
    .string { color: #ce9178; }
    .key { color: #9cdcfe; }
    .boolean { color: #569cd6; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2 id="form-title">Add New Project</h2>

    <label>Entry type</label>
    <select id="p-mode" onchange="setMode()">
      <option value="game">Game (goes in the projects list, shown in the Library)</option>
      <option value="applet">Applet (goes in the applets list, Accessories only)</option>
    </select>
    
    <label>Title</label>
    <input type="text" id="p-title" placeholder="e.g. Space Invaders" oninput="updateAltText()">

    <label id="l-url">HTML Filename (auto prepends 'games/')</label>
    <input type="text" id="p-url" placeholder="e.g. space.html">

    <label id="l-image">Image Filename (auto prepends 'images/')</label>
    <input type="text" id="p-image" placeholder="e.g. IMG_1234.jpeg">

    <div id="applet-only" style="display:none">
      <label>Window size (optional, width x height in pixels)</label>
      <div style="display:flex;gap:8px"><input type="text" id="a-w" placeholder="width, e.g. 560"><input type="text" id="a-h" placeholder="height, e.g. 440"></div>
      <div class="checkbox-group"><input type="checkbox" id="a-keep"><label for="a-keep">Keep loaded when closed (for timers etc.)</label></div>
      <div class="checkbox-group"><input type="checkbox" id="a-games"><label for="a-games">Show under Start › Programs › Games</label></div>
    </div>

    <div class="game-only">
    <label>Alt Text (auto-filled from Title)</label>
    <input type="text" id="p-alt" placeholder="e.g. Space Invaders">

    <label>Status Key</label>
    <select id="p-status">
      <option value="new">new</option>
      <option value="complete">complete</option>
      <option value="beta">beta</option>
      <option value="wipPlayable">wipPlayable</option>
      <option value="wipBuggy">wipBuggy</option>
      <option value="unfinished">unfinished</option>
      <option value="legacy">legacy</option>
      <option value="abandoned">abandoned</option>
    </select>

    <label>Type / Genre</label>
    <input type="text" id="p-type" placeholder="e.g. Arcade">

    <label>Tags (comma separated)</label>
    <input type="text" id="p-tags" placeholder="e.g. Shooter, Space, Retro">

    </div><!-- /game-only (type, tags, status) -->
    <label>Description</label>
    <textarea id="p-desc" rows="3" placeholder="A short description..."></textarea>
    <div class="game-only">

    <div class="checkbox-group">
      <input type="checkbox" id="p-featured">
      <label for="p-featured">Featured Game</label>
    </div>
    </div>

    <button onclick="generateSnippet()">Generate & Copy Snippet</button>
  </div>

  <div class="output-container">
    <h2 id="out-title">Ready for data.js (projects array)</h2>
    <p style="color:#aaa;font-size:.85em;margin:0 0 8px">Paste inside the matching <code>const projects = [...]</code> or <code>const applets = [...]</code> array in data.js. Applets are auto-detected by the site; no other file needs editing.</p>
    <pre id="output-snippet">// Fill out the form to generate code...</pre>
  </div>

  <script>
    function updateAltText() {
      document.getElementById('p-alt').value = document.getElementById('p-title').value;
      generateSnippet(); // Auto-update as you type
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'");
    }

    function mode() { return document.getElementById('p-mode').value; }
    function setMode() {
      const a = mode() === 'applet';
      document.querySelectorAll('.game-only').forEach(e => e.style.display = a ? 'none' : '');
      document.getElementById('applet-only').style.display = a ? '' : 'none';
      document.getElementById('form-title').textContent = a ? 'Add New Applet' : 'Add New Project';
      document.getElementById('l-url').textContent = a ? "HTML Filename (auto prepends 'applets/')" : "HTML Filename (auto prepends 'games/')";
      document.getElementById('l-image').textContent = a ? "Icon path (e.g. calculator.png auto-prepends 'images/icons/'; a full path like images/icons/x.svg is kept)" : "Image Filename (auto prepends 'images/')";
      document.getElementById('out-title').textContent = a ? 'Ready for data.js (applets array)' : 'Ready for data.js (projects array)';
      generateSnippet();
    }
    function appletSnippet() {
      let url = document.getElementById('p-url').value.trim();
      if (url && !/^applets\//i.test(url)) url = 'applets/' + url;
      let icon = document.getElementById('p-image').value.trim();
      if (icon && !/^images\//i.test(icon)) icon = 'images/icons/' + icon;
      const w = parseInt(document.getElementById('a-w').value, 10), hh = parseInt(document.getElementById('a-h').value, 10);
      let extra = '';
      if (w > 0 && hh > 0) extra += `, w: ${w}, h: ${hh}`;
      if (document.getElementById('a-keep').checked) extra += ', keep: true';
      if (document.getElementById('a-games').checked) extra += `, group: 'games'`;
      return `  { title: '${escapeQuotes(document.getElementById('p-title').value || '')}', description: '${escapeQuotes(document.getElementById('p-desc').value || '')}', icon: '${escapeQuotes(icon)}', url: '${escapeQuotes(url)}'${extra} },`;
    }
    function generateSnippet() {
      if (mode() === 'applet') {
        const out = appletSnippet();
        document.getElementById('output-snippet').textContent = out;
        try { navigator.clipboard && navigator.clipboard.writeText(out); } catch (e) {}
        return;
      }
      const title = document.getElementById('p-title').value || '';
      
      let url = document.getElementById('p-url').value || '';
      if(url && !url.toLowerCase().startsWith('games/')) {
        url = 'games/' + url;
      }

      let image = document.getElementById('p-image').value || '';
      if(image && !image.toLowerCase().startsWith('images/')) {
        image = 'images/' + image;
      }

      const alt = document.getElementById('p-alt').value || '';
      const statusKey = document.getElementById('p-status').value;
      const type = document.getElementById('p-type').value || '';
      const desc = document.getElementById('p-desc').value || '';
      const featured = document.getElementById('p-featured').checked;
      
      // Handle tags
      const tagsRaw = document.getElementById('p-tags').value;
      const tagsArray = tagsRaw.split(',')
                               .map(t => t.trim())
                               .filter(t => t !== '');
      const tagsFormatted = tagsArray.length > 0 
        ? `[${tagsArray.map(t => `'${escapeQuotes(t)}'`).join(', ')}]` 
        : `[]`;

      // Build snippet string
      const snippet = `{
  title: '${escapeQuotes(title)}',
  url: '${escapeQuotes(url)}',
  image: '${escapeQuotes(image)}',
  alt: '${escapeQuotes(alt)}',
  statusKey: '${statusKey}',
  type: '${escapeQuotes(type)}',
  tags: ${tagsFormatted},
  description: '${escapeQuotes(desc)}',
  featured: ${featured}
},`;

      // Display it
      document.getElementById('output-snippet').textContent = snippet;
      try { navigator.clipboard && navigator.clipboard.writeText(snippet); } catch (e) {}
    }

    // Attach auto-update to all inputs
    const inputs = document.querySelectorAll('input, select, textarea');
    inputs.forEach(input => {
      input.addEventListener('input', generateSnippet);
    });
  </script>
</body>
</html>
