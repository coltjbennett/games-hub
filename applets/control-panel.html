<!DOCTYPE html>
<html lang="en" data-scheme="standard">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Panel</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { overflow: auto; height: 100%; background: var(--face); }
    body { display: flex; flex-direction: column; font-size: calc(var(--ui-size) * var(--text-scale)); }
    #crt, #wallpaper { display: none !important; }
    .cp-bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; flex: none; border-bottom: 1px solid var(--shadow); box-shadow: 0 1px 0 var(--hl); }
    .cp-bar h1 { margin: 0; font-size: 1.1em; flex: 1; }
    .cp-main { flex: 1; min-height: 0; overflow: auto; padding: 10px; }
    .cp-foot { flex: none; padding: 8px; display: flex; justify-content: space-between; gap: 8px; align-items: center; border-top: 1px solid var(--shadow); box-shadow: 0 -1px 0 var(--hl); flex-wrap: wrap; }
    .cp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; background: var(--win); color: var(--win-text); padding: 8px; min-height: 100%; align-content: start; }
    .cp-icon { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; background: transparent; border: 0; padding: 8px 4px; color: inherit; border-radius: 0; min-height: 84px; }
    .cp-icon img { width: 32px; height: 32px; object-fit: cover; }
    .cp-icon span { padding: 1px 3px; overflow-wrap: anywhere; }
    .cp-icon:hover span, .cp-icon:focus-visible span { background: var(--sel); color: var(--sel-text); }
    .cp-icon:focus-visible { outline: none; }
    .group { margin: 0 0 10px; padding: 10px 10px 8px; position: relative; }
    .group > legend, .group > .gl { position: absolute; top: -9px; left: 8px; background: var(--face); padding: 0 4px; }
    fieldset.group { border: 1px solid var(--shadow); box-shadow: 1px 1px 0 var(--hl), inset 1px 1px 0 var(--hl); min-width: 0; margin-left: 0; margin-right: 0; margin-top: 14px; }
    fieldset.group legend { position: static; padding: 0 4px; }
    .opt { display: block; margin: 5px 0; }
    .hint { margin: 4px 0 0 20px; opacity: .85; font-size: .92em; line-height: 1.3; }
    .row { flex-wrap: wrap; }
    .swatches { display: grid; grid-template-columns: repeat(8, 28px); gap: 3px; margin: 6px 0; }
    .sw { width: 28px; height: 24px; padding: 0; border: 0; border-radius: 0; box-shadow: inset 0 0 0 1px #000; }
    .sw[aria-pressed="true"] { box-shadow: inset 0 0 0 1px #000, inset 0 0 0 3px #fff, inset 0 0 0 4px #000; }
    .monitor { width: 180px; height: 130px; margin: 0 auto 10px; padding: 12px 12px 18px; background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hl), inset -2px -2px var(--shadow), inset 2px 2px var(--light); flex: none; }
    .screen { position: relative; width: 100%; height: 100%; box-shadow: inset 1px 1px var(--shadow), inset -1px -1px var(--hl); overflow: hidden; }
    .screen img { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 70%; max-height: 80%; object-fit: contain; }
    .mini-win { position: absolute; left: 8px; top: 8px; width: 108px; height: 62px; background: var(--face); box-shadow: inset -1px -1px #000, inset 1px 1px #fff; padding: 2px; }
    .mini-win b { display: block; height: 9px; background: var(--pv-title, #000080); }
    .mini-win i { display: block; margin: 5px 4px 0; height: 4px; background: #000; opacity: .6; }
    .mini-win .mw-sel { display: inline-block; margin: 4px 4px 0; padding: 0 4px; background: var(--pv-title, #000080); color: #fff; font-size: 9px; font-style: normal; }
    .preview-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
    .preview-row > .col { flex: 1; min-width: 200px; }
    .dbl { width: 64px; height: 64px; background: var(--win); box-shadow: inset 1px 1px var(--shadow), inset -1px -1px var(--hl); display: flex; align-items: center; justify-content: center; font-size: 28px; touch-action: manipulation; user-select: none; cursor: url('images/Cursor_15.cur'), pointer; }
    input[type="range"] { width: 200px; max-width: 100%; accent-color: var(--title-a); }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; }
    .kv dt { margin: 0; } .kv dd { margin: 0; }
    .crumb { opacity: .8; }
    a.cplink { color: var(--link); text-decoration: underline; background: none; border: 0; padding: 0; }
  </style>
</head>
<body>
  <div class="cp-bar">
    <button type="button" class="btn small" id="back" hidden>◄ Back</button>
    <h1 id="title" tabindex="-1">Control Panel</h1>
  </div>
  <div class="cp-main" id="main"></div>
  <div class="cp-foot">
    <span class="small" id="foot-note">Changes take effect immediately.</span>
    <button type="button" class="btn" id="close">Close</button>
  </div>

  <script>

    function group(title) { var a = Array.prototype.slice.call(arguments, 1); return h('fieldset', { class: 'group' }, h('legend', { text: title }), a); }

    }

    /* ---------- pages ---------- */

            group('Fine tuning', h('label', { class: 'row' }, h('span', { text: 'Intensity:' }), (function () { var r = h('input', { type: 'range', min: '10', max: '100', step: '5', 'aria-label': 'CRT intensity' }); r.value = S().crtIntensity; r.addEventListener('input', function () { set('crtIntensity', Number(r.value)); }); return r; })()),

        }],

            h('div', { class: 'row', style: 'margin-top:8px' }, btn('Arrange by Name', function () { g && g.arrangeIcons('name'); }), btn('Arrange by Type', function () { g && g.arrangeIcons('type'); }))),
            group('Restore', h('p', { class: 'hint', style: 'margin-left:0', text: 'Put every icon back where it started and bring back anything in the Recycle Bin.' }), btn('Restore default icons', function () { g && g.resetIcons(); })));
        }]
      ]);
    }
    function pageMouse() {
      var res = h('div', { class: 'hint', style: 'margin-left:0', role: 'status', 'aria-live': 'polite', text: 'Double-click the box to test your speed.' }), last = 0;

        return h('div', {}, radios('click', 'clickMode', [['auto', 'Automatic', 'Single-tap on touchscreens, double-click with a mouse.'], ['double', 'Double-click to open items', 'Classic behavior. Single click selects.'], ['single', 'Single-click to open items', 'Easiest for touch, pens and one-handed use.']], 'Click behavior'),
          group('Double-click speed', h('label', { class: 'row' }, h('span', { text: 'Slow' }), speed, h('span', { text: 'Fast' }), out), h('div', { class: 'row', style: 'margin-top:8px' }, test, res)));
      }]]);
    }

        return h('div', {}, group('Taskbar', check('Auto hide', 'autoHide', 'The taskbar slides away until you move the pointer to the bottom edge or focus it.'), check('Show clock', 'showClock')),

      }]]);
    }

      var cur = S().textScale, sel = h('select', { class: 'field', 'aria-label': 'Text size' });
      [[1, 'Normal (100%)'], [1.15, 'Large (115%)'], [1.3, 'Larger (130%)'], [1.5, 'Largest (150%)']].forEach(function (o) { var op = h('option', { value: o[0], text: o[1] }); if (Number(cur) === o[0]) op.selected = true; sel.append(op); });

        }],

          return h('div', {}, group('Window layout (this browser tab only)', h('div', { class: 'row' }, btn('Save layout', function () { g && g.saveLayout(); }), btn('Restore layout', function () { g && g.restoreLayout(); }), btn('Reset all windows', function () { g && g.resetLayout(); }))));
        }],
        ['Reset', function () {

    }

          h('div', { class: 'row' }, btn('Clear favorites', function () { g.clearFavorites(); render(); }), btn('Clear recent games', function () { g.clearRecents(); render(); }), btn('Open Project Library', function () { g.openItem('app:library'); }))),
          group('Theme packs', h('div', { class: 'row' }, btn('Export theme…', function () { var blob = new Blob([JSON.stringify(g.exportTheme(), null, 2)], { type: 'application/json' }), a = h('a', { href: URL.createObjectURL(blob), download: 'coltonos-theme.json' }); D.body.append(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0); }), btn('Import theme…', function () { file.click(); }), file),
            h('p', { class: 'hint', style: 'margin-left:0', text: 'Packs include your scheme, desktop color, screen effects, mouse and accessibility options.' })));

  })();
  </script>
</body>
</html>
