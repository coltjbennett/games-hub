<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: inherit;
      background: transparent;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      user-select: none;
    }
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 6px;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      padding: 6px 0;
      cursor: pointer;
      font-size: 0.85rem;
      border-radius: 4px;
    }
    .tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
    .tab-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      font-weight: bold;
    }
    .view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
    }
    .view.active { display: flex; }
    .digital-clock { font-size: 2.2rem; font-weight: bold; letter-spacing: 1px; }
    .date-display { font-size: 0.85rem; opacity: 0.8; }
    .controls { display: flex; gap: 8px; }
    button.action {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      padding: 6px 14px;
      cursor: pointer;
    }
    button.action:hover { background: rgba(255, 255, 255, 0.25); }
    input[type="number"], input[type="time"] {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      padding: 4px 8px;
      text-align: center;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('clock', this)">Clock</button>
    <button class="tab-btn" onclick="showTab('stopwatch', this)">Stopwatch</button>
    <button class="tab-btn" onclick="showTab('timer', this)">Timer</button>
    <button class="tab-btn" onclick="showTab('alarm', this)">Alarm</button>
  </div>

  <div id="clockView" class="view active">
    <div class="digital-clock" id="clockDisplay">00:00:00</div>
    <div class="date-display" id="dateDisplay">---</div>
  </div>

  <div id="stopwatchView" class="view">
    <div class="digital-clock" id="swDisplay">00:00.00</div>
    <div class="controls">
      <button class="action" onclick="startSW()">Start</button>
      <button class="action" onclick="stopSW()">Stop</button>
      <button class="action" onclick="resetSW()">Reset</button>
    </div>
  </div>

  <div id="timerView" class="view">
    <div>
      <input type="number" id="timerSec" min="1" max="3600" value="60" style="width: 70px;"> sec
    </div>
    <div class="digital-clock" id="timerDisplay">00:00</div>
    <div class="controls">
      <button class="action" onclick="startTimer()">Start</button>
      <button class="action" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <div id="alarmView" class="view">
    <input type="time" id="alarmTime">
    <button class="action" onclick="setAlarm()">Set Alarm</button>
    <div id="alarmMsg" class="date-display">No alarm set</div>
  </div>

  <script>
    function showTab(name, btn) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(name + 'View').classList.add('active');
      btn.classList.add('active');
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clockDisplay').innerText = now.toLocaleTimeString();
      document.getElementById('dateDisplay').innerText = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      checkAlarm(now);
    }
    setInterval(updateClock, 1000);
    updateClock();

    let swInterval, swTime = 0;
    function startSW() {
      if (swInterval) return;
      swInterval = setInterval(() => {
        swTime += 10;
        let ms = Math.floor((swTime % 1000) / 10).toString().padStart(2, '0');
        let s = Math.floor((swTime / 1000) % 60).toString().padStart(2, '0');
        let m = Math.floor(swTime / 60000).toString().padStart(2, '0');
        document.getElementById('swDisplay').innerText = `${m}:${s}.${ms}`;
      }, 10);
    }
    function stopSW() { clearInterval(swInterval); swInterval = null; }
    function resetSW() { stopSW(); swTime = 0; document.getElementById('swDisplay').innerText = '00:00.00'; }

    let timerInterval, tLeft = 0;
    function startTimer() {
      resetTimer();
      tLeft = parseInt(document.getElementById('timerSec').value) || 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        if (tLeft <= 0) {
          clearInterval(timerInterval);
          alert('Timer Finished!');
          return;
        }
        tLeft--;
        updateTimerDisplay();
      }, 1000);
    }
    function resetTimer() { clearInterval(timerInterval); }
    function updateTimerDisplay() {
      let m = Math.floor(tLeft / 60).toString().padStart(2, '0');
      let s = (tLeft % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    }

    let alarmTarget = null;
    function setAlarm() {
      const val = document.getElementById('alarmTime').value;
      if (!val) return;
      alarmTarget = val;
      document.getElementById('alarmMsg').innerText = `Alarm set for ${val}`;
    }
    function checkAlarm(now) {
      if (!alarmTarget) return;
      const currentHM = now.toTimeString().slice(0, 5);
      if (currentHM === alarmTarget && now.getSeconds() === 0) {
        alert('Alarm Ringing!');
        alarmTarget = null;
        document.getElementById('alarmMsg').innerText = 'No alarm set';
      }
    }
  </script>
</body>
</html>
