<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Games</title>
<style>
  @font-face{font-family:W95FA;src:url('../images/w95f.woff2') format('woff2'),url('../images/w95f.woff') format('woff')}
  :root{color-scheme:light only}
  *{box-sizing:border-box;font-family:W95FA,"MS Sans Serif",sans-serif}
  html,body{margin:0;height:100%;background:#c0c0c0;color:#000;overflow:hidden}
  #app{display:flex;height:100%;gap:6px;padding:6px}
  #menu{width:190px;flex:none;display:flex;flex-direction:column;gap:4px;overflow:auto}
  #menu button{font-size:13px;text-align:left;padding:5px 8px;background:#c0c0c0;border:2px outset #fff;color:#000;cursor:pointer}
  #menu button small{display:block;font-size:11px;color:#444}
  #menu button.on{border-style:inset;background:#d8d8d8}
  #term{flex:1;min-width:0;display:flex;flex-direction:column;background:#000;border:2px inset #808080}
  #out{flex:1;overflow-y:auto;padding:8px;color:#c0c0c0;font:15px/1.25 W95FA,"Courier New",monospace;white-space:pre-wrap;word-break:break-word}
  #row{display:flex;border-top:1px solid #444}
  #row span{color:#5f5;padding:6px 0 6px 8px;font:15px W95FA,monospace}
  #in{flex:1;background:#000;color:#fff;border:0;outline:0;font:16px W95FA,"Courier New",monospace;padding:6px 8px;min-width:0}
  #go{background:#c0c0c0;border:2px outset #fff;margin:3px;padding:0 12px;font-size:13px;color:#000}
  @media(max-width:560px){#app{flex-direction:column}#menu{width:auto;flex-direction:row;overflow-x:auto}#menu button{flex:none}#menu small{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="menu" role="list" aria-label="Games"></div>
  <div id="term"><div id="out" role="log" aria-live="polite"></div>
    <form id="row" autocomplete="off"><span>&gt;</span><input id="in" enterkeyhint="send" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Type your answer or command"><button id="go" type="submit">Enter</button></form></div>
</div>
<script src="textgames-core.js"></script>
<script>
(function(){
  var lastId=null,out=document.getElementById('out'),inp=document.getElementById('in'),menu=document.getElementById('menu'),game=null,btns={};
  function print(s){out.textContent+=(s==null?'':s)+'\n';out.scrollTop=out.scrollHeight;}
  function event(name){try{window.parent.GHShell&&window.parent.GHShell.emit&&window.parent.GHShell.emit(name);}catch(e){}}
  var io={print:print,event:event};
  function start(id){
    out.textContent='';game=TextGames.start(id,io);
    Object.keys(btns).forEach(function(k){btns[k].classList.toggle('on',k===id);});
    event('textgame:'+id);game.intro();inp.focus();
  }
  TextGames.list().forEach(function(g){
    var b=document.createElement('button');b.type='button';b.setAttribute('role','listitem');b.innerHTML='';b.append(g.name);var s=document.createElement('small');s.textContent=g.desc;b.append(s);
    b.onclick=function(){start(g.id);};menu.append(b);btns[g.id]=b;
  });
  document.getElementById('row').addEventListener('submit',function(e){
    e.preventDefault();var v=inp.value;inp.value='';
    if(!game){if(!v.trim()&&lastId){start(lastId);return;}print('Pick a game from the list.');return;}
    print('> '+v);game.input(v);
    if(game.done){print('\n[Game over - pick another game from the list, or press Enter to play again]');var id=game.id;game=null;lastId=id;}
    inp.focus();
  });
  print('TEXT GAMES\nPick a game on the left to begin.\n');
})();
</script>
</body></html>
