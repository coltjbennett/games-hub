<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    @font-face {
      font-family: "W95FA";
      src: url('images/w95f.woff2') format('woff2'),
           url('images/w95f.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --win-bg: #c0c0c0;
      --win-blue: #000080;
      --win-text: #000000;
      --win-border-light: #ffffff;
      --win-border-dark: #808080;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "W95FA", "MS Sans Serif", sans-serif;
      user-select: none;
    }

    body {
      background: var(--win-bg);
      color: var(--win-text);
      display: flex;
      height: 100vh;
      padding: 8px;
      gap: 8px;
      overflow: hidden;
    }

    .sidebar {
      width: 140px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .note-list {
      flex: 1;
      overflow-y: auto;
      background: #ffffff;
      border: 2px inset var(--win-border-dark);
      padding: 2px;
      display: flex;
      flex-direction: column;
    }

    .note-item {
      padding: 4px 6px;
      cursor: default;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--win-text);
    }

    .note-item.active {
      background: var(--win-blue);
      color: #ffffff;
    }

    .main-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    input[type="text"], textarea {
      background: #ffffff;
      border: 2px inset var(--win-border-dark);
      color: var(--win-text);
      padding: 6px;
      font-size: 13px;
      outline: none;
      user-select: text;
    }

    textarea {
      flex: 1;
      resize: none;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    button {
      background: var(--win-bg);
      border: 2px outset var(--win-border-light);
      color: var(--win-text);
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    button:active {
      border-style: inset;
      padding: 5px 9px 3px 11px; /* simulates physical press down */
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <button onclick="createNewNote()">New Note</button>
    <div class="note-list" id="noteList"></div>
  </div>
  <div class="main-pane">
    <input type="text" id="noteTitle" placeholder="Note title..." oninput="autoSave()">
    <textarea id="noteContent" placeholder="Write your note here..." oninput="autoSave()"></textarea>
    <div class="actions">
      <button onclick="deleteCurrentNote()">Delete Note</button>
    </div>
  </div>

  <script>
    let notes = JSON.parse(localStorage.getItem('desktop_notes_app') || '[]');
    let activeNoteId = null;

    const noteListEl = document.getElementById('noteList');
    const titleEl = document.getElementById('noteTitle');
    const contentEl = document.getElementById('noteContent');

    function init() {
      if (notes.length === 0) {
        createNewNote();
      } else {
        renderList();
        selectNote(notes[0].id);
      }
    }

    function renderList() {
      noteListEl.innerHTML = '';
      notes.forEach(note => {
        const item = document.createElement('div');
        item.className = `note-item ${note.id === activeNoteId ? 'active' : ''}`;
        item.innerText = note.title || 'Untitled Note';
        item.onclick = () => selectNote(note.id);
        noteListEl.appendChild(item);
      });
    }

    function selectNote(id) {
      activeNoteId = id;
      const note = notes.find(n => n.id === id);
      if (note) {
        titleEl.value = note.title;
        contentEl.value = note.content;
      }
      renderList();
    }

    function createNewNote() {
      const newNote = {
        id: Date.now(),
        title: 'Untitled Note',
        content: ''
      };
      notes.unshift(newNote);
      activeNoteId = newNote.id;
      saveToStorage();
      selectNote(newNote.id);
    }

    function autoSave() {
      if (!activeNoteId) return;
      const note = notes.find(n => n.id === activeNoteId);
      if (note) {
        note.title = titleEl.value.trim() || 'Untitled Note';
        note.content = contentEl.value;
        saveToStorage();
        renderList();
      }
    }

    function deleteCurrentNote() {
      if (!activeNoteId) return;
      notes = notes.filter(n => n.id !== activeNoteId);
      saveToStorage();
      if (notes.length > 0) {
        selectNote(notes[0].id);
      } else {
        createNewNote();
      }
    }

    function saveToStorage() {
      localStorage.setItem('desktop_notes_app', JSON.stringify(notes));
    }

    init();
  </script>
</body>
</html>
