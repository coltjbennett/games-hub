<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather</title>
  <!-- Chart.js CDN for retro data graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @font-face {
      font-family: "W95FA";
      src: url('images/w95f.woff2') format('woff2'),
           url('images/w95f.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --win-bg: #c0c0c0;
      --win-blue: #000080;
      --win-text: #000000;
      --win-border-light: #ffffff;
      --win-border-dark: #808080;
      --alert-bg: #ffcccc;
      --alert-border: #cc0000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "W95FA", "MS Sans Serif", sans-serif;
    }

    body {
      background: var(--win-bg);
      color: var(--win-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 6px;
      overflow: hidden;
    }

    /* Controls Bar */
    .toolbar {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
      align-items: center;
    }

    input[type="text"], select {
      background: #ffffff;
      border: 2px inset var(--win-border-dark);
      padding: 3px 5px;
      font-size: 12px;
      outline: none;
    }

    button {
      background: var(--win-bg);
      border: 2px outset var(--win-border-light);
      padding: 3px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    button:active {
      border-style: inset;
    }

    /* Tabs Bar */
    .tabs-header {
      display: flex;
      gap: 2px;
      border-bottom: 2px solid var(--win-border-dark);
      margin-bottom: 6px;
    }

    .tab-btn {
      padding: 3px 8px;
      background: var(--win-bg);
      border: 2px outset var(--win-border-light);
      border-bottom: none;
      font-size: 12px;
      cursor: pointer;
    }

    .tab-btn.active {
      font-weight: bold;
      border-bottom: 2px solid var(--win-bg);
      margin-bottom: -2px;
    }

    /* Main Container */
    .content-panel {
      flex: 1;
      background: #ffffff;
      border: 2px inset var(--win-border-dark);
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Hero Weather Card */
    .weather-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #000080, #1040a0);
      color: #ffffff;
      padding: 12px 16px;
      border: 2px outset var(--win-border-light);
      margin-bottom: 10px;
    }

    .hero-temp {
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .hero-sub {
      font-size: 12px;
      color: #d0d0ff;
    }

    .hero-condition {
      font-size: 15px;
      color: #ffff80;
    }

    .hero-icon {
      font-size: 44px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }

    .stat-card {
      background: var(--win-bg);
      border: 2px outset var(--win-border-light);
      padding: 6px 8px;
    }

    .stat-label {
      font-size: 10px;
      color: #444444;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 13px;
      font-weight: bold;
      color: var(--win-blue);
    }

    /* Hourly & Daily Forecast Cards */
    .forecast-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 10px;
    }

    .forecast-card {
      min-width: 80px;
      background: var(--win-bg);
      border: 2px outset var(--win-border-light);
      text-align: center;
      padding: 6px 4px;
      font-size: 11px;
    }

    .forecast-card .icon {
      font-size: 20px;
      margin: 4px 0;
    }

    /* Graph Container */
    .chart-box {
      background: #fcfcfc;
      border: 2px inset var(--win-border-dark);
      padding: 8px;
      margin-top: 6px;
      position: relative;
      height: 220px;
      width: 100%;
    }

    /* Radar View Simulation */
    .radar-box {
      width: 100%;
      height: 200px;
      background: #001122;
      border: 2px inset var(--win-border-dark);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .radar-sweep {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(0,255,0,0.4), transparent 60deg);
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .radar-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle, rgba(0,255,0,0.25) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Conditional Alert Banner */
    .alert-banner {
      background: var(--alert-bg);
      border: 2px solid var(--alert-border);
      color: #8b0000;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-footer {
      font-size: 10px;
      color: #666;
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <input type="text" id="cityInput" placeholder="Enter location..." style="flex: 1;" />
    <button id="searchBtn">Search</button>
    <select id="presetSelect">
      <option value="">-- Presets --</option>
      <option value="New York, NY">New York, NY</option>
      <option value="Los Angeles, CA">Los Angeles, CA</option>
      <option value="Chicago, IL">Chicago, IL</option>
      <option value="London, UK">London, UK</option>
      <option value="Tokyo, JP">Tokyo, JP</option>
    </select>
    <button id="unitBtn">°F / °C</button>
  </div>

  <div class="tabs-header">
    <div class="tab-btn active" data-tab="current">Current</div>
    <div class="tab-btn" data-tab="hourly">Hourly & Charts</div>
    <div class="tab-btn" data-tab="daily">5-Day Forecast</div>
    <div class="tab-btn" data-tab="radar">Precip & Radar</div>
  </div>

  <div class="content-panel" id="mainContent">
    <div style="text-align:center; margin-top:20px; font-weight:bold;">Locating & loading weather data...</div>
  </div>

  <script>
    let currentCity = 'Local';
    let unit = 'F';
    let activeTab = 'current';
    let weatherData = null;
    let activeAlerts = [];
    let chartInstance = null;

    const weatherIcons = {
      0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
      45: '🌫️', 48: '🌫️', 51: '🌧️', 53: '🌧️', 55: '🌧️',
      61: '🌧️', 63: '🌧️', 65: '🌧️', 71: '❄️', 73: '❄️', 75: '❄️',
      80: '🌧️', 81: '🌧️', 82: '🌧️', 95: '🌩️', 96: '🌩️'
    };

    const weatherDescriptions = {
      0: 'Clear Skies', 1: 'Mainly Clear', 2: 'Partly Cloudy', 3: 'Overcast',
      45: 'Foggy', 48: 'Depositing Rime Fog', 51: 'Light Drizzle', 53: 'Moderate Drizzle',
      55: 'Dense Drizzle', 61: 'Slight Rain', 63: 'Moderate Rain', 65: 'Heavy Rain',
      71: 'Slight Snow', 73: 'Moderate Snow', 75: 'Heavy Snow',
      80: 'Rain Showers', 81: 'Moderate Showers', 82: 'Violent Showers', 95: 'Thunderstorm'
    };

    function cToF(c) { return Math.round((c * 9/5) + 32); }
    function formatTemp(c) { return unit === 'F' ? `${cToF(c)}°F` : `${Math.round(c)}°C`; }
    function mmToInches(mm) { return (mm * 0.0393701).toFixed(2); }

    // Fetch Active Weather Alerts from NWS (US locations)
    async function fetchAlerts(lat, lon) {
      try {
        const res = await fetch(`https://api.weather.gov/alerts/active?point=${lat.toFixed(4)},${lon.toFixed(4)}`);
        if (!res.ok) return [];
        const data = await res.json();
        if (data.features && data.features.length > 0) {
          return data.features.map(f => ({
            event: f.properties.event,
            headline: f.properties.headline || f.properties.event,
            severity: f.properties.severity
          }));
        }
      } catch (e) {
        console.warn("Alerts API unavailable for this point.", e);
      }
      return [];
    }

    async function loadWeather(city) {
      currentCity = city;
      document.getElementById('cityInput').value = city;
      document.getElementById('mainContent').innerHTML = '<div style="text-align:center; margin-top:20px; font-weight:bold;">Fetching weather report...</div>';

      try {
        // Geocoding
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          throw new Error("Location not found");
        }

        const loc = geoData.results[0];
        const lat = loc.latitude;
        const lon = loc.longitude;
        currentCity = `${loc.name}${loc.admin1 ? ', ' + loc.admin1 : ''}`;
        document.getElementById('cityInput').value = currentCity;

        // Fetch Weather & Alerts in parallel
        const [wRes, alerts] = await Promise.all([
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,weather_code,cloud_cover,pressure_msl,surface_pressure,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,surface_pressure,cloud_cover,wind_speed_10m,uv_index&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,sunrise,sunset,uv_index_max,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=auto`),
          fetchAlerts(lat, lon)
        ]);

        weatherData = await wRes.json();
        activeAlerts = alerts;

      } catch (err) {
        console.warn("API request failed, loading simulated data.", err);
        weatherData = generateFallbackData();
        activeAlerts = [];
      }

      renderTab();
    }

    function renderTab() {
      if (!weatherData) return;
      const content = document.getElementById('mainContent');
      
      // Cleanup existing chart if present
      if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
      }

      const cur = weatherData.current || {};
      const code = cur.weather_code || 0;
      const icon = weatherIcons[code] || '🌡️';
      const desc = weatherDescriptions[code] || 'Fair Conditions';

      // Conditional Alerts HTML: ONLY rendered if active alerts exist
      let alertsHtml = '';
      if (activeAlerts && activeAlerts.length > 0) {
        alertsHtml = activeAlerts.map(a => `
          <div class="alert-banner">
            ⚠️ <span><strong>${a.event}:</strong> ${a.headline}</span>
          </div>
        `).join('');
      }

      if (activeTab === 'current') {
        const dailyMax = weatherData.daily ? weatherData.daily.temperature_2m_max[0] : cur.temperature_2m;
        const dailyMin = weatherData.daily ? weatherData.daily.temperature_2m_min[0] : cur.temperature_2m;
        const uvMax = weatherData.daily ? weatherData.daily.uv_index_max[0] : 'N/A';
        const precipProb = weatherData.daily ? weatherData.daily.precipitation_probability_max[0] : 0;
        const sunrise = weatherData.daily ? weatherData.daily.sunrise[0].split('T')[1] : 'N/A';
        const sunset = weatherData.daily ? weatherData.daily.sunset[0].split('T')[1] : 'N/A';

        content.innerHTML = `
          ${alertsHtml}

          <div class="weather-hero">
            <div>
              <div style="font-size: 11px; text-transform: uppercase;">${currentCity}</div>
              <div class="hero-temp">${formatTemp(cur.temperature_2m)}</div>
              <div class="hero-sub">Feels like: ${formatTemp(cur.apparent_temperature)} | H: ${formatTemp(dailyMax)} L: ${formatTemp(dailyMin)}</div>
              <div class="hero-condition">${desc}</div>
            </div>
            <div class="hero-icon">${icon}</div>
          </div>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Humidity</div>
              <div class="stat-value">${cur.relative_humidity_2m}%</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Wind Speed</div>
              <div class="stat-value">${cur.wind_speed_10m} mph</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Precip Chance</div>
              <div class="stat-value">${precipProb}%</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">UV Index (Max)</div>
              <div class="stat-value">${uvMax}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Barometer</div>
              <div class="stat-value">${cur.pressure_msl || cur.surface_pressure} hPa</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Cloud Cover</div>
              <div class="stat-value">${cur.cloud_cover}%</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Sunrise</div>
              <div class="stat-value">${sunrise}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Sunset</div>
              <div class="stat-value">${sunset}</div>
            </div>
          </div>

          <div class="status-footer">Data updated: ${new Date().toLocaleTimeString()} · Source: Open-Meteo & NWS</div>
        `;
      } else if (activeTab === 'hourly') {
        const hourly = weatherData.hourly || { time: [], temperature_2m: [], precipitation_probability: [], weather_code: [] };
        
        const cards = hourly.time.slice(0, 12).map((t, idx) => `
          <div class="forecast-card">
            <div>${t.split('T')[1].substring(0, 5)}</div>
            <div class="icon">${weatherIcons[hourly.weather_code[idx]] || '🌤️'}</div>
            <div style="font-weight:bold;">${formatTemp(hourly.temperature_2m[idx])}</div>
            <div style="color: blue; font-size: 10px;">☔ ${hourly.precipitation_probability[idx]}%</div>
          </div>
        `).join('');

        content.innerHTML = `
          ${alertsHtml}
          <h4 style="margin-bottom: 6px; color: var(--win-blue);">24-Hour Temperature & Rain Trend — ${currentCity}</h4>
          <div class="forecast-row">${cards}</div>
          <div class="chart-box">
            <canvas id="hourlyChart"></canvas>
          </div>
        `;

        renderHourlyChart(hourly);
      } else if (activeTab === 'daily') {
        const daily = weatherData.daily || { time: [], temperature_2m_max: [], temperature_2m_min: [], precipitation_probability_max: [], weather_code: [] };
        
        const cards = daily.time.map((d, idx) => `
          <div class="forecast-card" style="flex:1;">
            <div style="font-weight:bold;">${d.substring(5)}</div>
            <div class="icon">${weatherIcons[daily.weather_code[idx]] || '☀️'}</div>
            <div style="color: red; font-weight:bold;">H: ${formatTemp(daily.temperature_2m_max[idx])}</div>
            <div style="color: blue;">L: ${formatTemp(daily.temperature_2m_min[idx])}</div>
            <div style="font-size:10px; color: green; margin-top:2px;">☔ ${daily.precipitation_probability_max[idx]}%</div>
          </div>
        `).join('');

        content.innerHTML = `
          ${alertsHtml}
          <h4 style="margin-bottom: 6px; color: var(--win-blue);">5-Day Extended Outlook — ${currentCity}</h4>
          <div class="forecast-row">${cards}</div>
          <div class="chart-box">
            <canvas id="dailyChart"></canvas>
          </div>
        `;

        renderDailyChart(daily);
      } else if (activeTab === 'radar') {
        const hourly = weatherData.hourly || { time: [], precipitation: [] };
        
        content.innerHTML = `
          ${alertsHtml}
          <h4 style="margin-bottom: 6px; color: var(--win-blue);">Live Doppler Simulation & Precipitation Amounts</h4>
          <div class="radar-box">
            <div class="radar-grid"></div>
            <div class="radar-sweep"></div>
            <div style="position: absolute; color: #00ff00; font-family: monospace; font-size: 11px; top: 6px; left: 6px;">RADAR: ACTIVE (NWS FEED)</div>
          </div>
          <div class="chart-box">
            <canvas id="precipChart"></canvas>
          </div>
        `;

        renderPrecipChart(hourly);
      }
    }

    // Chart.js Generators
    function renderHourlyChart(hourly) {
      const ctx = document.getElementById('hourlyChart').getContext('2d');
      const labels = hourly.time.slice(0, 24).map(t => t.split('T')[1].substring(0, 5));
      const temps = hourly.temperature_2m.slice(0, 24).map(t => unit === 'F' ? cToF(t) : t);
      const precips = hourly.precipitation_probability.slice(0, 24);

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: `Temp (°${unit})`,
              data: temps,
              borderColor: '#000080',
              backgroundColor: 'rgba(0, 0, 128, 0.1)',
              yAxisID: 'y',
              tension: 0.3
            },
            {
              label: 'Precip Probability (%)',
              data: precips,
              borderColor: '#008000',
              backgroundColor: 'rgba(0, 128, 0, 0.2)',
              type: 'bar',
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { type: 'linear', position: 'left', title: { display: true, text: `Temp (°${unit})` } },
            y1: { type: 'linear', position: 'right', min: 0, max: 100, title: { display: true, text: 'Rain %' }, grid: { drawOnChartArea: false } }
          }
        }
      });
    }

    function renderDailyChart(daily) {
      const ctx = document.getElementById('dailyChart').getContext('2d');
      const maxs = daily.temperature_2m_max.map(t => unit === 'F' ? cToF(t) : t);
      const mins = daily.temperature_2m_min.map(t => unit === 'F' ? cToF(t) : t);

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: daily.time,
          datasets: [
            {
              label: `High (°${unit})`,
              data: maxs,
              borderColor: '#cc0000',
              backgroundColor: '#cc0000',
              tension: 0.2
            },
            {
              label: `Low (°${unit})`,
              data: mins,
              borderColor: '#0000cc',
              backgroundColor: '#0000cc',
              tension: 0.2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false
        }
      });
    }

    function renderPrecipChart(hourly) {
      const ctx = document.getElementById('precipChart').getContext('2d');
      const labels = hourly.time.slice(0, 24).map(t => t.split('T')[1].substring(0, 5));
      const precips = hourly.precipitation ? hourly.precipitation.slice(0, 24) : [];

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Precipitation Amount (mm)',
            data: precips,
            backgroundColor: '#008080'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, title: { display: true, text: 'Precipitation (mm)' } }
          }
        }
      });
    }

    function generateFallbackData() {
      return {
        current: { temperature_2m: 21, apparent_temperature: 20, relative_humidity_2m: 55, wind_speed_10m: 10, weather_code: 1, cloud_cover: 20, pressure_msl: 1013 },
        daily: {
          time: ['Today', 'Tomorrow', 'Day 3', 'Day 4', 'Day 5'],
          temperature_2m_max: [22, 24, 20, 19, 23],
          temperature_2m_min: [14, 15, 12, 11, 14],
          precipitation_probability_max: [10, 40, 80, 20, 5],
          weather_code: [0, 1, 61, 2, 0],
          uv_index_max: [6.2, 5.8, 2.1, 6.5, 7.0],
          sunrise: ['2026-09-10T06:30', '2026-09-11T06:31', '2026-09-12T06:32', '2026-09-13T06:33', '2026-09-14T06:34'],
          sunset: ['2026-09-10T19:15', '2026-09-11T19:13', '2026-09-12T19:11', '2026-09-13T19:09', '2026-09-14T19:07']
        },
        hourly: {
          time: Array.from({length: 24}, (_, i) => `2026-09-10T${String(i).padStart(2,'0')}:00`),
          temperature_2m: Array.from({length: 24}, () => 16 + Math.random() * 8),
          precipitation_probability: Array.from({length: 24}, () => Math.floor(Math.random() * 50)),
          precipitation: Array.from({length: 24}, () => Math.random() * 2),
          weather_code: Array.from({length: 24}, () => 1)
        }
      };
    }

    // IP Geolocation Boot
    async function initLocalWeather() {
      try {
        const ipRes = await fetch('https://get.geojs.io/v1/ip/geo.json');
        const ipData = await ipRes.json();
        const city = ipData.city || '';
        const region = ipData.region || '';
        const detectedLoc = region ? `${city}, ${region}` : city;

        if (detectedLoc) {
          loadWeather(detectedLoc);
        } else {
          throw new Error("Could not parse location from IP");
        }
      } catch (err) {
        console.warn("IP Geolocation failed, using default location.", err);
        loadWeather('New York, NY');
      }
    }

    // Event Listeners
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        renderTab();
      });
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
      const val = document.getElementById('cityInput').value.trim();
      if (val) loadWeather(val);
    });

    document.getElementById('cityInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = document.getElementById('cityInput').value.trim();
        if (val) loadWeather(val);
      }
    });

    document.getElementById('presetSelect').addEventListener('change', (e) => {
      if (e.target.value) loadWeather(e.target.value);
    });

    document.getElementById('unitBtn').addEventListener('click', () => {
      unit = unit === 'F' ? 'C' : 'F';
      renderTab();
    });

    // Boot Up
    initLocalWeather();
  </script>
</body>
</html>
