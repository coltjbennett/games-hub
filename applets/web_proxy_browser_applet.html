<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Proxy Applet</title>
  
  <script type="module" src="https://unpkg.com/x-frame-bypass"></script>
  
  <style>
    :root {
      --win-bg: #c0c0c0;
      --win-blue: #000080;
      --win-text-dark: #000000;
      --win-text-light: #ffffff;
      --win-border-light: #ffffff;
      --win-border-dark: #808080;
      --win-border-darker: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0;
      font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      background-color: var(--win-bg);
      overflow: hidden;
      cursor: default;
      user-select: none;
    }

    /* Main Window Shell */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--win-bg);
      color: var(--win-text-dark);
      /* Base border removed so it fits cleanly in an iframe wrapper */
    }

    /* Title Bar */
    .panel-title-bar {
      background: var(--win-blue);
      color: var(--win-text-light);
      font-size: 13px;
      font-weight: bold;
      padding: 3px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-title-bar .win-btns {
      display: inline-flex;
      gap: 2px;
    }

    button.win-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      width: 16px;
      height: 14px;
      background: var(--win-bg);
      border-top: 1px solid var(--win-border-light);
      border-left: 1px solid var(--win-border-light);
      border-right: 1px solid var(--win-border-darker);
      border-bottom: 1px solid var(--win-border-darker);
      box-shadow: inset -1px -1px 0 var(--win-border-dark), inset 1px 1px 0 #dfdfdf;
      font-size: 9px;
      font-weight: bold;
      color: var(--win-text-dark);
      cursor: pointer;
    }
    button.win-btn:active {
      border-top: 1px solid var(--win-border-darker);
      border-left: 1px solid var(--win-border-darker);
      border-right: 1px solid var(--win-border-light);
      border-bottom: 1px solid var(--win-border-light);
      box-shadow: inset 1px 1px 0 var(--win-border-dark);
      padding: 1px 0 0 1px;
    }

    /* Toolbar Area */
    .toolbar {
      padding: 6px;
      border-bottom: 1px solid var(--win-border-dark);
      box-shadow: 0 1px 0 var(--win-border-light);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .address-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .address-label {
      font-size: 12px;
      color: var(--win-text-dark);
    }

    .search-input {
      flex-grow: 1;
      background: var(--win-text-light);
      border-top: 1px solid var(--win-border-darker);
      border-left: 1px solid var(--win-border-darker);
      border-right: 1px solid var(--win-border-light);
      border-bottom: 1px solid var(--win-border-light);
      box-shadow: inset 1px 1px 0 var(--win-border-dark);
      padding: 3px 5px;
      font-size: 13px;
      color: var(--win-text-dark);
      outline: none;
      user-select: text;
    }
    .search-input:focus {
      background: #ffffff;
    }

    .win95-btn {
      background-color: var(--win-bg);
      color: var(--win-text-dark);
      font-size: 12px;
      padding: 2px 10px;
      border-top: 1px solid var(--win-border-light);
      border-left: 1px solid var(--win-border-light);
      border-right: 1px solid var(--win-border-darker);
      border-bottom: 1px solid var(--win-border-darker);
      box-shadow: inset -1px -1px 0 var(--win-border-dark), inset 1px 1px 0 #dfdfdf;
      cursor: pointer;
    }
    .win95-btn:active {
      border-top: 1px solid var(--win-border-darker);
      border-left: 1px solid var(--win-border-darker);
      border-right: 1px solid var(--win-border-light);
      border-bottom: 1px solid var(--win-border-light);
      box-shadow: inset 1px 1px 0 var(--win-border-dark);
      padding: 3px 9px 1px 11px;
    }

    /* Content Area */
    .viewport-container {
      flex-grow: 1;
      position: relative;
      border-top: 2px solid var(--win-border-dark);
      border-left: 2px solid var(--win-border-dark);
      border-right: 2px solid var(--win-border-light);
      border-bottom: 2px solid var(--win-border-light);
      background-color: var(--win-text-light);
      overflow: hidden;
      margin: 4px;
    }

    #proxy-frame {
      width: 100%;
      height: 100%;
      border: none;
      background-color: var(--win-text-light);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(192, 192, 192, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .dialog-box {
      background: var(--win-bg);
      border-top: 2px solid var(--win-border-light);
      border-left: 2px solid var(--win-border-light);
      border-right: 2px solid var(--win-border-darker);
      border-bottom: 2px solid var(--win-border-darker);
      box-shadow: inset -1px -1px 0 var(--win-border-dark), 2px 2px 5px rgba(0,0,0,0.5);
      width: 320px;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .dialog-title {
      background: var(--win-blue);
      color: var(--win-text-light);
      padding: 3px 6px;
      font-size: 12px;
      font-weight: bold;
    }

    .dialog-content {
      padding: 15px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Fake Windows 95 Progress Bar */
    .progress-bar-container {
      width: 100%;
      height: 18px;
      border-top: 1px solid var(--win-border-darker);
      border-left: 1px solid var(--win-border-darker);
      border-right: 1px solid var(--win-border-light);
      border-bottom: 1px solid var(--win-border-light);
      background: var(--win-text-light);
      padding: 1px;
      display: flex;
      gap: 2px;
      overflow: hidden;
    }
    
    .progress-block {
      width: 10px;
      height: 100%;
      background-color: var(--win-blue);
      animation: progress-blink 1s infinite alternate;
    }

    @keyframes progress-blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .error-text {
      color: #cc0000;
      font-weight: bold;
    }

    .fallback-link {
      color: var(--win-blue);
      text-decoration: underline;
      cursor: pointer;
      word-break: break-all;
    }

    .dialog-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    /* Status Bar */
    .status-bar {
      height: 22px;
      border-top: 1px solid var(--win-border-light);
      display: flex;
      padding: 2px;
      gap: 2px;
    }

    .status-pane {
      border-top: 1px solid var(--win-border-dark);
      border-left: 1px solid var(--win-border-dark);
      border-right: 1px solid var(--win-border-light);
      border-bottom: 1px solid var(--win-border-light);
      padding: 2px 6px;
      font-size: 11px;
      display: flex;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-pane-main {
      flex-grow: 1;
    }
    
    .status-pane-icon {
      width: 80px;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    
    <div class="panel-title-bar">
      <span>Internet Explorer - Web Proxy</span>
      <span class="win-btns">
        <button type="button" class="win-btn" aria-label="Minimize">_</button>
        <button type="button" class="win-btn" aria-label="Maximize">□</button>
        <button type="button" class="win-btn" aria-label="Close">✕</button>
      </span>
    </div>
    
    <div class="toolbar">
      <div class="address-bar">
        <span class="address-label"><u>A</u>ddress:</span>
        <input type="text" id="url-input" class="search-input" placeholder="http://..." value="https://example.com" autocomplete="off" />
        <button type="button" id="go-btn" class="win95-btn">Go</button>
      </div>
    </div>
    
    <div class="viewport-container">
      
      <!-- The x-frame-bypass component intercepts this iframe's loading -->
      <iframe id="proxy-frame" is="x-frame-bypass" src="about:blank"></iframe>
      
      <div id="loading-overlay" class="overlay">
        <div class="dialog-box">
          <div class="dialog-title">Downloading...</div>
          <div class="dialog-content">
            <span id="loading-text">Connecting to site...</span>
            <div class="progress-bar-container" id="progress-container">
              <!-- Blocks generated via JS to look like Win95 -->
            </div>
            <div class="dialog-buttons">
              <button type="button" class="win95-btn" id="cancel-load-btn">Cancel</button>
            </div>
          </div>
        </div>
      </div>

      <div id="error-overlay" class="overlay">
        <div class="dialog-box">
          <div class="dialog-title">Navigation Canceled</div>
          <div class="dialog-content">
            <span class="error-text">The proxy server timed out or the site refused to connect.</span>
            <span>Some websites use advanced protections against proxying. You can try opening this link directly outside of the iframe:</span>
            <a id="fallback-link" class="fallback-link" href="#" target="_blank"></a>
            <div class="dialog-buttons">
              <button type="button" class="win95-btn" id="close-error-btn">OK</button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div class="status-bar">
      <div class="status-pane status-pane-main" id="status-text">Done</div>
      <div class="status-pane status-pane-icon">My Computer</div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlInput = document.getElementById('url-input');
      const goBtn = document.getElementById('go-btn');
      const proxyFrame = document.getElementById('proxy-frame');
      
      // UI Elements
      const loadingOverlay = document.getElementById('loading-overlay');
      const loadingText = document.getElementById('loading-text');
      const progressContainer = document.getElementById('progress-container');
      const cancelBtn = document.getElementById('cancel-load-btn');
      
      const errorOverlay = document.getElementById('error-overlay');
      const fallbackLink = document.getElementById('fallback-link');
      const closeErrorBtn = document.getElementById('close-error-btn');
      
      const statusText = document.getElementById('status-text');

      let timeoutId = null;
      let progressInterval = null;

      // Generates the little blue blocks for the Win95 progress bar
      const renderProgressBar = () => {
        progressContainer.innerHTML = '';
        let blocks = 0;
        clearInterval(progressInterval);
        progressInterval = setInterval(() => {
          if (blocks < 25) {
            const block = document.createElement('div');
            block.className = 'progress-block';
            progressContainer.appendChild(block);
            blocks++;
          }
        }, 300); // Add a block every 300ms
      };

      const resetUI = () => {
        clearTimeout(timeoutId);
        clearInterval(progressInterval);
        loadingOverlay.style.display = 'none';
        errorOverlay.style.display = 'none';
      };

      const showError = (url) => {
        resetUI();
        statusText.textContent = "Error loading page.";
        fallbackLink.href = url;
        fallbackLink.textContent = url;
        errorOverlay.style.display = 'flex';
      };

      const navigate = () => {
        let targetUrl = urlInput.value.trim();
        if (!targetUrl) return;

        // Auto format URL
        if (!/^https?:\/\//i.test(targetUrl)) {
          targetUrl = 'https://' + targetUrl;
          urlInput.value = targetUrl;
        }

        resetUI();

        // Show loading state
        loadingOverlay.style.display = 'flex';
        loadingText.textContent = `Connecting to ${targetUrl}...`;
        statusText.textContent = `Opening page ${targetUrl}...`;
        renderProgressBar();

        // Trigger the custom element to fetch
        proxyFrame.src = targetUrl;

        // Fallback timeout: If the iframe takes longer than 15 seconds, assume failure
        // (Public CORS proxies frequently drop connections on complex sites)
        timeoutId = setTimeout(() => {
          showError(targetUrl);
        }, 15000);
      };

      // Listen for the iframe completing its load
      proxyFrame.addEventListener('load', () => {
        // Only trigger if we were actually waiting for something (ignoring about:blank)
        if (loadingOverlay.style.display === 'flex') {
          resetUI();
          statusText.textContent = "Done";
        }
      });

      // Events
      goBtn.addEventListener('click', navigate);
      urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') navigate();
      });

      cancelBtn.addEventListener('click', () => {
        resetUI();
        proxyFrame.src = "about:blank";
        statusText.textContent = "Navigation canceled.";
      });

      closeErrorBtn.addEventListener('click', () => {
        errorOverlay.style.display = 'none';
        statusText.textContent = "Done";
      });
      
      // Load initial default site purely for demo purposes
      navigate();
    });
  </script>
</body>
</html>
