<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Proxy Applet</title>
  
  
  <style>
    :root {
      --win-bg: #c0c0c0;
      --win-blue: #000080;
      --win-text-dark: #000000;
      --win-text-light: #ffffff;
      --win-border-light: #ffffff;
      --win-border-dark: #808080;
      --win-border-darker: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0;
      font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      background-color: var(--win-bg);
      overflow: hidden;
      cursor: default;
      user-select: none;
    }

    /* Main Window Shell */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--win-bg);
      color: var(--win-text-dark);
      /* Base border removed so it fits cleanly in an iframe wrapper */
    }

    /* Title Bar */
    .panel-title-bar {
      background: var(--win-blue);
      color: var(--win-text-light);
      font-size: 13px;
      font-weight: bold;
      padding: 3px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-title-bar .win-btns {
      display: inline-flex;
      gap: 2px;
    }

    button.win-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      width: 16px;
      height: 14px;
      background: var(--win-bg);
      border-top: 1px solid var(--win-border-light);
      border-left: 1px solid var(--win-border-light);
      border-right: 1px solid var(--win-border-darker);
      border-bottom: 1px solid var(--win-border-darker);
      box-shadow: inset -1px -1px 0 var(--win-border-dark), inset 1px 1px 0 #dfdfdf;
      font-size: 9px;
      font-weight: bold;
      color: var(--win-text-dark);
      cursor: pointer;
    }
    button.win-btn:active {
      border-top: 1px solid var(--win-border-darker);
      border-left: 1px solid var(--win-border-darker);
      border-right: 1px solid var(--win-border-light);
      border-bottom: 1px solid var(--win-border-light);
      box-shadow: inset 1px 1px 0 var(--win-border-dark);
      padding: 1px 0 0 1px;
    }

    /* Toolbar Area */
    .toolbar {
      padding: 6px;
      border-bottom: 1px solid var(--win-border-dark);
      box-shadow: 0 1px 0 var(--win-border-light);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .address-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .address-bar .search-input {
      min-width: 120px;
    }

    .address-label {
      font-size: 12px;
      color: var(--win-text-dark);
    }

    .search-input {
      flex-grow: 1;
      background: var(--win-text-light);
      border-top: 1px solid var(--win-border-darker);
      border-left: 1px solid var(--win-border-darker);
      border-right: 1px solid var(--win-border-light);
      border-bottom: 1px solid var(--win-border-light);
      box-shadow: inset 1px 1px 0 var(--win-border-dark);
      padding: 3px 5px;
      font-size: 13px;
      color: var(--win-text-dark);
      outline: none;
      user-select: text;
    }
    .search-input:focus {
      background: #ffffff;
    }

    .win95-btn {
      background-color: var(--win-bg);
      color: var(--win-text-dark);
      font-size: 12px;
      padding: 2px 10px;
      border-top: 1px solid var(--win-border-light);
      border-left: 1px solid var(--win-border-light);
      border-right: 1px solid var(--win-border-darker);
      border-bottom: 1px solid var(--win-border-darker);
      box-shadow: inset -1px -1px 0 var(--win-border-dark), inset 1px 1px 0 #dfdfdf;
      cursor: pointer;
    }
    .win95-btn:active {
      border-top: 1px solid var(--win-border-darker);
      border-left: 1px solid var(--win-border-darker);
      border-right: 1px solid var(--win-border-light);
      border-bottom: 1px solid var(--win-border-light);
      box-shadow: inset 1px 1px 0 var(--win-border-dark);
      padding: 3px 9px 1px 11px;
    }

    /* Content Area */
    .viewport-container {
      flex-grow: 1;
      position: relative;
      border-top: 2px solid var(--win-border-dark);
      border-left: 2px solid var(--win-border-dark);
      border-right: 2px solid var(--win-border-light);
      border-bottom: 2px solid var(--win-border-light);
      background-color: var(--win-text-light);
      overflow: hidden;
      margin: 4px;
    }

    #proxy-frame {
      width: 100%;
      height: 100%;
      border: none;
      background-color: var(--win-text-light);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(192, 192, 192, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .dialog-box {
      background: var(--win-bg);
      border-top: 2px solid var(--win-border-light);
      border-left: 2px solid var(--win-border-light);
      border-right: 2px solid var(--win-border-darker);
      border-bottom: 2px solid var(--win-border-darker);
      box-shadow: inset -1px -1px 0 var(--win-border-dark), 2px 2px 5px rgba(0,0,0,0.5);
      width: 320px;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .dialog-title {
      background: var(--win-blue);
      color: var(--win-text-light);
      padding: 3px 6px;
      font-size: 12px;
      font-weight: bold;
    }

    .dialog-content {
      padding: 15px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Fake Windows 95 Progress Bar */
    .progress-bar-container {
      width: 100%;
      height: 18px;
      border-top: 1px solid var(--win-border-darker);
      border-left: 1px solid var(--win-border-darker);
      border-right: 1px solid var(--win-border-light);
      border-bottom: 1px solid var(--win-border-light);
      background: var(--win-text-light);
      padding: 1px;
      display: flex;
      gap: 2px;
      overflow: hidden;
    }
    
    .progress-block {
      width: 10px;
      height: 100%;
      background-color: var(--win-blue);
      animation: progress-blink 1s infinite alternate;
    }

    @keyframes progress-blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .error-text {
      color: #cc0000;
      font-weight: bold;
    }

    .fallback-link {
      color: var(--win-blue);
      text-decoration: underline;
      cursor: pointer;
      word-break: break-all;
    }

    .dialog-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    /* Status Bar */
    .status-bar {
      height: 22px;
      border-top: 1px solid var(--win-border-light);
      display: flex;
      padding: 2px;
      gap: 2px;
    }

    .status-pane {
      border-top: 1px solid var(--win-border-dark);
      border-left: 1px solid var(--win-border-dark);
      border-right: 1px solid var(--win-border-light);
      border-bottom: 1px solid var(--win-border-light);
      padding: 2px 6px;
      font-size: 11px;
      display: flex;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-pane-main {
      flex-grow: 1;
    }
    
    .status-pane-icon {
      width: 80px;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    
    <div class="panel-title-bar">
      <span>Internet Explorer - Web Proxy</span>
      <span class="win-btns">
        <button type="button" class="win-btn" aria-label="Minimize">_</button>
        <button type="button" class="win-btn" aria-label="Maximize">□</button>
        <button type="button" class="win-btn" aria-label="Close">✕</button>
      </span>
    </div>
    
    <div class="toolbar">
      <div class="address-bar">
        <span class="address-label"><u>A</u>ddress:</span>
        <input type="text" id="url-input" class="search-input" placeholder="http://..." value="https://example.com" autocomplete="off" />
        <button type="button" id="go-btn" class="win95-btn">Go</button>
        <button type="button" id="direct-btn" class="win95-btn" title="Open the address in a normal browser tab">Open Direct</button>
      </div>
    </div>
    
    <div class="viewport-container">
      
      <!-- Remote pages are sandboxed so proxied page scripts cannot access this applet. -->
      <iframe id="proxy-frame" title="Proxied webpage" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals allow-pointer-lock allow-presentation" src="about:blank"></iframe>
      
      <div id="loading-overlay" class="overlay">
        <div class="dialog-box">
          <div class="dialog-title">Downloading...</div>
          <div class="dialog-content">
            <span id="loading-text">Connecting to site...</span>
            <div class="progress-bar-container" id="progress-container">
              <!-- Blocks generated via JS to look like Win95 -->
            </div>
            <div class="dialog-buttons">
              <button type="button" class="win95-btn" id="cancel-load-btn">Cancel</button>
            </div>
          </div>
        </div>
      </div>

      <div id="error-overlay" class="overlay">
        <div class="dialog-box">
          <div class="dialog-title">Navigation Canceled</div>
          <div class="dialog-content">
            <span class="error-text" id="error-summary">The page could not be loaded through the available public proxies.</span>
            <span id="error-detail">Some websites block proxy traffic, require cookies, or use features that cannot run inside an embedded page.</span>
            <a id="fallback-link" class="fallback-link" href="#" target="_blank" rel="noopener noreferrer"></a>
            <div class="dialog-buttons">
              <button type="button" class="win95-btn" id="open-error-direct-btn">Open Directly</button>
              <button type="button" class="win95-btn" id="close-error-btn">OK</button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div class="status-bar">
      <div class="status-pane status-pane-main" id="status-text">Done</div>
      <div class="status-pane status-pane-icon">My Computer</div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlInput = document.getElementById('url-input');
      const goBtn = document.getElementById('go-btn');
      const directBtn = document.getElementById('direct-btn');
      const proxyFrame = document.getElementById('proxy-frame');

      const loadingOverlay = document.getElementById('loading-overlay');
      const loadingText = document.getElementById('loading-text');
      const progressContainer = document.getElementById('progress-container');
      const cancelBtn = document.getElementById('cancel-load-btn');
      const errorOverlay = document.getElementById('error-overlay');
      const errorSummary = document.getElementById('error-summary');
      const errorDetail = document.getElementById('error-detail');
      const fallbackLink = document.getElementById('fallback-link');
      const openErrorDirectBtn = document.getElementById('open-error-direct-btn');
      const closeErrorBtn = document.getElementById('close-error-btn');
      const statusText = document.getElementById('status-text');

      // Public proxies are fallbacks, not guaranteed infrastructure. Each one
      // may be rate-limited or block a particular origin, so try them in turn.
      const PROXIES = [
        {
          name: 'CORS.dev',
          url: target => 'https://proxy.cors.dev/' + target
        },
        {
          name: 'AllOrigins',
          url: target => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(target)
        },
        {
          name: 'CodeTabs',
          url: target => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(target)
        }
      ];
      const PROXY_TIMEOUT_MS = 8500;

      let activeController = null;
      let progressInterval = null;
      let navigationToken = 0;
      let lastTargetUrl = 'https://example.com/';

      const renderProgressBar = () => {
        progressContainer.innerHTML = '';
        let blocks = 0;
        clearInterval(progressInterval);
        progressInterval = setInterval(() => {
          if (blocks < 25) {
            const block = document.createElement('div');
            block.className = 'progress-block';
            progressContainer.appendChild(block);
            blocks++;
          }
        }, 180);
      };

      const resetUI = () => {
        clearInterval(progressInterval);
        progressInterval = null;
        loadingOverlay.style.display = 'none';
        errorOverlay.style.display = 'none';
      };

      const cancelActiveRequest = () => {
        if (activeController) {
          activeController.abort();
          activeController = null;
        }
      };

      const normaliseUrl = raw => {
        let value = String(raw || '').trim();
        if (!value) throw new Error('Enter a website address first.');
        if (!/^https?:\/\//i.test(value)) value = 'https://' + value;

        const parsed = new URL(value);
        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
          throw new Error('Only HTTP and HTTPS pages are allowed.');
        }
        if (parsed.username || parsed.password) {
          throw new Error('URLs containing embedded credentials are blocked.');
        }
        return parsed.href;
      };

      const showError = (url, summary, detail) => {
        resetUI();
        errorSummary.textContent = summary || 'The page could not be loaded through the available public proxies.';
        errorDetail.textContent = detail || 'This site may block proxy traffic or depend on browser features that a proxy cannot reproduce.';
        fallbackLink.href = url;
        fallbackLink.textContent = url;
        fallbackLink.rel = 'noopener noreferrer';
        errorOverlay.style.display = 'flex';
        statusText.textContent = 'Unable to load through proxy.';
      };

      const escapeAttribute = value => String(value)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // The proxied HTML lives in an opaque-origin sandbox. Its bridge can
      // request navigation via postMessage, but cannot read this applet's DOM.
      const makeBridgeScript = target => {
        const safeTarget = JSON.stringify(target).replace(/</g, '\\u003c');
        return `
<script>
(() => {
  const proxyTarget = ${safeTarget};
  const postToBrowser = (url, method = 'GET') => {
    try {
      const resolved = new URL(url, document.baseURI);
      if (resolved.protocol !== 'http:' && resolved.protocol !== 'https:') return;
      parent.postMessage({ __win95ProxyApplet: true, action: 'navigate', url: resolved.href, method }, '*');
    } catch (_) {}
  };
  document.addEventListener('click', event => {
    if (event.defaultPrevented || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    const link = event.target && event.target.closest ? event.target.closest('a[href]') : null;
    if (!link || link.hasAttribute('download')) return;
    const targetName = (link.getAttribute('target') || '').toLowerCase();
    if (targetName && targetName !== '_self') return;
    const rawHref = link.getAttribute('href');
    if (!rawHref || /^\s*javascript:/i.test(rawHref) || /^\s*mailto:/i.test(rawHref) || /^\s*tel:/i.test(rawHref)) return;
    let resolved;
    try { resolved = new URL(rawHref, document.baseURI); } catch (_) { return; }
    if (resolved.protocol !== 'http:' && resolved.protocol !== 'https:') return;
    const current = new URL(proxyTarget);
    if (resolved.origin === current.origin && resolved.pathname === current.pathname && resolved.search === current.search && resolved.hash) {
      event.preventDefault();
      const id = decodeURIComponent(resolved.hash.slice(1));
      const targetElement = document.getElementById(id) || document.getElementsByName(id)[0];
      if (targetElement && targetElement.scrollIntoView) targetElement.scrollIntoView();
      return;
    }
    event.preventDefault();
    postToBrowser(resolved.href, 'GET');
  }, true);
  document.addEventListener('submit', event => {
    const form = event.target;
    if (!form || !form.tagName || form.tagName.toLowerCase() !== 'form') return;
    const method = String(form.method || 'get').toUpperCase();
    let action;
    try { action = new URL(form.getAttribute('action') || proxyTarget, document.baseURI); } catch (_) { return; }
    if (method !== 'GET') {
      event.preventDefault();
      parent.postMessage({ __win95ProxyApplet: true, action: 'unsupported-form', method }, '*');
      return;
    }
    event.preventDefault();
    const params = new URLSearchParams(new FormData(form));
    for (const [key, value] of params.entries()) action.searchParams.append(key, value);
    postToBrowser(action.href, 'GET');
  }, true);
})();
<\/script>`;
      };

      const prepareDocument = (rawHtml, targetUrl) => {
        let page = String(rawHtml || '');
        // A remote CSP meta tag can block injected navigation handlers and
        // site assets. Response headers are not copied into srcdoc, so remove
        // only the equivalent meta directives and let the sandbox provide isolation.
        page = page.replace(/<meta\b[^>]*http-equiv\s*=\s*(['"]?)content-security-policy\1[^>]*>/gi, '');
        page = page.replace(/<meta\b[^>]*http-equiv\s*=\s*(['"]?)x-frame-options\1[^>]*>/gi, '');
        page = page.replace(/<base\b[^>]*>/gi, '');
        page = page.replace(/\s+crossorigin\s*=\s*(['"]).*?\1/gi, '');

        const injection = '<base href="' + escapeAttribute(targetUrl) + '">' + makeBridgeScript(targetUrl);
        if (/<head\b[^>]*>/i.test(page)) {
          page = page.replace(/<head\b[^>]*>/i, match => match + '\n' + injection + '\n');
        } else if (/<html\b[^>]*>/i.test(page)) {
          page = page.replace(/<html\b[^>]*>/i, match => match + '<head>' + injection + '</head>');
        } else {
          page = '<!doctype html><html><head>' + injection + '</head><body>' + page + '</body></html>';
        }
        return page;
      };

      const fetchThroughProxies = async (targetUrl, token) => {
        const failures = [];
        for (let index = 0; index < PROXIES.length; index++) {
          if (token !== navigationToken) throw new DOMException('Navigation canceled', 'AbortError');
          const proxy = PROXIES[index];
          loadingText.textContent = `Trying ${proxy.name} (${index + 1} of ${PROXIES.length})...`;
          statusText.textContent = `Contacting ${proxy.name}...`;
          const controller = new AbortController();
          activeController = controller;
          const timeoutId = setTimeout(() => controller.abort(), PROXY_TIMEOUT_MS);
          try {
            const response = await fetch(proxy.url(targetUrl), {
              method: 'GET',
              redirect: 'follow',
              credentials: 'omit',
              cache: 'no-store',
              headers: { 'Accept': 'text/html,application/xhtml+xml,text/plain;q=0.9,*/*;q=0.8' },
              signal: controller.signal
            });
            if (!response.ok) throw new Error(`${response.status} ${response.statusText || 'Proxy request failed'}`);
            const content = await response.text();
            if (!content.trim()) throw new Error('The proxy returned an empty page.');
            if (!/<(?:!doctype|html|head|body|script|title|main|div|article|svg)\b/i.test(content)) {
              throw new Error('The proxy returned a response that does not look like a webpage.');
            }
            return { html: content, proxyName: proxy.name };
          } catch (error) {
            if (token !== navigationToken) throw new DOMException('Navigation canceled', 'AbortError');
            const reason = error && error.name === 'AbortError'
              ? `timed out after ${Math.round(PROXY_TIMEOUT_MS / 1000)} seconds`
              : (error && error.message ? error.message : 'request failed');
            failures.push(`${proxy.name}: ${reason}`);
          } finally {
            clearTimeout(timeoutId);
            if (activeController === controller) activeController = null;
          }
        }
        throw new Error(failures.join(' | '));
      };

      const navigate = async explicitUrl => {
        let targetUrl;
        try {
          targetUrl = normaliseUrl(explicitUrl || urlInput.value);
        } catch (error) {
          showError(String(explicitUrl || urlInput.value || ''), 'That address is not valid.', error.message);
          return;
        }

        navigationToken++;
        const token = navigationToken;
        cancelActiveRequest();
        lastTargetUrl = targetUrl;
        urlInput.value = targetUrl;
        resetUI();
        loadingOverlay.style.display = 'flex';
        loadingText.textContent = 'Preparing to connect...';
        statusText.textContent = `Opening ${targetUrl}...`;
        renderProgressBar();

        try {
          const result = await fetchThroughProxies(targetUrl, token);
          if (token !== navigationToken) return;
          proxyFrame.srcdoc = prepareDocument(result.html, targetUrl);
          resetUI();
          statusText.textContent = `Loaded via ${result.proxyName}. Some site features may be unavailable.`;
        } catch (error) {
          if (token !== navigationToken || (error && error.name === 'AbortError')) return;
          showError(
            targetUrl,
            'None of the available public proxies could load this page.',
            `${error.message || 'The proxy requests failed.'} Sites with anti-bot protection, sign-in requirements, large pages, or complex JavaScript may not work inside this applet. Use Open Direct to load the site in a normal browser tab.`
          );
        }
      };

      const openDirect = rawUrl => {
        try {
          const targetUrl = normaliseUrl(rawUrl || urlInput.value || lastTargetUrl);
          window.open(targetUrl, '_blank', 'noopener,noreferrer');
          statusText.textContent = 'Opened in a separate browser tab (if pop-ups are allowed).';
        } catch (error) {
          showError(String(rawUrl || urlInput.value || ''), 'That address is not valid.', error.message);
        }
      };

      goBtn.addEventListener('click', () => navigate());
      directBtn.addEventListener('click', () => openDirect());
      urlInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') navigate();
      });

      cancelBtn.addEventListener('click', () => {
        navigationToken++;
        cancelActiveRequest();
        resetUI();
        proxyFrame.srcdoc = '<!doctype html><html><body style="font:13px Tahoma,Arial;padding:16px">Navigation canceled.</body></html>';
        statusText.textContent = 'Navigation canceled.';
      });

      closeErrorBtn.addEventListener('click', () => {
        errorOverlay.style.display = 'none';
        statusText.textContent = 'Ready.';
      });
      openErrorDirectBtn.addEventListener('click', () => openDirect(lastTargetUrl));

      window.addEventListener('message', event => {
        // Only accept requests from the applet's own sandboxed frame.
        if (event.source !== proxyFrame.contentWindow || !event.data || event.data.__win95ProxyApplet !== true) return;
        if (event.data.action === 'navigate') {
          if (event.data.method !== 'GET') {
            showError(lastTargetUrl, 'This form needs a request type the public proxies may not support.', 'Open the site directly in a separate browser tab to submit this form.');
            return;
          }
          try {
            const requestedUrl = new URL(event.data.url);
            if (requestedUrl.protocol !== 'http:' && requestedUrl.protocol !== 'https:') return;
            navigate(requestedUrl.href);
          } catch (_) {}
        } else if (event.data.action === 'unsupported-form') {
          showError(lastTargetUrl, 'This page submitted a form that uses ' + String(event.data.method || 'a non-GET method') + '.', 'Public browser proxies do not consistently support form submissions of this type. Open the site directly in a separate browser tab to continue.');
        }
      });

      navigate();
    });
  </script>
</body>
</html>
