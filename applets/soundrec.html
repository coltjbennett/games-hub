<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sound Recorder</title>
<link rel="stylesheet" href="w95.css">
<style>
  #w{padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
  #scope{width:100%;height:80px;background:#000;border:2px inset #808080}
  #time{font:20px "Courier New",monospace;background:#000;color:#0f0;padding:4px 8px;text-align:center}
  .row{display:flex;gap:6px;flex-wrap:wrap}.row button{flex:1}
  #rec.recording{color:#c00;font-weight:bold}
</style></head><body>
<div id="w">
  <div id="time">0.00 sec</div><canvas id="scope" width="400" height="80"></canvas>
  <div class="row"><button id="rec">● Record</button><button id="stop" disabled>■ Stop</button><button id="play" disabled>▶ Play</button></div>
  <div class="row"><button id="save" disabled>Save to My Documents…</button><button id="dl" disabled>Download</button></div>
  <audio id="au" controls style="width:100%" hidden></audio>
  <div id="msg" role="status">Click Record to capture sound from your microphone. Nothing leaves your computer.</div>
</div>
<script src="../vfs.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i);},FS=window.ColtonFS;
  var mr=null,chunks=[],blob=null,stream=null,an=null,raf=0,t0=0,ac=null,mime='',cv=$('scope'),g=cv.getContext('2d');
  function msg(t){$('msg').textContent=t;}
  function ext(){return /ogg/.test(mime)?'ogg':/mp4/.test(mime)?'m4a':'webm';}
  function tick(){
    var s=((performance.now()-t0)/1000).toFixed(2);$('time').textContent=s+' sec';
    if(an){var d=new Uint8Array(an.fftSize);an.getByteTimeDomainData(d);g.fillStyle='#000';g.fillRect(0,0,cv.width,cv.height);g.strokeStyle='#0f0';g.beginPath();for(var i=0;i<d.length;i+=4){var x=i/d.length*cv.width,y=d[i]/255*cv.height;i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}
    raf=requestAnimationFrame(tick);
  }
  $('rec').onclick=function(){
    if(!navigator.mediaDevices||!window.MediaRecorder){msg('Sound recording is not supported by this browser.');return;}
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      stream=s;chunks=[];blob=null;mime=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4','audio/webm'].filter(function(m){return MediaRecorder.isTypeSupported(m);})[0]||'';
      mr=new MediaRecorder(s,mime?{mimeType:mime}:undefined);mime=mr.mimeType||mime;
      mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
      mr.onstop=function(){blob=new Blob(chunks,{type:mime||'audio/webm'});stream.getTracks().forEach(function(t){t.stop();});cancelAnimationFrame(raf);an=null;
        ['play','save','dl'].forEach(function(i){$(i).disabled=false;});$('au').src=URL.createObjectURL(blob);msg('Recorded '+((blob.size/1024)|0)+' KB. You can play, save or download it.');$('rec').classList.remove('recording');$('rec').disabled=false;$('stop').disabled=true;};
      try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var src=ac.createMediaStreamSource(s);an=ac.createAnalyser();an.fftSize=1024;src.connect(an);}catch(e){}
      mr.start();t0=performance.now();tick();$('rec').classList.add('recording');$('rec').disabled=true;$('stop').disabled=false;['play','save','dl'].forEach(function(i){$(i).disabled=true;});msg('Recording...');
    }).catch(function(){msg('Microphone access was denied or no microphone was found.');});
  };
  $('stop').onclick=function(){if(mr&&mr.state!=='inactive')mr.stop();};
  $('play').onclick=function(){var a=$('au');a.hidden=false;a.play();};
  $('dl').onclick=function(){if(!blob)return;var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Sound.'+ext();a.click();};
  $('save').onclick=function(){if(!blob)return;FS.dialog({mode:'save',kind:'file',kinds:['file'],name:'Sound.'+ext(),title:'Save Sound As'}).then(function(r){if(!r)return;var nm=r.name;var p=r.meta?FS.write(r.meta.id,blob,{name:nm}):FS.create({parent:r.parent,name:nm,kind:'file',mime:blob.type,data:blob});p.then(function(m){msg('Saved '+m.name+'.');try{parent.GHShell.emit('soundrec:save');}catch(e){}});});};
})();
</script></body></html>
