<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Cross-Device Chat</title>
</head>
<body>
    <div id="username-screen">
        <h3>Enter Username</h3>
        <input type="text" id="username-input" placeholder="Choose a name..." />
        <button onclick="joinChat()">Join Chat</button>
    </div>

    <div id="chat-screen" style="display: none;">
        <h3 id="status">Connecting to global network...</h3>
        <div id="chat-box" style="border: 1px solid #000; height: 220px; width: 320px; overflow-y: scroll; margin-bottom: 5px;"></div>
        <input type="text" id="msg-input" placeholder="Type a message..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <!-- MQTT Client Library over WebSockets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <script>
        // Universal Room Channel Key
        const ROOM_TOPIC = "universal-public-chat-room-xyz123/messages";
        
        let client = null;
        let myUsername = "";
        let usedUsernames = new Set();
        let isConnected = false;

        const ui = {
            userScreen: document.getElementById("username-screen"),
            chatScreen: document.getElementById("chat-screen"),
            userIp: document.getElementById("username-input"),
            status: document.getElementById("status"),
            chatBox: document.getElementById("chat-box"),
            msgIp: document.getElementById("msg-input")
        };

        function appendChat(author, text) {
            ui.chatBox.innerHTML += `<div><b>${author}:</b> ${text}</div>`;
            ui.chatBox.scrollTop = ui.chatBox.scrollHeight;
        }

        function joinChat() {
            const val = ui.userIp.value.trim();
            if (!val) return alert("Username required!");
            myUsername = val;

            ui.userScreen.style.display = "none";
            ui.chatScreen.style.display = "block";

            // Connect to free public WebSockets broker (HiveMQ)
            client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

            client.on("connect", () => {
                isConnected = true;
                ui.status.innerText = `Connected as "${myUsername}"`;
                
                // Subscribe to the shared room topic
                client.subscribe(ROOM_TOPIC, (err) => {
                    if (!err) {
                        // Announce join event across all devices
                        publishMessage({ type: "JOIN", author: myUsername });
                    }
                });
            });

            client.on("message", (topic, payload) => {
                try {
                    const data = JSON.parse(payload.toString());

                    if (data.type === "JOIN") {
                        usedUsernames.add(data.author);
                        appendChat("SYSTEM", `${data.author} joined the room.`);
                    } 
                    else if (data.type === "MSG") {
                        appendChat(data.author, data.text);
                    }
                } catch (e) {
                    console.error("Malformed packet", e);
                }
            });

            client.on("error", (err) => {
                ui.status.innerText = "Connection error!";
                console.error(err);
            });
        }

        function publishMessage(data) {
            if (client && isConnected) {
                client.publish(ROOM_TOPIC, JSON.stringify(data));
            }
        }

        function sendMessage() {
            const text = ui.msgIp.value.trim();
            if (!text) return;

            publishMessage({ type: "MSG", author: myUsername, text: text });
            ui.msgIp.value = "";
        }
    </script>
</body>
</html>
