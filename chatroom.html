<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal MQTT Chat - Admin & Media Edition</title>
    <style>
        /* ===== CUSTOM FONTS (Crisp Win95 Style) ===== */
        @font-face {
            font-family: "W95FA";
            src: url('images/w95f.woff2') format('woff2'),
                 url('images/w95f.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --win-bg: #c0c0c0;
            --win-blue: #000080;
            --win-text-dark: #000000;
            --win-text-light: #ffffff;
            --win-border-light: #ffffff;
            --win-border-dark: #808080;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "W95FA", "MS Sans Serif", Tahoma, Arial, sans-serif !important;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            font-smooth: never;
            border-radius: 0;
        }

        body {
            background-color: var(--win-bg);
            color: var(--win-text-dark);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 6px;
            box-sizing: border-box;
        }

        button, .btn-w95 {
            background: var(--win-bg);
            border: 2px outset var(--win-border-light);
            padding: 2px 8px;
            font-size: 12px;
            color: var(--win-text-dark);
            cursor: pointer;
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:active, .btn-w95:active {
            border: 2px inset var(--win-border-light);
        }

        input[type="text"], input[type="password"] {
            background: #ffffff;
            border: 2px inset var(--win-border-dark);
            padding: 3px 5px;
            font-size: 13px;
            color: var(--win-text-dark);
            outline: none;
        }

        .inset-panel {
            background: #ffffff;
            border: 2px inset var(--win-border-dark);
            overflow-y: auto;
        }

        .outset-panel {
            background: var(--win-bg);
            border: 2px outset var(--win-border-light);
            padding: 6px;
        }

        /* Tabs System */
        .tabs-header {
            display: flex;
            gap: 2px;
            border-bottom: 2px solid var(--win-border-dark);
            padding-left: 2px;
            margin-bottom: 4px;
        }

        .tab-btn {
            padding: 3px 8px;
            cursor: pointer;
            background: var(--win-bg);
            border: 2px outset var(--win-border-light);
            border-bottom: none;
            position: relative;
            font-size: 12px;
            margin-bottom: -2px;
            z-index: 1;
        }

        .tab-btn.active {
            font-weight: bold;
            background: var(--win-bg);
            border: 2px outset var(--win-border-light);
            border-bottom: 2px solid var(--win-bg);
            z-index: 3;
        }

        .unread-dot {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 6px;
            height: 6px;
            background: #ff0000;
        }

        .reply-quote {
            font-size: 11px;
            opacity: 0.85;
            border-left: 2px solid var(--win-blue);
            padding-left: 4px;
            margin-bottom: 2px;
            background: #e0e0e0;
            color: #000;
        }

        .clickable-msg { cursor: pointer; padding: 2px 4px; }
        .clickable-msg:hover { background: var(--win-blue); color: #ffffff; }
        .clickable-msg:hover .reply-quote { color: #000000; }
        
        .user-item { 
            cursor: pointer; 
            font-weight: bold; 
            padding: 2px 4px; 
            list-style: none; 
            
            user-select: none !important; 
            -webkit-user-select: none !important;
            -khtml-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            -webkit-touch-callout: none !important;
        }
        .user-item:hover { background: var(--win-blue); color: #ffffff !important; }

        .blocked-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--win-bg);
            border: 2px outset var(--win-border-light);
            padding: 1px 4px;
            font-size: 11px;
        }

        /* Custom Modals & Penalties */
        #penalty-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--win-bg); z-index: 9000;
            display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); z-index: 9999;
            display: none; justify-content: center; align-items: center;
        }

        .w95-window {
            background: var(--win-bg); border: 3px outset var(--win-border-light);
            min-width: 280px; max-width: 90%; box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .w95-titlebar {
            background: var(--win-blue); color: var(--win-text-light);
            padding: 3px 6px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;
        }

        .w95-content {
            padding: 12px; text-align: center; color: var(--win-text-dark); position: relative;
        }

        /* Context Menu */
        #context-menu {
            display: none; position: absolute; z-index: 10000;
            background: var(--win-bg); border: 2px outset var(--win-border-light);
            padding: 2px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        .context-item {
            padding: 3px 15px 3px 5px; cursor: pointer; font-size: 12px; text-align: left;
        }
        .context-item:hover { background: var(--win-blue); color: var(--win-text-light); }
        .context-divider {
            border-top: 1px solid var(--win-border-dark);
            border-bottom: 1px solid var(--win-border-light);
            margin: 2px 0;
        }
        .admin-only { display: none; color: #8b0000; }
        .admin-only:hover { color: #ffffff; background: #8b0000; }

        audio { height: 25px; outline: none; margin-top: 4px; }
    </style>
</head>
<body>

    <!-- Context Menu -->
    <div id="context-menu">
        <div class="context-item" onclick="contextAction('DM')">Direct Message</div>
        <div class="context-divider admin-only"></div>
        <div class="context-item admin-only" onclick="contextAction('MUTE')">Mute (5m)</div>
        <div class="context-item admin-only" onclick="contextAction('TIMEOUT')">Timeout (5m)</div>
        <div class="context-item admin-only" onclick="contextAction('KICK')">Kick User</div>
        <div class="context-item admin-only" onclick="contextAction('BAN')">Permaban User</div>
    </div>

    <!-- Penalty Screen (Banned/Timed Out Background) -->
    <div id="penalty-screen">
        <h2 id="penalty-title" style="margin-bottom: 10px; color: #8b0000;"></h2>
        <p id="penalty-desc"></p>
        <button id="ban-info-btn" onclick="openModal('ban-info-modal')" style="display: none; margin-top: 15px; font-weight: bold;">?</button>
    </div>

    <!-- Ban Info Modal -->
    <div id="ban-info-modal" class="modal-overlay">
        <div class="w95-window">
            <div class="w95-titlebar">
                <span>Ban Information</span>
                <button onclick="closeModal('ban-info-modal')" style="height: 18px; line-height: 10px;">X</button>
            </div>
            <div class="w95-content">
                <p style="margin-bottom: 15px;">You have been permanently banned by a chatroom administrator.</p>
                <button onclick="openPasswordModal('unban')" style="position: absolute; bottom: 4px; right: 4px; padding: 0; font-size: 4px; width: 6px; height: 6px; border: 1px solid transparent; background: transparent; color: #a0a0a0; cursor: pointer;">.</button>
            </div>
        </div>
    </div>

    <!-- Secret Password Modal -->
    <div id="password-modal" class="modal-overlay">
        <div class="w95-window">
            <div class="w95-titlebar">
                <span id="password-modal-title">Admin Override</span>
                <button onclick="closeModal('password-modal')" style="height: 18px; line-height: 10px;">X</button>
            </div>
            <div class="w95-content" style="display: flex; gap: 6px;">
                <input type="password" id="unban-password" placeholder="Enter password..." style="flex: 1;" onkeydown="if(event.key==='Enter') submitPassword()" />
                <button onclick="submitPassword()">Submit</button>
            </div>
        </div>
    </div>

    <!-- Generic Alert Modal -->
    <div id="alert-modal" class="modal-overlay">
        <div class="w95-window">
            <div class="w95-titlebar">
                <span>System Message</span>
                <button onclick="closeModal('alert-modal')" style="height: 18px; line-height: 10px;">X</button>
            </div>
            <div class="w95-content">
                <p id="alert-text" style="margin-bottom: 12px;"></p>
                <button onclick="closeModal('alert-modal')">OK</button>
            </div>
        </div>
    </div>

    <!-- Username Selection Screen -->
    <div id="username-screen" class="outset-panel" style="padding: 15px; margin: 20px auto; max-width: 320px;">
        <h4 style="margin-bottom: 8px;">Create Username</h4>
        <input type="text" id="username-input" placeholder="Enter a username..." style="width: 100%; margin-bottom: 10px;" onkeydown="if(event.key==='Enter') joinChat()" />
        <button onclick="joinChat()" style="width: 100%;">Enter Chatroom</button>
    </div>

    <!-- Main Chat Screen -->
    <div id="chat-screen" style="display: none; height: 100%; width: 100%; flex-direction: column;">
        <!-- Header Controls -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <span id="status" style="font-size: 12px; font-weight: bold;">Connecting to chatroom...</span>
            <div style="display: flex; gap: 4px;">
                <button onclick="toggleSettings()">Settings</button>
                <button id="admin-clear-btn" onclick="confirmClearAll()" style="display: none; background: #8b0000; color: white; font-weight: bold;">Clear All Chats</button>
            </div>
        </div>

        <!-- Settings Panel -->
        <div id="settings-panel" class="outset-panel" style="display: none; margin-bottom: 6px;">
            <b style="font-size: 12px; display: block; margin-bottom: 6px;">User Settings</b>
            <div style="display: flex; gap: 4px; align-items: center; margin-bottom: 6px;">
                <label style="font-size: 11px;">Username:</label>
                <input type="text" id="new-username-input" placeholder="New username..." style="flex: 1;" onkeydown="if(event.key==='Enter') changeUsername()" />
                <button onclick="changeUsername()">Update</button>
            </div>
            <div style="display: flex; gap: 4px; align-items: center; margin-bottom: 6px;">
                <label style="font-size: 11px;">Block User:</label>
                <input type="text" id="block-input" placeholder="Username..." style="flex: 1;" />
                <button onclick="blockUser()">Block</button>
            </div>
            <div style="font-size: 11px; margin-bottom: 6px;">
                <b>Blocked Users:</b>
                <div id="blocked-list" style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;">None</div>
            </div>
            <button onclick="toggleSettings()" style="width: 100%;">Close Settings</button>
        </div>

        <!-- Tabs Header -->
        <div id="tabs-bar" class="tabs-header">
            <div id="tab-global" class="tab-btn active" onclick="switchTab('global')">Forum</div>
        </div>

        <!-- Inner Content Area -->
        <div style="display: flex; flex: 1; gap: 6px; min-height: 0;">
            <!-- Main Chat Panel -->
            <div style="flex: 3; display: flex; flex-direction: column; min-height: 0;">
                <div id="chat-box" class="inset-panel" style="flex: 1; padding: 4px;"></div>
                <div id="typing-indicator" style="height: 18px; font-size: 11px; color: #555; line-height: 18px;"></div>

                <!-- Reply Bar Preview -->
                <div id="reply-preview" class="outset-panel" style="display: none; font-size: 11px; padding: 3px 6px; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <span id="reply-text"></span>
                    <button onclick="cancelReply()" style="padding: 0 4px; line-height: 12px; font-weight: bold;">✕</button>
                </div>

                <div style="display: flex; gap: 4px;">
                    <input type="file" id="universal-upload" style="display: none;" />
                    <button onclick="document.getElementById('universal-upload').click()" title="Attach Media or File">📎</button>
                    <button id="btn-record" onclick="toggleRecording()" title="Voice Memo">🎤</button>
                    <input type="text" id="msg-input" placeholder="Type a msg, /command, or click to reply..." oninput="handleTyping()" style="flex: 1;" onkeydown="if(event.key==='Enter') processInput()" />
                    <button onclick="processInput()">Send</button>
                </div>
            </div>

            <!-- Online Users Sidebar -->
            <div class="inset-panel" style="flex: 1; padding: 4px;">
                <b style="font-size: 11px; display: block; border-bottom: 1px solid #808080; padding-bottom: 2px;">Online Users</b>
                <ul id="user-list" style="margin-top: 4px; font-size: 12px; padding-left: 0;"></ul>
            </div>
        </div>
    </div>

    <!-- MQTT Client Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <script>
        const ROOM_TOPIC = "universal-public-single-massive-room-v3-xyz123/messages";
        const STORAGE_KEY = "mqtt_chat_history_cache_v2";
        const USERNAME_KEY = "mqtt_chat_username_v1";
        const BLOCKED_KEY = "mqtt_chat_blocked_v1";
        const ADMINS = ["Colton", "mr_puffy_5312"];

        let client = null;
        let myUsername = "";
        let isConnected = false;
        let isAdmin = false;

        let messageHistory = [];
        let dmHistories = {};
        let activeUsers = new Map();
        let blockedUsers = new Set();

        let currentTab = "global";
        let unreadTabs = new Set();
        let activeReply = null;
        let typingTimeout = null;

        let isMuted = false;
        let mutedAttemptCount = 0;
        let kickInterval = null;
        let muteTimeoutId = null;

        let mediaRecorder = null;
        let audioChunks = [];
        let isLongPress = false;
        let pressTimer = null;
        let contextMenuTarget = "";
        
        let pendingAction = "unban";
        let pendingName = "";

        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substring(2, 5);

        const ui = {
            userScreen: document.getElementById("username-screen"),
            chatScreen: document.getElementById("chat-screen"),
            penaltyScreen: document.getElementById("penalty-screen"),
            penaltyTitle: document.getElementById("penalty-title"),
            penaltyDesc: document.getElementById("penalty-desc"),
            banInfoBtn: document.getElementById("ban-info-btn"),
            userIp: document.getElementById("username-input"),
            status: document.getElementById("status"),
            chatBox: document.getElementById("chat-box"),
            msgIp: document.getElementById("msg-input"),
            userList: document.getElementById("user-list"),
            typing: document.getElementById("typing-indicator"),
            adminClearBtn: document.getElementById("admin-clear-btn"),
            tabsBar: document.getElementById("tabs-bar"),
            replyPreview: document.getElementById("reply-preview"),
            replyText: document.getElementById("reply-text"),
            settingsPanel: document.getElementById("settings-panel"),
            newUsernameIp: document.getElementById("new-username-input"),
            blockIp: document.getElementById("block-input"),
            blockedList: document.getElementById("blocked-list"),
            btnRecord: document.getElementById("btn-record"),
            contextMenu: document.getElementById("context-menu")
        };

        /* --- GLOBAL EVENT LISTENERS --- */
        document.addEventListener("click", () => { ui.contextMenu.style.display = "none"; });

        /* --- MODALS & PENALTIES --- */
        function openModal(id) { document.getElementById(id).style.display = "flex"; }
        function closeModal(id) { document.getElementById(id).style.display = "none"; }
        function customAlert(text) { document.getElementById('alert-text').innerText = text; openModal('alert-modal'); }

        function openPasswordModal(action, name = "") {
            pendingAction = action;
            pendingName = name;
            document.getElementById('unban-password').value = "";
            document.getElementById('password-modal-title').innerText = action === 'unban' ? 'Admin Override' : 'Admin Authentication';
            openModal('password-modal');
        }

        function submitPassword() {
            const pwd = document.getElementById("unban-password").value;
            if (pendingAction === 'unban') {
                if (pwd === "adminpass") {
                    localStorage.removeItem("mqtt_banned");
                    location.reload();
                } else { customAlert("Incorrect password."); }
            } else if (pendingAction === 'join_admin' || pendingAction === 'change_admin') {
                if (pwd === "adminpass") { // Secure check before allowing the admin name
                    closeModal("password-modal");
                    if (pendingAction === 'join_admin') executeJoin(pendingName);
                    else executeChangeUsername(pendingName);
                } else { customAlert("Incorrect admin password."); }
            }
            document.getElementById("unban-password").value = "";
        }

        function checkPenalties() {
            if (localStorage.getItem("mqtt_banned") === "true") {
                ui.userScreen.style.display = "none"; ui.chatScreen.style.display = "none";
                ui.penaltyScreen.style.display = "flex";
                ui.penaltyTitle.innerText = "ACCESS DENIED";
                ui.penaltyDesc.innerText = "You are permanently banned.";
                ui.banInfoBtn.style.display = "block";
                if (client) client.end();
                return true;
            }
            const kickEnd = parseInt(localStorage.getItem("mqtt_timeout") || "0");
            if (Date.now() < kickEnd) {
                ui.userScreen.style.display = "none"; ui.chatScreen.style.display = "none";
                ui.penaltyScreen.style.display = "flex"; ui.banInfoBtn.style.display = "none";
                if (client) client.end();

                if(kickInterval) clearInterval(kickInterval);
                kickInterval = setInterval(() => {
                    const remaining = Math.ceil((kickEnd - Date.now()) / 1000);
                    if (remaining <= 0) {
                        clearInterval(kickInterval);
                        localStorage.removeItem("mqtt_timeout");
                        location.reload();
                    } else {
                        ui.penaltyTitle.innerText = "TIMED OUT";
                        ui.penaltyDesc.innerText = `You are timed out. Time remaining: ${remaining}s`;
                    }
                }, 1000);
                return true;
            }
            return false;
        }

        /* --- MEDIA RECORDING & FILE UPLOAD --- */
        async function toggleRecording() {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const mimeType = mediaRecorder.mimeType || 'audio/webm';
                        const blob = new Blob(audioChunks, { type: mimeType });
                        audioChunks = [];
                        const reader = new FileReader();
                        reader.onloadend = () => sendPayload(reader.result, { isAudio: true });
                        reader.readAsDataURL(blob);
                    };
                    audioChunks = [];
                    mediaRecorder.start();
                    ui.btnRecord.style.background = "#ff9999";
                    setTimeout(() => { if(mediaRecorder && mediaRecorder.state !== "inactive") toggleRecording(); }, 30000);
                } catch(e) { customAlert("Microphone access denied."); }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                ui.btnRecord.style.background = "var(--win-bg)";
            }
        }

        document.getElementById("universal-upload").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type.startsWith("image/")) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement("canvas");
                        const MAX_SIZE = 400; 
                        let w = img.width; let h = img.height;
                        if (w > h) { if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } } 
                        else { if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; } }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, w, h);
                        sendPayload(canvas.toDataURL("image/jpeg", 0.6), { isImage: true }); 
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            } else {
                if (file.size > 1024 * 1024 * 2) return customAlert("File too large. Max limit is 2MB.");
                const reader = new FileReader();
                reader.onload = function(event) {
                    sendPayload(event.target.result, { isFile: true, fileName: file.name });
                };
                reader.readAsDataURL(file);
            }
            e.target.value = "";
        });

        function loadBlockedUsers() {
            try { const stored = localStorage.getItem(BLOCKED_KEY); if (stored) blockedUsers = new Set(JSON.parse(stored)); } catch (e) {}
            renderBlockedUI();
        }
        function saveBlockedUsers() {
            try { localStorage.setItem(BLOCKED_KEY, JSON.stringify(Array.from(blockedUsers))); } catch (e) {}
            renderBlockedUI();
        }
        function renderBlockedUI() {
            ui.blockedList.innerHTML = "";
            if (blockedUsers.size === 0) { ui.blockedList.innerText = "None"; return; }
            blockedUsers.forEach(user => {
                const chip = document.createElement("span"); chip.className = "blocked-chip";
                chip.innerHTML = `${escapeHTML(user)} <button onclick="unblockUser('${escapeHTML(user)}')" style="padding:0 3px; font-size:9px;">✕</button>`;
                ui.blockedList.appendChild(chip);
            });
        }
        function toggleSettings() { ui.settingsPanel.style.display = ui.settingsPanel.style.display === "none" ? "block" : "none"; }
        
        function changeUsername() {
            if (checkPenalties()) return; 
            const newName = ui.newUsernameIp.value.trim();
            if (!newName || newName === myUsername) return;

            if (ADMINS.includes(newName)) {
                openPasswordModal('change_admin', newName);
            } else {
                executeChangeUsername(newName);
            }
        }

        function executeChangeUsername(newName) {
            const oldName = myUsername; myUsername = newName;
            try { localStorage.setItem(USERNAME_KEY, myUsername); } catch (e) {}
            
            const selfData = activeUsers.get(oldName) || { joinTime: Date.now() };
            activeUsers.delete(oldName);
            activeUsers.set(myUsername, { lastSeen: Date.now(), joinTime: selfData.joinTime });

            publishMessage({ type: "RENAME", oldAuthor: oldName, author: myUsername, joinTime: selfData.joinTime, id: generateId() });
            
            renderUserList(); evaluateAdminRole(); updateStatusText();
            ui.newUsernameIp.value = ""; toggleSettings();
        }

        function blockUser() {
            const name = ui.blockIp.value.trim();
            if (name && name !== myUsername) { blockedUsers.add(name); saveBlockedUsers(); ui.blockIp.value = ""; renderActiveTabMessages(); }
        }
        function unblockUser(name) { blockedUsers.delete(name); saveBlockedUsers(); renderActiveTabMessages(); }

        function getUsernameColor(username) {
            let hash = 5381;
            for (let i = 0; i < username.length; i++) hash = ((hash << 5) + hash) + username.charCodeAt(i);
            const r = Math.abs((hash ^ 0xDEADBEEF) % 150); const g = Math.abs((hash ^ 0xCAFEBABE) % 150); const b = Math.abs((hash ^ 0x8BADF00D) % 150);
            return `rgb(${r}, ${g}, ${b})`;
        }
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

        function formatMessageContent(rawText, msg) {
            if (msg.isImage) return `<img src="${rawText}" style="max-width: 250px; border: 2px inset var(--win-border-dark); display: block; margin-top: 4px;" alt="User Image"/>`;
            if (msg.isAudio) return `<br><audio controls src="${rawText}"></audio>`;
            if (msg.isFile) return `<br><a href="${rawText}" download="${escapeHTML(msg.fileName)}" class="btn-w95" style="text-decoration:none; margin-top:4px; padding:4px;">💾 Download ${escapeHTML(msg.fileName)}</a>`;
            const escaped = escapeHTML(rawText);
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return escaped.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color: blue;">${url}</a>`);
        }

        /* --- TAB MANAGEMENT --- */
        function switchTab(tabId) {
            currentTab = tabId; unreadTabs.delete(tabId);
            document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
            const activeEl = document.getElementById(`tab-${tabId.replace(':', '-')}`);
            if (activeEl) {
                activeEl.classList.add("active");
                const dot = activeEl.querySelector(".unread-dot");
                if (dot) dot.remove();
            }
            renderActiveTabMessages();
        }

        function ensureDmTab(username) {
            const tabId = `dm:${username}`;
            if (!dmHistories[username]) dmHistories[username] = loadDmHistory(username);
            const elementId = `tab-dm-${username}`;
            if (!document.getElementById(elementId)) {
                const tab = document.createElement("div");
                tab.id = elementId; tab.className = "tab-btn"; tab.innerText = `@${username}`;
                tab.onclick = () => switchTab(tabId);
                ui.tabsBar.appendChild(tab);
            }
            return tabId;
        }

        function markUnread(tabId) {
            if (currentTab === tabId) return;
            unreadTabs.add(tabId);
            const elementId = `tab-${tabId.replace(':', '-')}`;
            const tab = document.getElementById(elementId);
            if (tab && !tab.querySelector(".unread-dot")) {
                const dot = document.createElement("span"); dot.className = "unread-dot";
                tab.appendChild(dot);
            }
        }

        function setReplyTarget(msg) {
            activeReply = msg;
            let preview = msg.isImage ? "[Image]" : msg.isAudio ? "[Voice Memo]" : msg.isFile ? "[File]" : msg.text;
            ui.replyText.innerText = `Replying to @${msg.author}: "${preview.substring(0, 25)}${preview.length > 25 ? '...' : ''}"`;
            ui.replyPreview.style.display = "flex"; ui.msgIp.focus();
        }
        function cancelReply() { activeReply = null; ui.replyPreview.style.display = "none"; }

        /* --- RENDERING --- */
        function renderActiveTabMessages() {
            ui.chatBox.innerHTML = "";
            let list = currentTab === "global" ? messageHistory : (dmHistories[currentTab.replace("dm:", "")] || []);
            list.forEach(msg => {
                if (blockedUsers.has(msg.author)) return;
                if (msg.isSystem) appendSystemDOM(msg); else appendMsgDOM(msg);
            });
            ui.chatBox.scrollTop = ui.chatBox.scrollHeight;
        }

        function appendSystemDOM(arg) {
            let sysObj = typeof arg === "string" ? { id: generateId(), text: arg, isSystem: true, localOnly: true } : arg;
            let line = document.createElement("div");
            line.id = `msg-${sysObj.id}`;
            line.style.color = "#8b0000"; line.style.fontWeight = "bold"; line.style.margin = "2px 0"; 
            line.style.fontSize = "14px";
            
            let deleteBtn = isAdmin ? `<button onclick="deleteAnyMessage('${sysObj.id}')" style="font-size: 9px; padding: 0 3px; margin-right: 4px;">x</button>` : "";
            line.innerHTML = `${deleteBtn}[SYSTEM] ${sysObj.text}`;
            
            ui.chatBox.appendChild(line); ui.chatBox.scrollTop = ui.chatBox.scrollHeight;
        }

        function appendMsgDOM(msg) {
            let line = document.createElement("div");
            line.id = `msg-${msg.id}`; line.className = "clickable-msg"; line.style.margin = "2px 0";
            line.style.fontSize = "14px";
            
            line.onclick = (e) => { if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A' && e.target.tagName !== 'AUDIO') setReplyTarget(msg); };

            const color = getUsernameColor(msg.author);
            let deleteBtn = (msg.author === myUsername || isAdmin) ? `<button onclick="deleteAnyMessage('${msg.id}')" style="font-size: 9px; padding: 0 3px; margin-right: 4px;">x</button>` : "";
            let replyHtml = msg.replyTo ? `<div class="reply-quote"><b>@${escapeHTML(msg.replyTo.author)}:</b> ${msg.replyTo.isImage ? "[Image]" : msg.replyTo.isAudio ? "[Voice Memo]" : msg.replyTo.isFile ? "[File]" : escapeHTML(msg.replyTo.text)}</div>` : "";

            const formattedContent = formatMessageContent(msg.text, msg);
            line.innerHTML = `${replyHtml}${deleteBtn}<b style="color: ${color};">${msg.author}:</b> ${formattedContent}`;
            ui.chatBox.appendChild(line); ui.chatBox.scrollTop = ui.chatBox.scrollHeight;
        }

        (function init() {
            if(checkPenalties()) return;
            try { 
                const saved = localStorage.getItem(USERNAME_KEY); 
                if (saved) { 
                    ui.userIp.value = saved; 
                    // Auto-login functionality
                    if (ADMINS.includes(saved)) {
                        openPasswordModal('join_admin', saved);
                    } else {
                        executeJoin(saved);
                    }
                } 
            } catch (e) {}
            loadBlockedUsers();
        })();

        function joinChat() {
            const val = ui.userIp.value.trim();
            if (!val) return alert("Username required!");

            if (ADMINS.includes(val)) {
                openPasswordModal('join_admin', val);
            } else {
                executeJoin(val);
            }
        }

        function executeJoin(val) {
            myUsername = val;
            try { localStorage.setItem(USERNAME_KEY, myUsername); } catch (e) {}
            ui.userScreen.style.display = "none"; ui.chatScreen.style.display = "flex";
            loadLocalHistory();

            client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
            client.on("connect", () => {
                isConnected = true;
                const now = Date.now();
                activeUsers.set(myUsername, { lastSeen: now, joinTime: now });
                evaluateAdminRole(); renderUserList();

                client.subscribe(ROOM_TOPIC, (err) => {
                    if (!err) {
                        publishMessage({ type: "JOIN", author: myUsername, joinTime: now, id: generateId() });
                        publishMessage({ type: "SYNC_REQ", author: myUsername });
                        
                        setInterval(() => { if (isConnected) publishMessage({ type: "PING", author: myUsername, joinTime: activeUsers.get(myUsername)?.joinTime || Date.now() }); }, 5000);
                        setInterval(checkPresence, 5000);
                    }
                });
            });

            window.addEventListener("beforeunload", () => { if (isConnected) publishMessage({ type: "LEAVE", author: myUsername, id: generateId() }); });

            client.on("message", (topic, payload) => {
                try {
                    const data = JSON.parse(payload.toString());
                    if (data.author && !blockedUsers.has(data.author)) {
                        const existing = activeUsers.get(data.author);
                        activeUsers.set(data.author, { lastSeen: Date.now(), joinTime: data.joinTime || (existing ? existing.joinTime : Date.now()) });
                        renderUserList(); evaluateAdminRole();
                    }

                    if (data.type === "SYNC_REQ") {
                        if (data.author === myUsername) return; 
                        
                        let oldestUser = myUsername;
                        let oldestTime = activeUsers.get(myUsername)?.joinTime || Date.now();
                        
                        activeUsers.forEach((uData, uName) => {
                            if (uData.joinTime < oldestTime || (uData.joinTime === oldestTime && uName < oldestUser)) {
                                oldestTime = uData.joinTime;
                                oldestUser = uName;
                            }
                        });

                        if (oldestUser === myUsername) {
                            publishMessage({ type: "SYNC_RES", target: data.author, history: messageHistory });
                        }
                    }
                    else if (data.type === "SYNC_RES" && data.target === myUsername) {
                        messageHistory = mergeHistory(messageHistory, data.history);
                        saveLocalHistory();
                        if (currentTab === "global") renderActiveTabMessages();
                    }
                    else if (data.type === "JOIN") {
                        if (blockedUsers.has(data.author)) return;
                        const sysObj = { id: data.id || generateId(), isSystem: true, text: `${data.author} joined the room.` };
                        messageHistory.push(sysObj); saveLocalHistory();
                        if (currentTab === "global") appendSystemDOM(sysObj);
                    }
                    else if (data.type === "LEAVE") {
                        if (activeUsers.has(data.author)) {
                            activeUsers.delete(data.author);
                            const sysObj = { id: data.id || generateId(), isSystem: true, text: `${data.author} disconnected.` };
                            messageHistory.push(sysObj); saveLocalHistory();
                            if (currentTab === "global") appendSystemDOM(sysObj);
                            renderUserList(); evaluateAdminRole();
                        }
                    }
                    else if (data.type === "MSG") {
                        if (blockedUsers.has(data.author)) return;
                        const msgObj = { id: data.id, author: data.author, text: data.text, isImage: data.isImage, isAudio: data.isAudio, isFile: data.isFile, fileName: data.fileName, replyTo: data.replyTo, timestamp: data.timestamp || Date.now(), isSystem: false };
                        messageHistory.push(msgObj); saveLocalHistory();
                        if (currentTab === "global") appendMsgDOM(msgObj);
                    }
                    else if (data.type === "DM") {
                        if (blockedUsers.has(data.author)) return;
                        if (data.target === myUsername) {
                            const tabId = ensureDmTab(data.author);
                            const msgObj = { id: data.id, author: data.author, text: data.text, isImage: data.isImage, isAudio: data.isAudio, isFile: data.isFile, fileName: data.fileName, replyTo: data.replyTo, timestamp: data.timestamp || Date.now() };
                            dmHistories[data.author] = mergeHistory(dmHistories[data.author] || [], [msgObj]);
                            saveDmHistory(data.author);
                            if (currentTab === tabId) appendMsgDOM(msgObj); else markUnread(tabId);
                        }
                    }
                    else if (data.type === "CMD" && data.target === myUsername && ADMINS.includes(data.author)) {
                        if (data.cmd === "KICK") {
                            if (client) client.end();
                            isConnected = false; ui.chatScreen.style.display = "none"; ui.userScreen.style.display = "block";
                            customAlert("You have been kicked by an administrator.");
                        } else if (data.cmd === "TIMEOUT") {
                            localStorage.setItem("mqtt_timeout", Date.now() + (data.duration || 120000)); 
                            checkPenalties();
                        } else if (data.cmd === "BAN") {
                            localStorage.setItem("mqtt_banned", "true"); checkPenalties();
                        } else if (data.cmd === "MUTE") {
                            isMuted = true;
                            let durTxt = data.duration ? ` for ${Math.round(data.duration/60000)} minutes` : "";
                            appendSystemDOM(`You have been muted by an Admin${durTxt}.`);
                            if(muteTimeoutId) clearTimeout(muteTimeoutId);
                            if (data.duration) {
                                muteTimeoutId = setTimeout(() => { isMuted = false; mutedAttemptCount = 0; appendSystemDOM("Your mute has expired."); }, data.duration);
                            }
                        } else if (data.cmd === "UNMUTE") {
                            isMuted = false; mutedAttemptCount = 0; if(muteTimeoutId) clearTimeout(muteTimeoutId);
                            appendSystemDOM("You have been unmuted by an Admin.");
                        }
                    }
                    else if (data.type === "MUTE_ATTEMPT" && isAdmin) { appendSystemDOM({ id: data.id || generateId(), isSystem: true, text: `${data.author} tried to send a message while muted (Attempt #${data.count})` }); }
                    else if (data.type === "DELETE_MSG") {
                        const idxG = messageHistory.findIndex(m => m.id === data.id);
                        if (idxG !== -1) {
                            if (messageHistory[idxG].author === data.deleter || ADMINS.includes(data.deleter)) { messageHistory.splice(idxG, 1); saveLocalHistory(); }
                        }
                        Object.keys(dmHistories).forEach(user => {
                            const idxD = dmHistories[user].findIndex(m => m.id === data.id);
                            if (idxD !== -1) {
                                if (dmHistories[user][idxD].author === data.deleter || ADMINS.includes(data.deleter)) { dmHistories[user].splice(idxD, 1); saveDmHistory(user); }
                            }
                        });
                        
                        const el = document.getElementById(`msg-${data.id}`);
                        if (el) el.remove();
                        
                        renderActiveTabMessages();
                    }
                    else if (data.type === "CLEAR_ALL") {
                        messageHistory = [];
                        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
                        Object.keys(dmHistories).forEach(user => { dmHistories[user] = []; saveDmHistory(user); });
                        const sysObj = { id: data.id || generateId(), isSystem: true, text: `Chat histories were purged by Admin (${data.author}).` };
                        messageHistory.push(sysObj); saveLocalHistory();
                        renderActiveTabMessages(); 
                    }
                    else if (data.type === "TYPING") {
                        if (data.author !== myUsername && !blockedUsers.has(data.author)) {
                            ui.typing.innerText = `${data.author} is typing...`;
                            clearTimeout(data.typingTimer);
                            data.typingTimer = setTimeout(() => { ui.typing.innerText = ""; }, 3000);
                        }
                    }
                    else if (data.type === "RENAME") {
                        if (activeUsers.has(data.oldAuthor)) {
                            const uData = activeUsers.get(data.oldAuthor);
                            activeUsers.delete(data.oldAuthor);
                            activeUsers.set(data.author, { lastSeen: Date.now(), joinTime: data.joinTime || uData.joinTime });
                            const sysObj = { id: data.id || generateId(), isSystem: true, text: `${data.oldAuthor} changed name to ${data.author}` };
                            messageHistory.push(sysObj); saveLocalHistory();
                            if (currentTab === "global") appendSystemDOM(sysObj);
                            renderUserList(); evaluateAdminRole();
                        }
                    }
                } catch (e) {}
            });
        }

        function mergeHistory(local, remote) {
            const map = new Map();
            local.forEach(m => { if (m.id) map.set(m.id, m); });
            remote.forEach(m => { if (m.id && !map.has(m.id)) map.set(m.id, m); });
            return Array.from(map.values()).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
        }

        function deleteAnyMessage(id) { publishMessage({ type: "DELETE_MSG", id: id, deleter: myUsername }); }
        function confirmClearAll() { if (isAdmin && confirm("Are you sure you want to permanently delete all messages?")) publishMessage({ type: "CLEAR_ALL", author: myUsername, id: generateId() }); }

        /* --- ADMIN, MENU & LIST LOGIC --- */
        function evaluateAdminRole() {
            const wasAdmin = isAdmin;
            isAdmin = ADMINS.includes(myUsername);
            updateStatusText(); 
            if (wasAdmin !== isAdmin) {
                renderActiveTabMessages(); 
            }
        }
        function updateStatusText() {
            ui.status.innerText = `${isAdmin ? "[ADMIN]" : "[USER]"} Connected as "${myUsername}"`;
            ui.adminClearBtn.style.display = isAdmin ? "block" : "none";
        }

        function checkPresence() {
            const now = Date.now();
            let changed = false;
            activeUsers.forEach((userData, user) => {
                if (user !== myUsername && now - userData.lastSeen > 60000) {
                    activeUsers.delete(user);
                    const sysObj = { id: generateId(), isSystem: true, text: `${user} disconnected.` };
                    messageHistory.push(sysObj); saveLocalHistory();
                    if (currentTab === "global") appendSystemDOM(sysObj);
                    changed = true;
                }
            });
            if (changed) { renderUserList(); evaluateAdminRole(); }
        }

        function renderUserList() {
            ui.userList.innerHTML = "";
            const now = Date.now();
            activeUsers.forEach((userData, user) => {
                if (blockedUsers.has(user)) return;
                const color = getUsernameColor(user);
                const adminBadge = ADMINS.includes(user) ? " (Admin)" : "";
                const selfBadge = user === myUsername ? " (You)" : "";
                const inactiveBadge = (now - userData.lastSeen > 10000) && user !== myUsername ? " <span style='font-size:10px; color:#888;'>(Inactive)</span>" : "";
                
                ui.userList.innerHTML += `<li class="user-item" 
                    oncontextmenu="showContextMenu(event, '${user}'); return false;" 
                    onclick="handleUserClick(event, '${user}')"
                    ontouchstart="handleTouchStart(event, '${user}')"
                    ontouchmove="clearTimeout(pressTimer)"
                    ontouchend="handleTouchEnd(event, '${user}')"
                    style="color: ${color};">${user}${adminBadge}${selfBadge}${inactiveBadge}</li>`;
            });
        }

        /* --- TOUCH & CONTEXT MENU --- */
        function handleTouchStart(e, user) {
            if (user === myUsername) return; 
            isLongPress = false;
            const touch = e.touches[0];
            const px = touch.pageX;
            const py = touch.pageY;
            
            pressTimer = setTimeout(() => { 
                isLongPress = true; 
                showContextMenu({ pageX: px, pageY: py, preventDefault: () => {} }, user); 
            }, 500);
        }
        function handleTouchEnd(e, user) { 
            clearTimeout(pressTimer); 
            if (isLongPress) {
                try { e.preventDefault(); } catch(err){}
            } 
        }
        function handleUserClick(e, user) { if (isLongPress) return; startDmWith(user); }
        
        function showContextMenu(e, username) {
            if (e.preventDefault) e.preventDefault();
            if (username === myUsername) return; 
            contextMenuTarget = username;
            ui.contextMenu.style.display = "block";
            ui.contextMenu.style.left = e.pageX + "px";
            ui.contextMenu.style.top = e.pageY + "px";
            document.querySelectorAll(".admin-only").forEach(el => { el.style.display = isAdmin ? "block" : "none"; });
        }

        function contextAction(action) {
            const target = contextMenuTarget;
            ui.contextMenu.style.display = "none";
            if (!target || target === myUsername) return;
            if (action === 'DM') startDmWith(target);
            else if (['KICK', 'BAN'].includes(action)) { publishMessage({ type: "CMD", cmd: action, target: target, author: myUsername }); appendSystemDOM(`Command ${action} dispatched to ${target}.`); }
            else if (['MUTE', 'TIMEOUT'].includes(action)) { publishMessage({ type: "CMD", cmd: action, target: target, author: myUsername, duration: 300000 }); appendSystemDOM(`Command ${action} (5m) dispatched to ${target}.`); }
        }

        function parseDuration(str) {
            if (!str) return null;
            const match = str.match(/^(\d+)([smhd])?$/i);
            if (!match) return null;
            const val = parseInt(match[1]);
            const unit = match[2] ? match[2].toLowerCase() : 'm'; 
            const multipliers = { s: 1000, m: 60000, h: 3600000, d: 86400000 };
            return val * multipliers[unit];
        }

        function startDmWith(username) { if (username !== myUsername) switchTab(ensureDmTab(username)); }
        function handleTyping() { if (!isConnected || isMuted) return; clearTimeout(typingTimeout); publishMessage({ type: "TYPING", author: myUsername }); typingTimeout = setTimeout(() => {}, 3000); }

        function saveLocalHistory() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(messageHistory.slice(-100))); } catch(e){} }
        function loadLocalHistory() { const stored = localStorage.getItem(STORAGE_KEY); if (stored) { try { messageHistory = JSON.parse(stored); renderActiveTabMessages(); } catch(e){} } }
        function saveDmHistory(otherUser) { try { localStorage.setItem(`mqtt_dm_${myUsername}_${otherUser}`, JSON.stringify((dmHistories[otherUser]||[]).slice(-50))); } catch(e){} }
        function loadDmHistory(otherUser) { try { const s = localStorage.getItem(`mqtt_dm_${myUsername}_${otherUser}`); return s ? JSON.parse(s) : []; } catch(e){ return []; } }
        function publishMessage(data) { if (client && isConnected) client.publish(ROOM_TOPIC, JSON.stringify(data)); }

        /* --- SENDING & PARSING COMMANDS --- */
        function processInput() {
            const text = ui.msgIp.value.trim();
            if (!text) return;
            if (text.startsWith("/")) {
                if (!isAdmin) { appendSystemDOM("You do not have admin privileges."); ui.msgIp.value = ""; return; }
                const parts = text.split(" ");
                const cmd = parts[0].toUpperCase().substring(1);
                const target = parts[1];
                const dur = parseDuration(parts[2]);
                
                if (!target) { appendSystemDOM("Usage: /kick User, /timeout User 5m, /mute User 10m, /unmute User, /ban User"); return; }
                if (target === myUsername) { appendSystemDOM("You cannot use admin commands on yourself."); ui.msgIp.value = ""; return; }

                if (["KICK", "TIMEOUT", "MUTE", "UNMUTE", "BAN"].includes(cmd)) {
                    publishMessage({ type: "CMD", cmd: cmd, target: target, author: myUsername, duration: dur });
                    appendSystemDOM(`Command ${cmd} dispatched to ${target}.`);
                } else { appendSystemDOM("Unknown command."); }
                ui.msgIp.value = ""; return;
            }
            sendPayload(text);
        }

        function sendPayload(content, opts = {}) {
            if (isMuted) {
                mutedAttemptCount++; appendSystemDOM("You cannot send messages while muted.");
                publishMessage({ type: "MUTE_ATTEMPT", author: myUsername, count: mutedAttemptCount, id: generateId() }); ui.msgIp.value = ""; return;
            }

            const msgId = Date.now().toString(36) + Math.random().toString(36).substring(2, 5);
            const timestamp = Date.now();
            const cleanReply = activeReply ? { author: activeReply.author, text: activeReply.text, isImage: activeReply.isImage, isAudio: activeReply.isAudio, isFile: activeReply.isFile } : null;

            const payload = { type: currentTab === "global" ? "MSG" : "DM", id: msgId, author: myUsername, text: content, isImage: opts.isImage, isAudio: opts.isAudio, isFile: opts.isFile, fileName: opts.fileName, timestamp: timestamp, replyTo: cleanReply };
            
            if (currentTab !== "global") {
                payload.target = currentTab.replace("dm:", "");
                dmHistories[payload.target] = mergeHistory(dmHistories[payload.target] || [], [payload]);
                saveDmHistory(payload.target); appendMsgDOM(payload);
            }
            publishMessage(payload);

            ui.msgIp.value = ""; ui.typing.innerText = ""; cancelReply();
        }
    </script>
</body>
