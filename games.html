<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000080" />
  <title>Arcade Hub - Project Launcher</title>
  <link rel="icon" href="images/icon.JPG">
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ===== SUPPLEMENTARY STYLES FOR GAMES.HTML ===== */
    /* Adds specific grid sizing on top of existing styles.css framework */
    
    .arcade-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }

    .arcade-card {
      cursor: pointer;
    }
    
    .arcade-card .card-image {
      aspect-ratio: 1 / 1;
      background: var(--win-bg);
      border-bottom: 2px inset var(--win-border-dark);
      padding: 6px; 
    }

    .arcade-card .card-image img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      border: 2px inset var(--win-border-dark);
      background: var(--win-blue);
    }
    
    .arcade-card .card-body {
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
    }

    .arcade-card h3 {
      text-align: center;
      margin: 0;
      font-size: 1rem;
    }

    .status-container {
      grid-column: 1 / -1;
      padding: 40px;
      text-align: center;
      font-weight: bold;
      color: var(--win-text-dark);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- SVG CRT Subpixel Blur Filter -->
  <svg style="display: none;">
    <filter id="subpixel-blur">
      <feGaussianBlur stdDeviation="0.0425" />
    </filter>
  </svg>

  <div class="page-shell">
    
    <!-- Header -->
    <header>
      <div class="panel-dark">
        <div class="panel-title-bar w95-text">
          <span>ARCADE HUB</span>
          <span class="win-btns">
            <button type="button" class="win-btn btn-minimize" aria-label="Minimize">-</button>
            <button type="button" class="win-btn btn-maximize" aria-label="Maximize" disabled>□</button>
            <button type="button" class="win-btn btn-close" aria-label="Close" disabled>✕</button>
          </span>
        </div>
        <div class="panel-body">
          <div class="header-top-banner">GAME DIRECTORY</div>
          <h1>ARCADE HUB</h1>
          <p class="hero-copy">Browse, search, and play games directly from the repository.</p>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <div class="panel">
        <div class="panel-title-bar w95-text">
          <span>GAME LIBRARY</span>
          <span class="win-btns">
            <button type="button" class="win-btn btn-minimize" aria-label="Minimize">-</button>
            <button type="button" class="win-btn btn-maximize" aria-label="Maximize" disabled>□</button>
          </span>
        </div>
        <div class="panel-body">
          
          <!-- Search Toolbar -->
          <div class="controls-row">
            <p class="hint">Type to filter games below.</p>
            <div class="toolbar">
              <input type="text" id="search" class="search-input" placeholder="Search games..." style="width: 250px;">
              <button id="refresh-btn" class="sort-btn w95-text" onclick="fetchGames()">Refresh Lib</button>
            </div>
          </div>

          <!-- Game Grid -->
          <div id="grid" class="arcade-grid">
            <div class="status-container">Loading arcade library... please wait.</div>
          </div>

        </div>
      </div>
    </main>
    
    <!-- Footer -->
    <footer>
      <p>Powered by GitHub API</p>
      <p class="footer-note w95-text">Best viewed with a monitor</p>
    </footer>

  </div>

  <!-- Static Taskbar for aesthetic consistency -->
  <div class="taskbar">
    <button type="button" class="taskbar-start" onclick="window.location.href='index.html'">
      <img src="images/windows.png" alt="" width="16" height="16" style="vertical-align: middle; margin-right: 4px;" onerror="this.src='images/missing.png';" />
      Start
    </button>
    <div class="taskbar-spacer"></div>
    <div class="taskbar-status">
      <div class="taskbar-clock w95-text">Arcade Hub Active</div>
    </div>
  </div>

  <script>
    const REPO_OWNER = 'coltjbennett';
    const REPO_NAME = 'source';
    
    // Extensions/filenames to check for game icons
    const ICON_CANDIDATES = ['icon.png', 'icon.webp', 'icon.jpg', 'icon.svg', 'logo.png', 'app.png'];

    let games = [];

    // Fallback icon path
    const FALLBACK_ICON = 'images/missing.png'; 

    async function fetchGames() {
      const grid = document.getElementById('grid');
      grid.innerHTML = `<div class="status-container">Loading arcade library... please wait.</div>`;
      try {
        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`);
        if (!response.ok) throw new Error('Failed to fetch repo contents.');

        const data = await response.json();

        // Filter directories AND .swf files
        const validItems = data.filter(item => {
          if (item.name.startsWith('.')) return false;
          return item.type === 'dir' || (item.type === 'file' && item.name.toLowerCase().endsWith('.swf'));
        });

        if (validItems.length === 0) {
          grid.innerHTML = `<div class="status-container">No games or SWF files found in repository.</div>`;
          return;
        }

        games = validItems.map(item => {
          const isSwf = item.type === 'file' && item.name.toLowerCase().endsWith('.swf');
          const baseName = isSwf ? item.name.replace(/\.swf$/i, '') : item.name;

          return {
            name: item.name,
            baseName: baseName, // Used for icon fetching
            title: formatTitle(baseName),
            path: isSwf 
              ? `https://coltjbennett.github.io/source/${item.name}` 
              : `https://coltjbennett.github.io/source/${item.name}/index.html`,
            isSwf: isSwf
          };
        });

        renderGrid(games);
      } catch (err) {
        grid.innerHTML = `<div class="status-container">Error loading games. Please check repository settings or API limits.</div>`;
        console.error(err);
      }
    }

    function formatTitle(folderName) {
      return folderName
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function renderGrid(gameList) {
      const grid = document.getElementById('grid');
      if (gameList.length === 0) {
        grid.innerHTML = `<div class="status-container">No games matching your search.</div>`;
        return;
      }

      grid.innerHTML = gameList.map((game) => `
        <div class="project-card arcade-card" onclick="openGame('${game.path}', ${game.isSwf}, '${game.title.replace(/'/g, "\\'")}')">
          <div class="card-image">
            <img 
              src="https://coltjbennett.github.io/source/${game.baseName}/icon.png" 
              alt="${game.title}"
              onerror="tryNextIcon(this, '${game.baseName}', 1)"
            />
          </div>
          <div class="card-body">
            <h3>${game.title}</h3>
          </div>
        </div>
      `).join('');
    }

    // Function to handle cascading fallback for game icons
    function tryNextIcon(imgElement, folderName, index) {
      if (index < ICON_CANDIDATES.length) {
        imgElement.onerror = () => tryNextIcon(imgElement, folderName, index + 1);
        imgElement.src = `https://coltjbennett.github.io/source/${folderName}/${ICON_CANDIDATES[index]}`;
      } else {
        imgElement.onerror = null;
        imgElement.src = FALLBACK_ICON;
      }
    }

    // Search Filtering
    document.getElementById('search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = games.filter(g => g.title.toLowerCase().includes(term) || g.name.toLowerCase().includes(term));
      renderGrid(filtered);
    });

    // Handle opening games in a new tab
    function openGame(url, isSwf, title) {
      if (isSwf) {
        // Dynamically build a new tab featuring the official Ruffle web player
        const newWindow = window.open('', '_blank');
        newWindow.document.write(`
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>${title} - Ruffle Arcade</title>
              <style>
                  body { 
                      margin: 0; 
                      padding: 0; 
                      background-color: #000; 
                      overflow: hidden; 
                      height: 100vh; 
                      width: 100vw; 
                      display: flex;
                      align-items: center;
                      justify-content: center;
                  }
                  #ruffle-container { width: 100%; height: 100%; }
              </style>
          </head>
          <body>
              <div id="ruffle-container"></div>
              <!-- Official Ruffle Script -->
              <script src="https://unpkg.com/@ruffle-rs/ruffle"><\\/script>
              <script>
                  window.RufflePlayer = window.RufflePlayer || {};
                  window.addEventListener("load", () => {
                      const ruffle = window.RufflePlayer.newest();
                      const player = ruffle.createPlayer();
                      player.style.width = "100%";
                      player.style.height = "100%";
                      document.getElementById("ruffle-container").appendChild(player);
                      
                      // Load the SWF from the raw URL
                      player.load("${url}");
                  });
              <\\/script>
          </body>
          </html>
        `);
        newWindow.document.close();
      } else {
        // Standard HTML5 games just open directly
        window.open(url, '_blank');
      }
    }

    // Initialize
    fetchGames();
  </script>
</body>
</html>
