<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000080" />
  <title>the Web Arcade</title>
  <link rel="icon" href="images/icon.JPG">
  <link rel="stylesheet" href="styles.css" />
  
  <!-- Preload Ruffle Globally -->
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
  </script>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    /* Arcade Hub is an application running INSIDE the ColtonOS desktop.
       Keep the desktop shell outside this document; this page is the app window. */
    html, body { width:100%; height:100%; min-height:0; margin:0; overflow:hidden; background:var(--face,#c0c0c0); color:var(--text,#000); }
    body { font-family:var(--ui-font,"W95FA","MS Sans Serif",Tahoma,sans-serif); font-size:14px; }
    button, input { font:inherit; }
    .app-shell { height:100%; min-height:0; display:flex; flex-direction:column; padding:4px; gap:3px; background:var(--face,#c0c0c0); }
    .titlebar { height:22px; flex:none; display:flex; align-items:center; gap:5px; padding:2px 3px; color:#fff; background:var(--title-a,#000080); font-weight:bold; user-select:none; }
    .titlebar img { width:16px; height:16px; object-fit:contain; }
    .titlebar .title { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .window-controls { display:flex; gap:2px; }
    .window-controls button { width:18px; height:18px; min-width:18px; min-height:18px; padding:0; line-height:14px; font-weight:bold; border:0; border-radius:0; color:#000; background:var(--face,#c0c0c0); box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf; }
    .menubar { flex:none; display:flex; gap:0; padding:0 2px; }
    .menubar button { border:0; background:transparent; color:var(--text,#000); padding:4px 8px; }
    .menubar button:hover, .menubar button:focus-visible { box-shadow:inset -1px -1px #fff,inset 1px 1px #808080; outline:none; }
    .toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding:5px; border-top:1px solid #808080; box-shadow:0 -1px #fff; }
    .toolbar label { white-space:nowrap; }
    .field { flex:1; min-width:100px; width:auto; background:#fff; color:#000; border:0; border-radius:0; min-height:25px; padding:4px 6px; box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #000; }
    .btn { min-height:25px; padding:3px 12px; border:0; border-radius:0; background:var(--face,#c0c0c0); color:#000; box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf; }
    .btn:active { padding:4px 11px 2px 13px; box-shadow:inset -1px -1px #fff,inset 1px 1px #000,inset -2px -2px #dfdfdf,inset 2px 2px #808080; }
    .intro { flex:none; padding:7px 8px 5px; }
    .intro strong { display:block; font-size:16px; margin-bottom:3px; }
    .intro p { margin:0; }
    .library { flex:1; min-height:0; display:flex; flex-direction:column; background:#fff; color:#000; border:0; box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #000; }
    .library-heading { flex:none; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 7px; background:var(--face,#c0c0c0); color:#000; border-bottom:1px solid #808080; box-shadow:0 1px #fff; font-weight:bold; }
    .library-heading span:last-child { font-weight:normal; font-size:12px; }
    .arcade-grid { flex:1; min-height:0; overflow:auto; display:grid; align-content:start; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:8px; padding:8px; background:#fff; }
    .arcade-card { min-width:0; overflow:hidden; display:flex; flex-direction:column; background:var(--face,#c0c0c0); color:#000; border:0; border-radius:0; box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf; cursor:pointer; text-align:left; padding:3px; }
    .arcade-card:hover { outline:1px dotted #000; outline-offset:-4px; }
    .arcade-card:focus-visible { outline:1px dotted #000; outline-offset:-4px; }
    .card-image { aspect-ratio:1/1; padding:4px; background:#fff; box-shadow:inset -1px -1px #fff,inset 1px 1px #808080; }
    .card-image img { display:block; width:100%; height:100%; object-fit:contain; background:#fff; image-rendering:auto; }
    .card-body { min-height:36px; display:flex; align-items:center; justify-content:center; padding:5px 4px 3px; text-align:center; }
    .card-body h3 { margin:0; font-size:14px; line-height:1.2; font-weight:normal; overflow-wrap:anywhere; }
    .status-container { grid-column:1/-1; padding:28px 12px; text-align:center; color:#000; line-height:1.5; }
    .status-container.error { text-align:left; }
    .status-container button { margin-top:8px; }
    .statusbar { flex:none; display:flex; gap:3px; padding-top:2px; }
    .statusbar span { min-width:0; flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:3px 5px; background:var(--face,#c0c0c0); box-shadow:inset 1px 1px #808080,inset -1px -1px #fff; }
    #game-modal { position:absolute; inset:4px; z-index:20; display:none; flex-direction:column; padding:3px; background:var(--face,#c0c0c0); box-shadow:0 0 0 2px var(--face,#c0c0c0),inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf; }
    #game-modal .titlebar { flex:none; }
    #game-container { flex:1; min-height:0; width:100%; overflow:hidden; background:#000; box-shadow:inset 1px 1px #000; }
    #game-container iframe, #game-container ruffle-player { display:block; width:100%; height:100%; border:0; background:#000; }
    @media (max-width:480px) { .app-shell { padding:3px; } .arcade-grid { grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:6px; padding:6px; } .toolbar { align-items:stretch; } .field { flex-basis:100%; } .intro { padding:5px; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="titlebar">
      <img src="images/icon.JPG" alt="">
      <span class="title">Arcade Hub</span>
      <span class="window-controls">
        <button type="button" aria-label="Minimize" title="Minimize" id="minimize-app">_</button>
        <button type="button" aria-label="Maximize" title="Maximize" disabled>□</button>
        <button type="button" aria-label="Close" title="Close" id="close-app">×</button>
      </span>
    </div>
    <nav class="menubar" aria-label="Application menu">
      <button type="button" id="menu-file">File</button>
      <button type="button" id="menu-view">View</button>
      <button type="button" id="menu-help">Help</button>
    </nav>
    <section class="intro">
      <strong>Web Arcade</strong>
      <p>Browse and launch third-party games hosted in the repository. These are not games made by ColtonOS.</p>
    </section>
    <div class="toolbar">
      <label for="search">Find:</label>
      <input type="search" id="search" class="field" placeholder="Search games..." autocomplete="off">
      <button id="refresh-btn" class="btn" type="button">Refresh</button>
    </div>
    <section class="library" aria-label="Game library">
      <div class="library-heading"><span>Game Library</span><span id="game-count">Loading directory…</span></div>
      <div id="grid" class="arcade-grid" aria-live="polite">
        <div class="status-container">Loading arcade library… please wait.</div>
      </div>
    </section>
    <div class="statusbar"><span id="status-message">Ready</span><span id="status-count">Connecting to GitHub API…</span></div>
  </div>

  <div id="game-modal" role="dialog" aria-modal="true" aria-label="Game player">
    <div class="titlebar">
      <img src="images/icon.JPG" alt="">
      <span id="modal-title" class="title">Game Player</span>
      <span class="window-controls">
        <button type="button" class="btn-close" id="close-game" aria-label="Close game" title="Close game">×</button>
      </span>
    </div>
    <div id="game-container"></div>
  </div>

  <script>
    const REPO_OWNER = 'coltjbennett';
    const REPO_NAME = 'source';
    const BRANCH = 'main'; 
    
    // Updated to Githack to ensure HTML and SWF files execute rather than render as text
    const CDN_BASE = `https://raw.githack.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}`;
    
    const ICON_CANDIDATES = ['icon.png', 'icon.webp', 'icon.jpg', 'icon.jpeg', 'logo.jpeg', 'logo.jpg', 'icon.svg', 'logo.png', 'app.png'];
    const FALLBACK_ICON = 'images/missing.png';

    let games = [];

    function safeStorageGet(key) {
      try { return localStorage.getItem(key); } catch (error) { return null; }
    }

    function safeStorageSet(key, value) {
      try { localStorage.setItem(key, value); } catch (error) { /* cache is optional */ }
    }

    async function fetchGames(forceRefresh = false) {
      const grid = document.getElementById('grid');
      if (forceRefresh) {
        grid.innerHTML = `<div class="status-container">Forcing API refresh... please wait.</div>`;
      } else {
        grid.innerHTML = `<div class="status-container">Loading arcade library... please wait.</div>`;
      }
      
      let cachedData = safeStorageGet('arcade_games_cache');
      try {
        let data;
        const lastFetchDate = safeStorageGet('arcade_games_cache_date');
        const today = new Date().toDateString();
        const needsDailyUpdate = lastFetchDate !== today;

        if (cachedData && !forceRefresh && !needsDailyUpdate) {
          data = JSON.parse(cachedData);
        } else {
          const request = new Request(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`, { cache: 'no-store' });
        const response = await fetch(request);
          
          if (response.status === 403 || response.status === 429) {
            if (cachedData) {
              console.warn('API rate limit reached. Falling back to cached data.');
              data = JSON.parse(cachedData);
            } else {
              throw new Error('GitHub API rate limit exceeded (60 requests per hour). No local cache available to load.');
            }
          } else if (!response.ok) {
            throw new Error('Failed to fetch repo contents.');
          } else {
            data = await response.json();
            safeStorageSet('arcade_games_cache', JSON.stringify(data));
            safeStorageSet('arcade_games_cache_date', today);
          }
        }

        if (!Array.isArray(data)) throw new Error('GitHub returned an unexpected directory listing.');

        const validItems = data.filter(item => {
          if (!item || typeof item.name !== 'string' || typeof item.type !== 'string') return false;
          if (item.name.startsWith('.')) return false;
          return item.type === 'dir' || (item.type === 'file' && item.name.toLowerCase().endsWith('.swf'));
        });

        if (validItems.length === 0) {
          grid.innerHTML = `<div class="status-container">No games or SWF files found in repository.</div>`;
          return;
        }

        games = validItems.map(item => {
          const isSwf = item.type === 'file' && item.name.toLowerCase().endsWith('.swf');
          const baseName = isSwf ? item.name.replace(/\.swf$/i, '') : item.name;

          return {
            name: item.name,
            baseName: baseName, 
            title: formatTitle(baseName),
            path: isSwf 
              ? `${CDN_BASE}/${encodeURIComponent(item.name)}` 
              : `${CDN_BASE}/${encodeURIComponent(item.name)}/index.html`,
            isSwf: isSwf
          };
        });

        renderGrid(games);
      } catch (err) {
        // The directory snapshot is already kept in localStorage; avoid a
      // duplicate Cache Storage copy.
      if (cachedData) {
        try {
          games = JSON.parse(cachedData).filter(item => item && typeof item.name === 'string' && (item.type === 'dir' || (item.type === 'file' && item.name.toLowerCase().endsWith('.swf')))).map(item => {
            const isSwf = item.type === 'file' && item.name.toLowerCase().endsWith('.swf');
            const baseName = isSwf ? item.name.replace(/\.swf$/i, '') : item.name;
            return { name:item.name, baseName, title:formatTitle(baseName), path:isSwf ? `${CDN_BASE}/${encodeURIComponent(item.name)}` : `${CDN_BASE}/${encodeURIComponent(item.name)}/index.html`, isSwf };
          });
          renderGrid(games);
          const note = document.createElement('div');
          note.className = 'status-container';
          note.textContent = 'Showing the last cached Arcade Hub directory.';
          grid.prepend(note);
          console.warn(err);
          return;
        } catch (localCacheError) {
          console.warn('Arcade local snapshot fallback failed:', localCacheError);
        }
      }
        grid.replaceChildren();
        const errorBox = document.createElement('div');
        errorBox.className = 'status-container error';
        errorBox.textContent = `Unable to load the arcade directory: ${err.message}`;
        grid.appendChild(errorBox);
        setStatus('Directory load failed');
        console.error(err);
      }
    }

    function formatTitle(folderName) {
      return folderName
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function renderGrid(gameList) {
      const grid = document.getElementById('grid');
      grid.replaceChildren();
      const count = document.getElementById('game-count');
      const statusCount = document.getElementById('status-count');
      if (count) count.textContent = `${gameList.length} item${gameList.length === 1 ? '' : 's'}`;
      if (statusCount) statusCount.textContent = `${games.length} games and folders found`;

      if (gameList.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'status-container';
        empty.textContent = 'No games matching your search.';
        grid.appendChild(empty);
        return;
      }

      gameList.forEach((game) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'arcade-card';
        card.setAttribute('aria-label', `Open ${game.title}`);
        card.addEventListener('click', () => openGame(game.path, game.isSwf, game.title));
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openGame(game.path, game.isSwf, game.title);
          }
        });

        const imageWrap = document.createElement('div');
        imageWrap.className = 'card-image';
        const img = document.createElement('img');
        img.alt = game.title;
        img.loading = 'lazy';
        img.decoding = 'async';
        img.onerror = () => tryNextIcon(img, game.baseName, 0);
        img.src = `${CDN_BASE}/${encodeURIComponent(game.baseName)}/icon.png`;
        imageWrap.appendChild(img);

        const body = document.createElement('div');
        body.className = 'card-body';
        const heading = document.createElement('h3');
        heading.textContent = game.title;
        body.appendChild(heading);

        card.append(imageWrap, body);
        grid.appendChild(card);
      });
    }

    function tryNextIcon(imgElement, folderName, index) {
      if (index < ICON_CANDIDATES.length) {
        imgElement.onerror = () => tryNextIcon(imgElement, folderName, index + 1);
        imgElement.src = `${CDN_BASE}/${encodeURIComponent(folderName)}/${encodeURIComponent(ICON_CANDIDATES[index])}`;
      } else {
        imgElement.onerror = null;
        imgElement.src = FALLBACK_ICON;
      }
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = games.filter(g => g.title.toLowerCase().includes(term) || g.name.toLowerCase().includes(term));
      renderGrid(filtered);
    });

    // ===== ACTIVE GAME SYNC =====
    // Arcade Hub reports the game currently occupying its own viewport to the
    // parent launcher. The parent then forwards the activity to the chatroom.
    let activeArcadeGameTitle = "";
    let arcadeActivityTimer = null;

    function notifyParentActivity(name, active = true) {
      if (!window.parent || window.parent === window) return;

      window.parent.postMessage({
        source: 'arcade-hub',
        kind: 'activity',
        active,
        name: name || 'Arcade Hub',
        activityKind: name && name !== 'Arcade Hub' ? 'arcade-game' : 'arcade'
      }, window.location.origin);
    }

    function stopArcadeActivityMonitor() {
      if (arcadeActivityTimer) {
        clearInterval(arcadeActivityTimer);
        arcadeActivityTimer = null;
      }
    }

    function startArcadeActivityMonitor(title) {
      stopArcadeActivityMonitor();

      activeArcadeGameTitle = title || "";
      notifyParentActivity(activeArcadeGameTitle || 'Arcade Hub', true);

      // Cross-origin HTML5 game iframes cannot be inspected directly. The
      // Arcade Hub can still see which child iframe currently has focus.
      arcadeActivityTimer = setInterval(() => {
        if (document.hidden || !activeArcadeGameTitle) return;

        const modal = document.getElementById('game-modal');
        if (!modal || modal.style.display === 'none') return;

        const gameFrame = document.querySelector('#game-container iframe');
        const rufflePlayer = document.querySelector('#game-container ruffle-player, #game-container > ruffle-player');

        if (gameFrame && document.activeElement === gameFrame) {
          notifyParentActivity(activeArcadeGameTitle, true);
        } else if (rufflePlayer && (
          document.activeElement === rufflePlayer ||
          rufflePlayer.matches(':focus-within')
        )) {
          notifyParentActivity(activeArcadeGameTitle, true);
        }
      }, 500);
    }

    function notifyArcadeHubActivity() {
      stopArcadeActivityMonitor();
      activeArcadeGameTitle = "";
      notifyParentActivity('Arcade Hub', true);
    }

    // Opens both HTML5 and Flash/SWF games to fill the entire Arcade Hub window
    function openGame(url, isSwf, title) {
      const modal = document.getElementById('game-modal');
      const container = document.getElementById('game-container');
      let safeUrl;
      try {
        safeUrl = new URL(url, window.location.href);
      } catch (error) {
        console.error('Invalid game URL:', error);
        return;
      }
      if (safeUrl.protocol !== 'https:' && safeUrl.protocol !== 'http:') {
        console.error('Blocked unsupported game URL scheme:', safeUrl.protocol);
        return;
      }

      // Update Title Bar
      document.getElementById('modal-title').innerText = title + (isSwf ? ' - Flash Arcade' : ' - HTML Arcade');

      // Clear previous content
      container.replaceChildren();

      if (isSwf) {
        // Embed Ruffle Player for SWF files
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        player.style.width = '100%';
        player.style.height = '100%';

        container.appendChild(player);
        player.load(safeUrl.href);

        player.addEventListener('mousedown', () => notifyParentActivity(title, true));
        player.addEventListener('touchstart', () => notifyParentActivity(title, true), { passive: true });
      } else {
        // Embed iframe for HTML5 games
        const iframe = document.createElement('iframe');
        iframe.src = safeUrl.href;
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.allow = 'autoplay; fullscreen; keyboard';
        iframe.referrerPolicy = 'no-referrer';
        iframe.title = title;

        iframe.addEventListener('load', () => {
          notifyParentActivity(title, true);
        });

        container.appendChild(iframe);
      }

      // Display full game viewport
      modal.style.display = 'flex';
      setStatus(`Playing: ${title}`);

      // Tell the parent immediately, then keep checking child-frame focus.
      startArcadeActivityMonitor(title);
    }

    // Close Game Viewport and return to game library
    function closeModal() {
      const modal = document.getElementById('game-modal');
      const container = document.getElementById('game-container');

      modal.style.display = 'none';
      container.replaceChildren();
      setStatus('Ready');
      notifyArcadeHubActivity();
    }

    // The Arcade Hub itself is an active site window once it has loaded.
    window.addEventListener('load', () => {
      notifyArcadeHubActivity();
    });

    window.addEventListener('mousedown', (event) => {
      // Clicking the game modal's controls or library means Arcade Hub is
      // the active floating window. Opening a game immediately reasserts
      // the game title through openGame().
      if (event.target.closest('#game-modal') || event.target.closest('.arcade-card')) {
        notifyParentActivity(activeArcadeGameTitle || 'Arcade Hub', true);
      }
    }, true);

    window.addEventListener('beforeunload', () => {
      notifyParentActivity('Arcade Hub', false);
    });

    document.getElementById('refresh-btn').addEventListener('click', () => fetchGames(true));
    document.getElementById('close-game').addEventListener('click', closeModal);
    document.getElementById('close-app').addEventListener('click', () => {
      closeModal();
      setStatus('Close Arcade Hub using the window controls on the desktop.');
    });
    document.getElementById('minimize-app').addEventListener('click', () => {
      setStatus('Use the desktop taskbar to minimize Arcade Hub.');
    });
    document.getElementById('menu-file').addEventListener('click', () => {
      closeModal();
      document.getElementById('search').value = '';
      renderGrid(games);
      document.getElementById('search').focus();
      setStatus('Library view restored');
    });
    document.getElementById('menu-view').addEventListener('click', () => {
      document.getElementById('search').focus();
      setStatus('Type in Find to filter the library');
    });
    document.getElementById('menu-help').addEventListener('click', () => {
      setStatus('Arcade Hub: select a game to launch it. Close the game to return.');
    });
    function setStatus(message) {
      const status = document.getElementById('status-message');
      if (status) status.textContent = message;
    }
    fetchGames(false);
  </script>
</body>
</html>
