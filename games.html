<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000080" />
  <title>Arcade Hub - Project Launcher</title>
  <link rel="icon" href="images/icon.JPG">
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ===== SUPPLEMENTARY STYLES FOR GAMES.HTML ===== */
    .arcade-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }

    .arcade-card {
      cursor: pointer;
    }
    
    .arcade-card .card-image {
      aspect-ratio: 1 / 1;
      background: var(--win-bg);
      border-bottom: 2px inset var(--win-border-dark);
      padding: 6px; 
    }

    .arcade-card .card-image img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      border: 2px inset var(--win-border-dark);
      background: var(--win-blue);
    }
    
    .arcade-card .card-body {
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
    }

    .arcade-card h3 {
      text-align: center;
      margin: 0;
      font-size: 1rem;
    }

    .status-container {
      grid-column: 1 / -1;
      padding: 40px;
      text-align: center;
      font-weight: bold;
      color: var(--win-text-dark);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- SVG CRT Subpixel Blur Filter -->
  <svg style="display: none;">
    <filter id="subpixel-blur">
      <feGaussianBlur stdDeviation="0.0425" />
    </filter>
  </svg>

  <div class="page-shell">
    
    <header>
      <div class="panel-dark">
        <div class="panel-title-bar w95-text">
          <span>ARCADE HUB</span>
        </div>
        <div class="panel-body">
          <div class="header-top-banner">GAME DIRECTORY</div>
          <h1>ARCADE HUB</h1>
          <p class="hero-copy">Browse, search, and play games directly from the repository.</p>
        </div>
      </div>
    </header>

    <main>
      <div class="panel">
        <div class="panel-title-bar w95-text">
          <span>GAME LIBRARY</span>
        </div>
        <div class="panel-body">
          
          <div class="controls-row">
            <p class="hint">Type to filter games below.</p>
            <div class="toolbar">
              <input type="text" id="search" class="search-input" placeholder="Search games..." style="width: 250px;">
              <button id="refresh-btn" class="sort-btn w95-text" onclick="fetchGames()">Refresh Lib</button>
            </div>
          </div>

          <div id="grid" class="arcade-grid">
            <div class="status-container">Loading arcade library... please wait.</div>
          </div>

        </div>
      </div>
    </main>
    
    <footer>
      <p>Powered by GitHub API</p>
      <p class="footer-note w95-text">Best viewed with a monitor</p>
    </footer>

  </div>

  <div class="taskbar">
    <button type="button" class="taskbar-start" onclick="window.location.href='index.html'">
      <img src="images/windows.png" alt="" width="16" height="16" style="vertical-align: middle; margin-right: 4px;" onerror="this.src='images/missing.png';" />
      Start
    </button>
    <div class="taskbar-spacer"></div>
    <div class="taskbar-status">
      <div class="taskbar-clock w95-text">Arcade Hub Active</div>
    </div>
  </div>

  <script>
    const REPO_OWNER = 'coltjbennett';
    const REPO_NAME = 'source';
    const ICON_CANDIDATES = ['icon.png', 'icon.webp', 'icon.jpg', 'icon.svg', 'logo.png', 'app.png'];
    const FALLBACK_ICON = 'images/missing.png'; 

    let games = [];

    async function fetchGames() {
      const grid = document.getElementById('grid');
      grid.innerHTML = `<div class="status-container">Loading arcade library... please wait.</div>`;
      try {
        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`);
        if (!response.ok) throw new Error('Failed to fetch repo contents.');

        const data = await response.json();

        // 1. Fetch HTML folders
        const htmlGames = data
          .filter(item => item.type === 'dir' && !item.name.startsWith('.'))
          .map(folder => ({
            name: folder.name,
            title: formatTitle(folder.name),
            path: `https://coltjbennett.github.io/source/${folder.name}/index.html`,
            type: 'html',
            iconBase: folder.name
          }));

        // 2. Fetch SWF files at root
        const swfGames = data
          .filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.swf'))
          .map(file => ({
            name: file.name,
            title: formatTitle(file.name.replace(/\.swf$/i, '')),
            path: `https://coltjbennett.github.io/source/${file.name}`,
            type: 'swf',
            iconBase: file.name.replace(/\.swf$/i, '') // Assumes an icon might be named like the swf file folder if it existed
          }));

        games = [...htmlGames, ...swfGames];

        if (games.length === 0) {
          grid.innerHTML = `<div class="status-container">No games found in repository.</div>`;
          return;
        }

        renderGrid(games);
      } catch (err) {
        grid.innerHTML = `<div class="status-container">Error loading games. Please check repository settings or API limits.</div>`;
        console.error(err);
      }
    }

    function formatTitle(str) {
      return str
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function renderGrid(gameList) {
      const grid = document.getElementById('grid');
      if (gameList.length === 0) {
        grid.innerHTML = `<div class="status-container">No games matching your search.</div>`;
        return;
      }

      grid.innerHTML = gameList.map((game) => `
        <div class="project-card arcade-card" onclick="openGame('${game.path}', '${game.title.replace(/'/g, "\\'")}', '${game.type}')">
          <div class="card-image">
            <img 
              src="https://coltjbennett.github.io/source/${game.iconBase}/icon.png" 
              alt="${game.title}"
              onerror="tryNextIcon(this, '${game.iconBase}', 1)"
            />
          </div>
          <div class="card-body">
            <h3>${game.title}</h3>
          </div>
        </div>
      `).join('');
    }

    function tryNextIcon(imgElement, folderName, index) {
      if (index < ICON_CANDIDATES.length) {
        imgElement.onerror = () => tryNextIcon(imgElement, folderName, index + 1);
        imgElement.src = `https://coltjbennett.github.io/source/${folderName}/${ICON_CANDIDATES[index]}`;
      } else {
        imgElement.onerror = null;
        imgElement.src = FALLBACK_ICON;
      }
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = games.filter(g => g.title.toLowerCase().includes(term) || g.name.toLowerCase().includes(term));
      renderGrid(filtered);
    });

    function openGame(url, title, type) {
      if (type === 'swf') {
        // Create a new tab and inject Ruffle Player dynamically
        const newWin = window.open('', '_blank');
        if (newWin) {
          newWin.document.write(`
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <title>${title}</title>
              <style>
                body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
                #ruffle-container { width: 100%; height: 100%; }
              </style>
            </head>
            <body>
              <div id="ruffle-container"></div>
              <script src="https://unpkg.com/@ruffle-rs/ruffle"><\/script>
              <script>
                window.addEventListener('DOMContentLoaded', () => {
                  const ruffle = window.RufflePlayer.newest();
                  const player = ruffle.createPlayer();
                  const container = document.getElementById('ruffle-container');
                  container.appendChild(player);
                  player.style.width = '100%';
                  player.style.height = '100%';
                  player.load({ url: '${url}', allowScriptAccess: true });
                });
              <\/script>
            </body>
            </html>
          `);
          newWin.document.close();
        } else {
          alert("Popup blocked! Please allow popups to open this game.");
        }
      } else {
        // Standard HTML game opening
        window.open(url, '_blank');
      }
    }

    // Initialize
    fetchGames();
  </script>
</body>
</html>
