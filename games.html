<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000080" />
  <title>Arcade Hub - Project Launcher</title>
  <link rel="icon" href="images/icon.JPG">
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ===== SUPPLEMENTARY STYLES FOR GAMES.HTML ===== */
    /* Adds specific grid and modal sizing on top of existing styles.css framework */
    
    .arcade-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }

    .arcade-card {
      cursor: pointer;
    }
    
    .arcade-card .card-image {
      aspect-ratio: 1 / 1;
      background: var(--win-bg);
      border-bottom: 2px inset var(--win-border-dark);
      padding: 6px; 
    }

    .arcade-card .card-image img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      border: 2px inset var(--win-border-dark);
      background: var(--win-blue);
    }
    
    .arcade-card .card-body {
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
    }

    .arcade-card h3 {
      text-align: center;
      margin: 0;
      font-size: 1rem;
    }

    .status-container {
      grid-column: 1 / -1;
      padding: 40px;
      text-align: center;
      font-weight: bold;
      color: var(--win-text-dark);
      font-size: 1.1rem;
    }

    /* Adjusted Modal for Games */
    .game-modal-box {
      max-width: 850px;
      width: 95%;
      height: 85vh;
    }

    .game-modal-box .panel-body {
      padding: 0;
      display: flex;
      flex-direction: column;
      height: calc(100% - 28px); /* Account for title bar */
      background: var(--win-text-dark);
    }

    .game-modal-iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #000;
    }
  </style>
</head>
<body>

  <!-- SVG CRT Subpixel Blur Filter (Copied from index.html) -->
  <svg style="display: none;">
    <filter id="subpixel-blur">
      <feGaussianBlur stdDeviation="0.0425" />
    </filter>
  </svg>

  <div class="page-shell">
    
    <!-- Header -->
    <header>
      <div class="panel-dark">
        <div class="panel-title-bar w95-text">
          <span>ARCADE HUB</span>
          <span class="win-btns">
            <button type="button" class="win-btn btn-minimize" aria-label="Minimize">-</button>
            <button type="button" class="win-btn btn-maximize" aria-label="Maximize" disabled>□</button>
            <button type="button" class="win-btn btn-close" aria-label="Close" disabled>✕</button>
          </span>
        </div>
        <div class="panel-body">
          <div class="header-top-banner">GAME DIRECTORY</div>
          <h1>ARCADE HUB</h1>
          <p class="hero-copy">Browse, search, and play games directly from the repository.</p>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <div class="panel">
        <div class="panel-title-bar w95-text">
          <span>GAME LIBRARY</span>
          <span class="win-btns">
            <button type="button" class="win-btn btn-minimize" aria-label="Minimize">-</button>
            <button type="button" class="win-btn btn-maximize" aria-label="Maximize" disabled>□</button>
          </span>
        </div>
        <div class="panel-body">
          
          <!-- Search Toolbar -->
          <div class="controls-row">
            <p class="hint">Type to filter games below.</p>
            <div class="toolbar">
              <input type="text" id="search" class="search-input" placeholder="Search games..." style="width: 250px;">
              <button id="refresh-btn" class="sort-btn w95-text" onclick="fetchGames()">Refresh Lib</button>
            </div>
          </div>

          <!-- Game Grid -->
          <div id="grid" class="arcade-grid">
            <div class="status-container">Loading arcade library... please wait.</div>
          </div>

        </div>
      </div>
    </main>
    
    <!-- Footer -->
    <footer>
      <p>Powered by GitHub API</p>
      <p class="footer-note w95-text">Best viewed with a monitor</p>
    </footer>

  </div>

  <!-- Game Modal (Modeled after tos-overlay) -->
  <div id="game-modal" class="tos-overlay">
    <div class="panel game-modal-box">
      <div class="panel-title-bar w95-text">
        <span id="modal-title">Game Title</span>
        <span class="win-btns">
          <a id="modal-external-link" href="#" target="_blank" class="win-btn" style="text-decoration: none; line-height: 10px; font-size: 0.7rem;" title="Launch in New Tab">↗</a>
          <button id="modal-close" type="button" class="win-btn" title="Close">✕</button>
        </span>
      </div>
      <div class="panel-body">
        <iframe id="game-iframe" class="game-modal-iframe" src="" allow="autoplay; keyboard; fullscreen"></iframe>
      </div>
    </div>
  </div>

  <!-- Optional Static Taskbar for aesthetic consistency -->
  <div class="taskbar">
    <button type="button" class="taskbar-start" onclick="window.location.href='index.html'">
      <img src="images/windows.png" alt="" width="16" height="16" style="vertical-align: middle; margin-right: 4px;" onerror="this.src='images/missing.png';" />
      Start
    </button>
    <div class="taskbar-spacer"></div>
    <div class="taskbar-status">
      <div class="taskbar-clock w95-text">Arcade Hub Active</div>
    </div>
  </div>

  <script>
    const REPO_OWNER = 'coltjbennett';
    const REPO_NAME = 'source';
    
    // Extensions/filenames to check for game icons
    const ICON_CANDIDATES = ['icon.png', 'icon.webp', 'icon.jpg', 'icon.svg', 'logo.png', 'app.png'];

    let games = [];

    // Base64 or standard URL for fallback icon (Can be replaced with a path to a generic icon in your images/ folder)
    const FALLBACK_ICON = 'images/missing.png'; 

    async function fetchGames() {
      const grid = document.getElementById('grid');
      grid.innerHTML = `<div class="status-container">Loading arcade library... please wait.</div>`;
      try {
        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`);
        if (!response.ok) throw new Error('Failed to fetch repo contents.');

        const data = await response.json();

        // Filter only directories (excluding hidden ones like .github)
        const folders = data.filter(item => item.type === 'dir' && !item.name.startsWith('.'));

        if (folders.length === 0) {
          grid.innerHTML = `<div class="status-container">No game folders found in repository.</div>`;
          return;
        }

        games = folders.map(folder => ({
          name: folder.name,
          title: formatTitle(folder.name),
          path: `https://coltjbennett.github.io/source/${folder.name}/index.html`
        }));

        renderGrid(games);
      } catch (err) {
        grid.innerHTML = `<div class="status-container">Error loading games. Please check repository settings or API limits.</div>`;
        console.error(err);
      }
    }

    function formatTitle(folderName) {
      return folderName
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function renderGrid(gameList) {
      const grid = document.getElementById('grid');
      if (gameList.length === 0) {
        grid.innerHTML = `<div class="status-container">No games matching your search.</div>`;
        return;
      }

      grid.innerHTML = gameList.map((game) => `
        <div class="project-card arcade-card" onclick="openGame('${game.path}', '${game.title.replace(/'/g, "\\'")}')">
          <div class="card-image">
            <img 
              src="https://coltjbennett.github.io/source/${game.name}/icon.png" 
              alt="${game.title}"
              onerror="tryNextIcon(this, '${game.name}', 1)"
            />
          </div>
          <div class="card-body">
            <h3>${game.title}</h3>
          </div>
        </div>
      `).join('');
    }

    // Function to handle cascading fallback for game icons
    function tryNextIcon(imgElement, folderName, index) {
      if (index < ICON_CANDIDATES.length) {
        imgElement.onerror = () => tryNextIcon(imgElement, folderName, index + 1);
        imgElement.src = `https://coltjbennett.github.io/source/${folderName}/${ICON_CANDIDATES[index]}`;
      } else {
        imgElement.onerror = null;
        imgElement.src = FALLBACK_ICON;
      }
    }

    // Search Filtering
    document.getElementById('search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = games.filter(g => g.title.toLowerCase().includes(term) || g.name.toLowerCase().includes(term));
      renderGrid(filtered);
    });

    // Modal Player Handling
    const modal = document.getElementById('game-modal');
    const iframe = document.getElementById('game-iframe');
    const modalTitle = document.getElementById('modal-title');
    const externalLink = document.getElementById('modal-external-link');
    const closeBtn = document.getElementById('modal-close');

    function openGame(url, title) {
      iframe.src = url;
      modalTitle.textContent = title;
      externalLink.href = url;
      modal.style.display = 'flex'; // Uses flex to center similar to tos-overlay
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.style.display = 'none';
      iframe.src = '';
      document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.style.display === 'flex') {
        closeModal();
      }
    });

    // Initialize
    fetchGames();
  </script>
</body>
</html>
