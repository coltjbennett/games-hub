<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Hub</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Styling */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand svg {
      fill: var(--accent-color);
      width: 32px;
      height: 32px;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .search-container {
      position: relative;
      flex: 1;
      max-width: 400px;
    }

    .search-input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .search-icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
    }

    /* Main Grid Layout */
    main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 1.5rem;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 2rem;
      }
    }

    /* Game Card */
    .game-card {
      background-color: transparent;
      border-radius: var(--border-radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, filter 0.2s ease;
      position: relative;
    }

    .game-card:hover {
      transform: translateY(-6px);
    }

    .icon-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 22%;
      background-color: var(--card-bg);
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-card:hover .icon-wrapper {
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .game-icon {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .game-title {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Loading Spinner & Status Messages */
    .status-container {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid var(--accent-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Modal Styling */
    .modal {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 1100px;
      height: 85vh;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-header {
      background-color: var(--card-bg);
      padding: 0.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .modal-controls {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      background: var(--card-hover);
      color: var(--text-main);
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-color);
    }

    .modal-body {
      flex: 1;
      width: 100%;
      height: 100%;
      background-color: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H9v2H8v-2H6v-1h2V10h1v2h2v1zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      <h1>Arcade Hub</h1>
    </div>

    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="search" class="search-input" placeholder="Search games...">
    </div>
  </header>

  <main>
    <div id="grid" class="grid">
      <div class="status-container">
        <div class="spinner"></div>
        <p>Loading arcade library...</p>
      </div>
    </div>
  </main>

  <!-- Game Modal -->
  <div id="game-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modal-title" class="modal-title">Game Title</span>
        <div class="modal-controls">
          <a id="modal-external-link" href="#" target="_blank" class="btn">Launch in New Tab ↗</a>
          <button id="modal-close" class="btn">Close ✕</button>
        </div>
      </div>
      <div class="modal-body">
        <iframe id="game-iframe" src="" allow="autoplay; keyboard; fullscreen"></iframe>
      </div>
    </div>
  </div>

  <script>
    const REPO_OWNER = 'coltjbennett';
    const REPO_NAME = 'source';
    
    // Extensions/filenames to check for game icons
    const ICON_CANDIDATES = ['icon.png', 'icon.webp', 'icon.jpg', 'icon.svg', 'logo.png', 'app.png'];

    let games = [];

    // SVG Fallback Icon (Arcade Controller)
    const FALLBACK_ICON = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="%236366f1"><rect width="100" height="100" rx="20" fill="%231e293b"/><path d="M70 30H30C21.7 30 15 36.7 15 45v10c0 8.3 6.7 15 15 15h40c8.3 0 15-6.7 15-15V45c0-8.3-6.7-15-15-15zm-35 22h-5v5h-4v-5h-5v-4h5v-5h4v5h5v4zm27-1c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3zm8-6c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3z" fill="%236366f1"/></svg>`;

    async function fetchGames() {
      const grid = document.getElementById('grid');
      try {
        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`);
        if (!response.ok) throw new Error('Failed to fetch repo contents.');

        const data = await response.json();

        // Filter only directories (excluding hidden ones like .github)
        const folders = data.filter(item => item.type === 'dir' && !item.name.startsWith('.'));

        if (folders.length === 0) {
          grid.innerHTML = `<div class="status-container"><p>No game folders found in repository.</p></div>`;
          return;
        }

        games = folders.map(folder => ({
          name: folder.name,
          title: formatTitle(folder.name),
          path: `./${folder.name}/index.html`
        }));

        renderGrid(games);
      } catch (err) {
        grid.innerHTML = `<div class="status-container"><p>Error loading games. Please check repository settings or API limits.</p></div>`;
        console.error(err);
      }
    }

    function formatTitle(folderName) {
      return folderName
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function renderGrid(gameList) {
      const grid = document.getElementById('grid');
      if (gameList.length === 0) {
        grid.innerHTML = `<div class="status-container"><p>No games matching your search.</p></div>`;
        return;
      }

      grid.innerHTML = gameList.map((game) => `
        <div class="game-card" onclick="openGame('${game.path}', '${game.title.replace(/'/g, "\\'")}')">
          <div class="icon-wrapper">
            <img 
              class="game-icon" 
              src="./${game.name}/icon.png" 
              alt="${game.title}"
              onerror="tryNextIcon(this, '${game.name}', 1)"
            />
          </div>
          <div class="game-title">${game.title}</div>
        </div>
      `).join('');
    }

    // Function to handle cascading fallback for game icons
    function tryNextIcon(imgElement, folderName, index) {
      if (index < ICON_CANDIDATES.length) {
        imgElement.onerror = () => tryNextIcon(imgElement, folderName, index + 1);
        imgElement.src = `./${folderName}/${ICON_CANDIDATES[index]}`;
      } else {
        imgElement.onerror = null;
        imgElement.src = FALLBACK_ICON;
      }
    }

    // Search Filtering
    document.getElementById('search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = games.filter(g => g.title.toLowerCase().includes(term) || g.name.toLowerCase().includes(term));
      renderGrid(filtered);
    });

    // Modal Player Handling
    const modal = document.getElementById('game-modal');
    const iframe = document.getElementById('game-iframe');
    const modalTitle = document.getElementById('modal-title');
    const externalLink = document.getElementById('modal-external-link');
    const closeBtn = document.getElementById('modal-close');

    function openGame(url, title) {
      iframe.src = url;
      modalTitle.textContent = title;
      externalLink.href = url;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden'; // Prevent background scrolling
    }

    function closeModal() {
      modal.classList.remove('active');
      iframe.src = '';
      document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });

    // Initialize
    fetchGames();
  </script>
</body>
</html>
