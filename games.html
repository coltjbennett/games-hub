<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000080" />
  <title>the Web Arcade</title>
  <link rel="icon" href="images/icon.JPG">
  <link rel="stylesheet" href="styles.css" />
  
  <!-- Preload Ruffle Globally -->
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
  </script>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    /* Arcade Hub is a Win95 application inside the desktop shell, not a desktop. */
    html, body {
      height: auto !important;
      min-height: 100%;
      overflow-x: hidden !important;
      overflow-y: auto !important;
      background: #c0c0c0;
      color: #000;
      font-family: "W95FA", "MS Sans Serif", Tahoma, sans-serif;
      font-size: 14px;
      line-height: 1.2;
      overscroll-behavior-y: contain;
    }
    body { margin: 0; padding: 12px; }
    *, *::before, *::after { box-sizing: border-box; }
    button, input { font: inherit; }
    button, .arcade-card { cursor: pointer; }
    .page-shell {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 0 0 18px !important;
    }
    header { margin: 0 0 12px; background: transparent !important; }
    .panel, .panel-dark {
      background: #c0c0c0;
      color: #000;
      padding: 3px;
      border: 0;
      border-radius: 0;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff,
                  inset -2px -2px #808080, inset 2px 2px #dfdfdf;
    }
    .panel-title-bar {
      min-height: 22px;
      display: flex;
      align-items: center;
      padding: 3px 6px;
      gap: 8px;
      background: #000080 !important;
      color: #fff !important;
      font-weight: bold;
      text-shadow: none !important;
    }
    .panel-title-bar > span:first-child { flex: 1; }
    .panel-body { padding: 12px; }
    .header-top-banner {
      display: inline-block;
      padding: 3px 7px;
      margin-bottom: 8px;
      background: #c0c0c0;
      color: #000080;
      border: 1px solid #808080;
      box-shadow: inset 1px 1px #fff;
      font-weight: bold;
    }
    h1 { margin: 0 0 6px; font-size: 1.5rem; font-weight: bold; }
    p { margin: 6px 0; }
    .hero-copy { margin-bottom: 0; }
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 0 10px;
      border-bottom: 1px solid #808080;
      box-shadow: 0 1px #fff;
      margin-bottom: 10px;
    }
    .hint { margin: 0; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .search-input {
      width: min(250px, 100%);
      min-width: 150px;
      min-height: 25px;
      padding: 4px 5px;
      background: #fff;
      color: #000;
      border: 0;
      border-radius: 0;
      box-shadow: inset -1px -1px #fff, inset 1px 1px #808080,
                  inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
    }
    .sort-btn {
      min-height: 25px;
      padding: 4px 10px;
      border: 0;
      border-radius: 0;
      background: #c0c0c0;
      color: #000;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff,
                  inset -2px -2px #808080, inset 2px 2px #dfdfdf;
    }
    .sort-btn:active {
      box-shadow: inset -1px -1px #fff, inset 1px 1px #0a0a0a,
                  inset -2px -2px #dfdfdf, inset 2px 2px #808080;
      padding: 5px 9px 3px 11px;
    }
    .arcade-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 8px;
      align-items: stretch;
    }
    .arcade-card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 3px;
      background: #c0c0c0;
      color: #000;
      border: 0;
      border-radius: 0;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff,
                  inset -2px -2px #808080, inset 2px 2px #dfdfdf;
      text-align: left;
      transition: none !important;
    }
    .arcade-card:hover { background: #d4d4d4; }
    .arcade-card:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
    .arcade-card:active { box-shadow: inset -1px -1px #fff, inset 1px 1px #0a0a0a,
                          inset -2px -2px #dfdfdf, inset 2px 2px #808080; }
    .arcade-card .card-image {
      aspect-ratio: 1 / 1;
      padding: 5px;
      background: #fff;
      border: 1px solid #808080;
      box-shadow: inset 1px 1px #0a0a0a, inset -1px -1px #fff;
    }
    .arcade-card .card-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
      border: 0;
      image-rendering: auto;
    }
    .arcade-card .card-body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 7px 5px 5px;
    }
    .arcade-card h3 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
      text-align: center;
      overflow-wrap: anywhere;
      font-weight: normal;
    }
    .status-container {
      grid-column: 1 / -1;
      padding: 24px 12px;
      text-align: center;
      color: #000;
      background: #fff;
      border: 1px solid #808080;
      box-shadow: inset 1px 1px #0a0a0a, inset -1px -1px #dfdfdf;
      line-height: 1.4;
    }
    footer {
      padding: 10px 4px 0;
      color: #fff;
      text-align: center;
    }
    footer p { margin: 4px 0; }
    .footer-note { font-weight: bold; }
    #game-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      flex-direction: column;
      background: #000;
    }
    #game-modal .panel-title-bar {
      flex: 0 0 28px;
      min-height: 28px;
      padding: 4px 6px;
    }
    #game-modal .win-btns { display: flex; }
    #game-modal .btn-close {
      width: 20px;
      height: 19px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #c0c0c0;
      color: #000;
      font-weight: bold;
      line-height: 1;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff,
                  inset -2px -2px #808080, inset 2px 2px #dfdfdf;
    }
    #game-container { flex: 1; min-height: 0; width: 100%; background: #000; overflow: hidden; }
    #game-container iframe, #game-container ruffle-player { display: block; width: 100%; height: 100%; border: 0; }
    @media (max-width: 520px) {
      body { padding: 6px; }
      .panel-body { padding: 8px; }
      .arcade-grid { grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 6px; }
      .controls-row { align-items: stretch; }
      .toolbar { width: 100%; }
      .search-input { flex: 1; width: auto !important; }
    }
  </style>
</head>
<body>

  <div class="page-shell" style="padding-bottom: 20px;">
    <!-- AN IMPORTANT NOTE; THIS IS NOT MY GAMES!!! THEY ARE 3RD PARTY GAMES LIKE COOKIE CLICKER AND BAD PIGGIES!!! NOT MY GAMES HOSTED ON THE HOMEPAGE!-->
    <!-- Header -->
    <header>
      <div class="panel-dark">
        <div class="panel-title-bar w95-text">
          <span>ARCADE HUB</span>
        </div>
        <div class="panel-body">
          <div class="header-top-banner">GAME DIRECTORY</div>
          <h1>ARCADE HUB</h1>
          <p class="hero-copy">Browse, search, and play games directly from the repository.</p>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <div class="panel">
        <div class="panel-title-bar w95-text">
          <span>GAME LIBRARY</span>
        </div>
        <div class="panel-body">
          
          <!-- Search Toolbar -->
          <div class="controls-row">
            <p class="hint">Type to filter games below.</p>
            <div class="toolbar">
              <input type="text" id="search" class="search-input" placeholder="Search games..." style="width: 250px;">
              <button id="refresh-btn" class="sort-btn w95-text" onclick="fetchGames(true)">Refresh API</button>
            </div>
          </div>

          <!-- Game Grid -->
          <div id="grid" class="arcade-grid">
            <div class="status-container">Loading arcade library... please wait.</div>
          </div>

        </div>
      </div>
    </main>
    
    <!-- Footer -->
    <footer>
      <p>Powered by GitHub API & Githack CDN</p>
      <p class="footer-note w95-text">Best viewed with a monitor</p>
    </footer>

  </div>

  <!-- Full-Window Game Viewport (Replaces Modal Window) -->
  <div id="game-modal">
    <div class="panel-title-bar w95-text">
      <span id="modal-title" style="font-weight: bold; font-size: 0.9rem;">Game Player</span>
      <span class="win-btns">
        <button type="button" class="win-btn btn-close" onclick="closeModal()" aria-label="Close">✕</button>
      </span>
    </div>
    <div id="game-container"></div>
  </div>

  <script>
    const REPO_OWNER = 'coltjbennett';
    const REPO_NAME = 'source';
    const BRANCH = 'main'; 
    
    // Updated to Githack to ensure HTML and SWF files execute rather than render as text
    const CDN_BASE = `https://raw.githack.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}`;
    
    const ICON_CANDIDATES = ['icon.png', 'icon.webp', 'icon.jpg', 'icon.jpeg', 'logo.jpeg', 'logo.jpg', 'icon.svg', 'logo.png', 'app.png'];
    const FALLBACK_ICON = 'images/missing.png';

    let games = [];

    function safeStorageGet(key) {
      try { return localStorage.getItem(key); } catch (error) { return null; }
    }

    function safeStorageSet(key, value) {
      try { localStorage.setItem(key, value); } catch (error) { /* cache is optional */ }
    }

    async function fetchGames(forceRefresh = false) {
      const grid = document.getElementById('grid');
      if (forceRefresh) {
        grid.innerHTML = `<div class="status-container">Forcing API refresh... please wait.</div>`;
      } else {
        grid.innerHTML = `<div class="status-container">Loading arcade library... please wait.</div>`;
      }
      
      try {
        let data;
        const cachedData = safeStorageGet('arcade_games_cache');
        const lastFetchDate = safeStorageGet('arcade_games_cache_date');
        const today = new Date().toDateString();
        const needsDailyUpdate = lastFetchDate !== today;

        if (cachedData && !forceRefresh && !needsDailyUpdate) {
          data = JSON.parse(cachedData);
        } else {
          const request = new Request(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`, { cache: 'no-store' });
        const response = await fetch(request);
          
          if (response.status === 403 || response.status === 429) {
            if (cachedData) {
              console.warn('API rate limit reached. Falling back to cached data.');
              data = JSON.parse(cachedData);
            } else {
              throw new Error('GitHub API rate limit exceeded (60 requests per hour). No local cache available to load.');
            }
          } else if (!response.ok) {
            throw new Error('Failed to fetch repo contents.');
          } else {
            data = await response.json();
            safeStorageSet('arcade_games_cache', JSON.stringify(data));
            safeStorageSet('arcade_games_cache_date', today);
          }
        }

        if (!Array.isArray(data)) throw new Error('GitHub returned an unexpected directory listing.');

        const validItems = data.filter(item => {
          if (!item || typeof item.name !== 'string' || typeof item.type !== 'string') return false;
          if (item.name.startsWith('.')) return false;
          return item.type === 'dir' || (item.type === 'file' && item.name.toLowerCase().endsWith('.swf'));
        });

        if (validItems.length === 0) {
          grid.innerHTML = `<div class="status-container">No games or SWF files found in repository.</div>`;
          return;
        }

        games = validItems.map(item => {
          const isSwf = item.type === 'file' && item.name.toLowerCase().endsWith('.swf');
          const baseName = isSwf ? item.name.replace(/\.swf$/i, '') : item.name;

          return {
            name: item.name,
            baseName: baseName, 
            title: formatTitle(baseName),
            path: isSwf 
              ? `${CDN_BASE}/${encodeURIComponent(item.name)}` 
              : `${CDN_BASE}/${encodeURIComponent(item.name)}/index.html`,
            isSwf: isSwf
          };
        });

        renderGrid(games);
      } catch (err) {
        // The directory snapshot is already kept in localStorage; avoid a
      // duplicate Cache Storage copy.
      if (cachedData) {
        try {
          games = JSON.parse(cachedData).filter(item => item && typeof item.name === 'string' && (item.type === 'dir' || (item.type === 'file' && item.name.toLowerCase().endsWith('.swf')))).map(item => {
            const isSwf = item.type === 'file' && item.name.toLowerCase().endsWith('.swf');
            const baseName = isSwf ? item.name.replace(/\.swf$/i, '') : item.name;
            return { name:item.name, baseName, title:formatTitle(baseName), path:isSwf ? `${CDN_BASE}/${encodeURIComponent(item.name)}` : `${CDN_BASE}/${encodeURIComponent(item.name)}/index.html`, isSwf };
          });
          renderGrid(games);
          const note = document.createElement('div');
          note.className = 'status-container';
          note.textContent = 'Showing the last cached Arcade Hub directory.';
          grid.prepend(note);
          console.warn(err);
          return;
        } catch (localCacheError) {
          console.warn('Arcade local snapshot fallback failed:', localCacheError);
        }
      }
        grid.innerHTML = `<div class="status-container">${err.message}</div>`;
        console.error(err);
      }
    }

    function formatTitle(folderName) {
      return folderName
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function renderGrid(gameList) {
      const grid = document.getElementById('grid');
      grid.replaceChildren();

      if (gameList.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'status-container';
        empty.textContent = 'No games matching your search.';
        grid.appendChild(empty);
        return;
      }

      gameList.forEach((game) => {
        const card = document.createElement('div');
        card.className = 'project-card arcade-card';
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `Open ${game.title}`);
        card.addEventListener('click', () => openGame(game.path, game.isSwf, game.title));
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openGame(game.path, game.isSwf, game.title);
          }
        });

        const imageWrap = document.createElement('div');
        imageWrap.className = 'card-image';
        const img = document.createElement('img');
        img.alt = game.title;
        img.loading = 'lazy';
        img.decoding = 'async';
        img.onerror = () => tryNextIcon(img, game.baseName, 0);
        img.src = `${CDN_BASE}/${encodeURIComponent(game.baseName)}/icon.png`;
        imageWrap.appendChild(img);

        const body = document.createElement('div');
        body.className = 'card-body';
        const heading = document.createElement('h3');
        heading.textContent = game.title;
        body.appendChild(heading);

        card.append(imageWrap, body);
        grid.appendChild(card);
      });
    }

    function tryNextIcon(imgElement, folderName, index) {
      if (index < ICON_CANDIDATES.length) {
        imgElement.onerror = () => tryNextIcon(imgElement, folderName, index + 1);
        imgElement.src = `${CDN_BASE}/${encodeURIComponent(folderName)}/${encodeURIComponent(ICON_CANDIDATES[index])}`;
      } else {
        imgElement.onerror = null;
        imgElement.src = FALLBACK_ICON;
      }
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = games.filter(g => g.title.toLowerCase().includes(term) || g.name.toLowerCase().includes(term));
      renderGrid(filtered);
    });

    // ===== ACTIVE GAME SYNC =====
    // Arcade Hub reports the game currently occupying its own viewport to the
    // parent launcher. The parent then forwards the activity to the chatroom.
    let activeArcadeGameTitle = "";
    let arcadeActivityTimer = null;

    function notifyParentActivity(name, active = true) {
      if (!window.parent || window.parent === window) return;

      window.parent.postMessage({
        source: 'arcade-hub',
        kind: 'activity',
        active,
        name: name || 'Arcade Hub',
        activityKind: name && name !== 'Arcade Hub' ? 'arcade-game' : 'arcade'
      }, window.location.origin);
    }

    function stopArcadeActivityMonitor() {
      if (arcadeActivityTimer) {
        clearInterval(arcadeActivityTimer);
        arcadeActivityTimer = null;
      }
    }

    function startArcadeActivityMonitor(title) {
      stopArcadeActivityMonitor();

      activeArcadeGameTitle = title || "";
      notifyParentActivity(activeArcadeGameTitle || 'Arcade Hub', true);

      // Cross-origin HTML5 game iframes cannot be inspected directly. The
      // Arcade Hub can still see which child iframe currently has focus.
      arcadeActivityTimer = setInterval(() => {
        if (document.hidden || !activeArcadeGameTitle) return;

        const modal = document.getElementById('game-modal');
        if (!modal || modal.style.display === 'none') return;

        const gameFrame = document.querySelector('#game-container iframe');
        const rufflePlayer = document.querySelector('#game-container ruffle-player, #game-container > ruffle-player');

        if (gameFrame && document.activeElement === gameFrame) {
          notifyParentActivity(activeArcadeGameTitle, true);
        } else if (rufflePlayer && (
          document.activeElement === rufflePlayer ||
          rufflePlayer.matches(':focus-within')
        )) {
          notifyParentActivity(activeArcadeGameTitle, true);
        }
      }, 500);
    }

    function notifyArcadeHubActivity() {
      stopArcadeActivityMonitor();
      activeArcadeGameTitle = "";
      notifyParentActivity('Arcade Hub', true);
    }

    // Opens both HTML5 and Flash/SWF games to fill the entire Arcade Hub window
    function openGame(url, isSwf, title) {
      const modal = document.getElementById('game-modal');
      const container = document.getElementById('game-container');
      let safeUrl;
      try {
        safeUrl = new URL(url, window.location.href);
      } catch (error) {
        console.error('Invalid game URL:', error);
        return;
      }
      if (safeUrl.protocol !== 'https:' && safeUrl.protocol !== 'http:') {
        console.error('Blocked unsupported game URL scheme:', safeUrl.protocol);
        return;
      }

      // Update Title Bar
      document.getElementById('modal-title').innerText = title + (isSwf ? ' - Flash Arcade' : ' - HTML Arcade');

      // Clear previous content
      container.replaceChildren();

      if (isSwf) {
        // Embed Ruffle Player for SWF files
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        player.style.width = '100%';
        player.style.height = '100%';

        container.appendChild(player);
        player.load(safeUrl.href);

        player.addEventListener('mousedown', () => notifyParentActivity(title, true));
        player.addEventListener('touchstart', () => notifyParentActivity(title, true), { passive: true });
      } else {
        // Embed iframe for HTML5 games
        const iframe = document.createElement('iframe');
        iframe.src = safeUrl.href;
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.allow = 'autoplay; fullscreen; keyboard';
        iframe.referrerPolicy = 'no-referrer';
        iframe.title = title;

        iframe.addEventListener('load', () => {
          notifyParentActivity(title, true);
        });

        container.appendChild(iframe);
      }

      // Display full game viewport
      modal.style.display = 'flex';

      // Tell the parent immediately, then keep checking child-frame focus.
      startArcadeActivityMonitor(title);
    }

    // Close Game Viewport and return to game library
    function closeModal() {
      const modal = document.getElementById('game-modal');
      const container = document.getElementById('game-container');

      modal.style.display = 'none';
      container.replaceChildren();
      notifyArcadeHubActivity();
    }

    // The Arcade Hub itself is an active site window once it has loaded.
    window.addEventListener('load', () => {
      notifyArcadeHubActivity();
    });

    window.addEventListener('mousedown', (event) => {
      // Clicking the game modal's controls or library means Arcade Hub is
      // the active floating window. Opening a game immediately reasserts
      // the game title through openGame().
      if (event.target.closest('#game-modal') || event.target.closest('.arcade-card')) {
        notifyParentActivity(activeArcadeGameTitle || 'Arcade Hub', true);
      }
    }, true);

    window.addEventListener('beforeunload', () => {
      notifyParentActivity('Arcade Hub', false);
    });

    fetchGames(false);
  </script>
</body>
</html>
